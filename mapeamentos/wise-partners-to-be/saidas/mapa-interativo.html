ortal", "rodada": 6, "para": ["PE-01"], "canal": "artifact", "perguntas": ["Q-0045", "Q-0046", "Q-0047", "Q-0048", "Q-0049", "Q-0050", "Q-0051", "Q-0052", "Q-0053", "Q-0054", "Q-0055", "Q-0056", "Q-0057"], "introducao": "Último formulário antes de levar o to-be ao portal.", "link": "https://claude.ai/artifact/ErCdBFw4dwso4pcz9RbUEw", "status": "enviado", "enviado_em": "2026-11-05", "prazo": "", "identificacao": false}], "contradicoes": [{"id": "CT-01", "descricao": "Comissão em dinheiro, igual para todos e paga só na aquisição. O patrocinador decidiu regra única, sem exceção. Referral Engine, Business of Belonging, Strategic Alliances, o Método Octo e Platform Revolution dizem que a comissão sozinha é motivação fraca e passageira, que ela atrai quem só toma e que o incentivo deveria premiar também a permanência e o comportamento.", "elemento": "F-029", "evidencias": ["EV-0024", "EV-0118", "EV-0072", "EV-0071", "EV-0114", "EV-0252", "EV-0253"], "status": "resolvida", "pergunta": "Q-0015", "resolucao": "Meio-termo: dinheiro igual para todos; o não monetário varia por tipo de parceiro; a regra é revista depois de dois trimestres com dados de permanência.", "evidencias_resolucao": ["EV-0029"], "lado_patrocinador": ["EV-0024", "EV-0118"], "lado_livros": ["EV-0072", "EV-0071", "EV-0114", "EV-0252", "EV-0253"]}, {"id": "CT-02", "descricao": "Retorno do closer ao Gerente. O patrocinador decidiu que o lead vai direto ao closer, sem SLA e sem registro, com conversa só quando há indicação ou proposta nova. Referral Engine, Give and Take, Never Eat Alone, Channel Advantage e Customer Success dizem que o parceiro abandona quando não sabe o que aconteceu com a indicação, e que cada passagem precisa de registro e de sinal que vire ação.", "elemento": "P-33", "evidencias": ["EV-0009", "EV-0025", "EV-0065", "EV-0066", "EV-0068", "EV-0096", "EV-0254", "EV-0061"], "status": "resolvida", "pergunta": "Q-0016", "resolucao": "Cada closer avisa o Gerente por WhatsApp a cada mudança de etapa, sem portal; o Gerente registra a etapa e devolve ao parceiro.", "evidencias_resolucao": ["EV-0026"], "lado_patrocinador": ["EV-0009", "EV-0025"], "lado_livros": ["EV-0065", "EV-0066", "EV-0068", "EV-0096", "EV-0254", "EV-0061"]}, {"id": "CT-03", "descricao": "Três pilares abertos para todos desde o primeiro parceiro. O patrocinador decidiu abrir Prateleira, Base Ativa e indicações juntos. Keystone, Business of Belonging, Winning the Right Game, o Método Octo e Nearbound dizem para provar o valor numa escala pequena antes de abrir tudo: poucos parceiros, um formato que se repete e só então a expansão.", "elemento": "F-022", "evidencias": ["EV-0018", "EV-0084", "EV-0077", "EV-0255", "EV-0256", "EV-0257"], "status": "resolvida", "pergunta": "Q-0017", "resolucao": "Segue o Playbook v3.1: a entrega sobe em escada pelo pacote (C, B, A), conforme a capacidade do parceiro de devolver; abrir mais é orgânico. Converge com os livros que pedem começar pequeno.", "evidencias_resolucao": ["EV-0019"], "lado_patrocinador": ["EV-0018"], "lado_livros": ["EV-0084", "EV-0077", "EV-0255", "EV-0256", "EV-0257"]}, {"id": "CT-04", "descricao": "Um só dono para todas as tarefas. O patrocinador decidiu que o Gerente é dono de tudo, mesmo do que outros executam. O Método Octo e Customer Success apoiam o dono único no começo, mas Customer Success põe teto de parceiros por gerente, e Business of Belonging e Give and Take dizem que quem faz o trabalho de várias pessoas se esgota e que a escala vem de distribuir o controle com trilhos.", "elemento": "PA-01", "evidencias": ["EV-0005", "EV-0258", "EV-0091", "EV-0259", "EV-0260"], "status": "resolvida", "pergunta": "Q-0018", "resolucao": "Mantido: o Gerente é dono de todas as tarefas, sem teto, como o Método Octo e Customer Success recomendam para o início. As horas dedicadas entram no painel da semana para acompanhar o risco de sobrecarga.", "evidencias_resolucao": ["EV-0030"], "lado_patrocinador": ["EV-0005"], "lado_livros": ["EV-0258", "EV-0091", "EV-0259", "EV-0260"]}, {"id": "CT-05", "descricao": "Nível de entrada pela promessa. A especificação aprovada põe o parceiro em Elite, Premium ou Select já na entrada, pela quantidade de clientes no ICP que ele declara. Bech diz para começar com estrutura simples e diferenciar só quando o desempenho real se mostrar diferente, porque com poucos parceiros todos querem o nível de cima e depois é preciso rebaixar.", "elemento": "P-69", "evidencias": ["EV-0261", "EV-0262", "EV-0263"], "status": "resolvida", "pergunta": "Q-0019", "resolucao": "Mantida a especificação e o Playbook v3.1: o nível mede potencial pela faixa de clientes no ICP; o pacote, que exige contrapartida, é o que libera as entregas.", "evidencias_resolucao": ["EV-0032"], "lado_patrocinador": ["EV-0261"], "lado_livros": ["EV-0262", "EV-0263"]}, {"id": "CT-06", "descricao": "O CAC decide tudo desde o início. O patrocinador definiu o programa como canal de aquisição mais barato, julgado pelo CAC. Keystone, Give and Take, Customer Success e Business of Belonging dizem que o valor ao parceiro vem antes da captura, que dar esperando retorno rápido não funciona e que a comunidade só entrega resultado de negócio depois de seis a doze meses.", "elemento": "F-001", "evidencias": ["EV-0023", "EV-0027", "EV-0037", "EV-0038", "EV-0264", "EV-0265"], "status": "resolvida", "pergunta": "Q-0014", "resolucao": "O patrocinador seguiu os livros: CAC do Wise Partners e valor devolvido ao parceiro ficam lado a lado no painel, com o mesmo peso, em todas as fases.", "evidencias_resolucao": ["EV-0028"], "lado_patrocinador": ["EV-0023", "EV-0027"], "lado_livros": ["EV-0037", "EV-0038", "EV-0264", "EV-0265"]}, {"id": "CT-07", "descricao": "Medir o equilíbrio entre dar e receber. Na Rodada 3, o patrocinador aprovou o cubo, em que a Relação inclui o equilíbrio entre indicações enviadas e recebidas, e o princípio da reciprocidade visível de Give and Take. Never Eat Alone diz o contrário: dar primeiro e nunca manter placar. O próprio Ferrazzi, porém, pede que quem troca redes seja parceiro igual, que dá tanto quanto recebe.", "elemento": "F-013", "evidencias": ["EV-0129", "EV-0035", "EV-0074", "EV-0075", "EV-0041", "EV-0266", "EV-0267"], "status": "resolvida", "pergunta": "Q-0023", "resolucao": "Meio-termo: o equilíbrio é medido só por dentro, para o cubo; o parceiro nunca vê placar, e na comunidade aparece o dar, não a conta.", "evidencias_resolucao": ["EV-0033"], "lado_patrocinador": ["EV-0129", "EV-0035", "EV-0074", "EV-0075"], "lado_livros": ["EV-0041", "EV-0266", "EV-0267"]}], "decisoes": [{"id": "DE-01", "data": "2026-11-05", "texto": "A especificação e o web app prevalecem sobre o Playbook v3.1, que está desatualizado.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0015", "EV-0016"]}, {"id": "DE-02", "data": "2026-11-05", "texto": "O to-be é refeito do zero a partir dos modelos conceituais dos livros, com mais processos e mais detalhe, mesmo que mude 100% do desenho anterior.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0017"]}, {"id": "DE-03", "data": "2026-11-05", "texto": "Os três pilares existem desde o primeiro parceiro, mas a entrega a cada um segue a escada de pacotes do Playbook v3.1: o que o parceiro recebe acompanha o que ele consegue devolver, e abrir mais é orgânico.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0018", "EV-0019", "EV-0020"]}, {"id": "DE-04", "data": "2026-11-05", "texto": "Metas e horas não são fixadas agora: o desenho guarda só a capacidade de definir metas e de gerir o tempo dedicado ao programa.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0021", "EV-0022"]}, {"id": "DE-05", "data": "2026-11-05", "texto": "A comunicação com os parceiros fica na comunidade Wise Partners no WhatsApp; o portal não vira canal de conversa.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0012"]}, {"id": "DE-06", "data": "2026-11-05", "texto": "Todas as tarefas do portal têm o Gerente de Parcerias como dono, mesmo quando outra pessoa executa; consultores e comercial não entram no portal.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0005"]}, {"id": "DE-07", "data": "2026-11-05", "texto": "O programa é um canal de aquisição de receita mais barato que os canais ativos; a comissão só barateia ainda mais o CAC e nada deve complicar o programa a ponto de reduzir a adesão.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0023"]}, {"id": "DE-08", "data": "2026-11-05", "texto": "A comissão é regra única, sem exceção por parceiro.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0024"]}, {"id": "DE-09", "data": "2026-11-05", "texto": "O lead vai direto ao closer da empresa do grupo; o Gerente conversa com o closer quando há indicação ou proposta nova, sem SLA interno, e combina com cada closer um aviso curto por WhatsApp a cada mudança de etapa.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0009", "EV-0025", "EV-0026"]}, {"id": "DE-10", "data": "2026-11-05", "texto": "Toda semana, o Gerente conversa com o Igor sobre os parceiros, apoiado num painel simples e estratégico que permite discutir caso a caso.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0025"]}, {"id": "DE-11", "data": "2026-11-05", "texto": "O CAC acompanhado é só o do Wise Partners; ninguém informa o CAC de outros canais no portal.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0027"]}, {"id": "DE-12", "data": "2026-11-05", "texto": "O CAC do Wise Partners e o valor devolvido ao parceiro ficam lado a lado no painel, com o mesmo peso, em todas as fases.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0028"]}, {"id": "DE-13", "data": "2026-11-05", "texto": "A comissão em dinheiro é igual para todos; o que varia por tipo de parceiro é o não monetário (acesso, palco, apoio); a regra é revista depois de dois trimestres com dados de permanência.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0029"]}, {"id": "DE-14", "data": "2026-11-05", "texto": "O Gerente continua dono de todas as tarefas, sem teto; as horas dedicadas aparecem no painel da semana.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0030", "EV-0031"]}, {"id": "DE-15", "data": "2026-11-05", "texto": "O nível de entrada segue a especificação: faixa de clientes no ICP.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0032"]}, {"id": "DE-16", "data": "2026-11-05", "texto": "O equilíbrio entre dar e receber é medido só por dentro, para o cubo; o parceiro nunca vê placar, e na comunidade aparece o dar.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0033"]}, {"id": "DE-17", "data": "2026-11-05", "texto": "O Gerente decide o desligamento e o Igor assina o aviso formal.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0034"]}, {"id": "DE-18", "data": "2026-11-05", "texto": "As decisões do patrocinador não pesam mais que os livros: onde divergem, a divergência é registrada e conciliada.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0035"]}, {"id": "DE-19", "data": "2026-11-05", "texto": "O Diretor só assina o termo; o Gerente de Parcerias negocia com autonomia.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0007"]}, {"id": "DE-20", "data": "2026-11-05", "texto": "A Prateleira pede ao fornecedor só contrapartida não financeira (ação conjunta ou condição comercial para a indústria).", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0023"]}, {"id": "DE-21", "data": "2026-11-05", "texto": "Passo a passo detalhado só para os processos que viram quadro, fila ou ritual; os demais ficam no nível de dono, gatilho e entregas.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0036"]}, {"id": "DE-22", "data": "2026-11-05", "texto": "Os subprocessos de cálculo do cubo (Valor, Ritmo, Relação e leitura do tipo) rodam no portal, sem outro papel além do dono.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0129"], "aceita_lacunas": ["P-65.participantes", "P-66.participantes", "P-67.participantes", "P-68.participantes"]}], "glossario": [{"id": "GL-01", "termo": "Tipo Embaixador", "definicao": "V alto, R alto, Q alto (AAA). Ação: Proteger e alavancar. Pedir dois movimentos por trimestre: uma indicação nova de alta qualidade e um movimento conjunto (caso de sucesso, ação na Base Ativa ou resposta a uma RFP da Prateleira). Conferir os números reais da relação: o livro alerta que muitos Evangelistas não são os mais lucrativos. Usar como piloto de novas jogadas. Abordagem: Tom de sócio: reconhecimento, acesso antecipado às RFPs da Prateleira, co-marketing, novidades das empresas do grupo. Mensagens constantes e conservadoras, sem mudar o processo de repente, e uma iniciativa nova de tempos em tempos para não virar acomodação. Nenhuma exceção de comissão (regra única). Cadência: Ligação ou conversa mensal com o gerente, grupo de WhatsApp conforme a demanda, revisão trimestral conjunta com dados.", "sinonimos": [], "evidencias": ["EV-0131", "EV-0186"]}, {"id": "GL-02", "termo": "Tipo Gerador sob tensão", "definicao": "V alto, R alto, Q baixo (AAB). Ação: Diagnosticar em 7 dias úteis a causa da tensão (lead sem retorno do closer, comissão percebida como injusta, expectativa de volume, concorrência) e fazer uma revisão conjunta extra em 30 dias, com os números das indicações, retornos, comissão paga e receita gerada. Resolver pela conversa de negócio e não pela de relacionamento. Abordagem: Direta e baseada em dados, com o ROI dele e o que a Wise investiu; entender o modelo de negócio do parceiro antes de explicar o da Wise. Falar com o decisor dele. Não oferecer exceção de comissão. Alavancas legítimas: prioridade de retorno dos closers, acesso à Prateleira e co-marketing. Registrar tudo o que for combinado. Cadência: Quinzenal até Q maior ou igual a 70 por dois meses; revisão extra em 30 dias.", "sinonimos": [], "evidencias": ["EV-0131", "EV-0186"]}, {"id": "GL-03", "termo": "Tipo Âncora esfriando", "definicao": "V alto, R baixo, Q alto (ABA). Ação: Reativar em 7 dias após a recência passar de 30 dias, com um motivo concreto: uma RFP da Prateleira aderente ao perfil, um cruzamento de carteiras ou uma ação na Base Ativa. Confirmar quem é o responsável do lado dele. Abordagem: Sem cobrança, com utilidade: chegar com oportunidade pronta e reconhecer o resultado passado (ajudar primeiro). Pedir 15 minutos. Na variante rebelde: reafirmar objetivos, auditar investimentos dos dois lados e não trocar o contato-chave sem consentimento. Cadência: Quinzenal até duas leituras seguidas de Ritmo alto.", "sinonimos": [], "evidencias": ["EV-0131", "EV-0186"]}, {"id": "GL-04", "termo": "Tipo Valioso em risco", "definicao": "V alto, R baixo, Q baixo (ABB). Ação: Decidir em 15 dias se vale o investimento (o livro chama isso de decisão crítica). Se vale: ligação do gerente em 48 horas, ligação de cortesia de uma pessoa sênior do grupo se não houver resposta em 10 dias (gesto de relação, não aprovação), corrigir pendências (leads sem retorno, comissões em aberto) e combinar um objetivo curto e tangível. Abordagem: Ouvir primeiro, reconhecer falhas e tratar como parceria nova, com horizonte de 6 a 12 meses. Se a queixa for com uma pessoa, oferecer outro interlocutor (por exemplo, o líder do closer). Evitar campanhas genéricas. Cadência: Semanal por 6 semanas, depois quinzenal; reavaliar em 90 dias.", "sinonimos": [], "evidencias": ["EV-0131", "EV-0186"]}, {"id": "GL-05", "termo": "Tipo Promissor", "definicao": "V baixo, R alto, Q alto (BAA). Ação: Obter a primeira venda em 90 dias: escolher uma oportunidade concreta (RFP da Prateleira ou cruzamento de carteiras), acompanhar de perto e garantir retorno rápido do closer ao gerente e do gerente ao parceiro; fazer a indicação com a participação dele (apresentação a três). Abordagem: Onboarding guiado: ensinar o perfil do cliente ideal, as frases-gatilho e o que acontece depois da indicação. Cuidar da expectativa para não virar impaciência de Adolescente Rebelde. Cadência: Semanal nas primeiras 4 semanas, depois quinzenal até a primeira venda.", "sinonimos": [], "evidencias": ["EV-0131", "EV-0186"]}, {"id": "GL-06", "termo": "Tipo Ativo sem tração", "definicao": "V baixo, R alto, Q baixo (BAB). Ação: Descobrir em 60 dias por que a atividade não vira receita: revisar as oportunidades recusadas ou paradas (motivo, perfil, etapa), corrigir o entendimento do cliente ideal e do que a Wise vende, e separar o que é gargalo do lado do parceiro (qualidade da indicação) do que é do lado da Wise (retorno lento). Abordagem: Ação unilateral que quebra o impasse: consertar primeiro o que é da Wise e depois pedir o ajuste. Aproximar quem fala a mesma língua (closer e gestor técnico do parceiro, 20 minutos). Mostrar pequenas vitórias. Cadência: Quinzenal; checkpoint em 60 dias.", "sinonimos": [], "evidencias": ["EV-0131", "EV-0186"]}, {"id": "GL-07", "termo": "Tipo Cordial seletivo", "definicao": "V baixo, R baixo, Q alto (BBA). Ação: Recrutar de novo com foco único: uma atividade, um cliente ou uma RFP, mais um credenciamento (treinamento na oferta do grupo) que aumente o compromisso. Se P for alto, vale o esforço; se for baixo, atenção baixa. Abordagem: Não propor rodada de reuniões executivas. Mostrar a proposta de valor e o que ele ganha, começando pelo cliente dele. Convite curto para falar de um cliente específico. Cadência: Mensal e leve (WhatsApp), uma jogada por trimestre; reavaliar em 90 dias.", "sinonimos": [], "evidencias": ["EV-0131", "EV-0186"]}, {"id": "GL-08", "termo": "Tipo Desertor", "definicao": "V baixo, R baixo, Q baixo (BBB). Ação: Decidir. Se P alto: uma conversa de reinício, tratando como parceria nova, com 6 meses de observação. Se P baixo: atenção baixa (comunicação em grupo e automação trimestral) e, sem ação de valor em 180 dias, arquivar com saída cordial e registrar o motivo. Abordagem: Sem pressão e sem campanha genérica, que tende a falhar. Porta aberta. Registrar o motivo da saída para alimentar o onboarding. Cadência: Trimestral e automatizada; se P alto, um contato pessoal por trimestre.", "sinonimos": [], "evidencias": ["EV-0131", "EV-0186"]}, {"id": "GL-09", "termo": "Valor (fator do cubo)", "definicao": "Quanto a relação já entregou em receita para o grupo Wise, em contratos ganhos e em pipeline ponderado. V = soma do valor contratado das oportunidades ganhas com origem no parceiro nos últimos 12 meses (ou desde a adesão, se menor) + soma do valor estimado das oportunidades abertas dele multiplicado pela probabilidade da etapa. Vale qualquer das quatro portas (indicação por link, Prateleira, cruzamento de carteiras, Base Ativa). Corte inicial: ALTO se houver pelo menos 1 contrato ganho nos 12 meses (fase com até 10 parceiros ativos); depois, ALTO se V for maior ou igual à mediana dos parceiros com ao menos 1 oportunidade registrada. Convenção de valor: a mesma da base de cálculo da comissão de cada empresa do grupo.", "sinonimos": [], "evidencias": ["EV-0131"]}, {"id": "GL-10", "termo": "Ritmo (fator do cubo)", "definicao": "Se a relação está viva: há quanto tempo o parceiro fez algo de valor e com que frequência faz. Ação de valor = (a) indicação enviada, (b) retorno do parceiro a uma oportunidade enviada pela Wise ou a uma RFP da Prateleira em até 5 dias úteis, (c) ação de Base Ativa registrada (comunidade ou evento), (d) presença na revisão trimestral. Recência: dias desde a última ação de valor. Frequência: número de ações de valor nos últimos 90 dias. ALTO se recência menor ou igual a 30 dias E frequência maior ou igual a 2 em 90 dias. Parceiro com menos de 30 dias de adesão fica em aquecimento e não é classificado. Quando houver 30 ou mais parceiros, separar R e F e trocar o corte fixo por quintis.", "sinonimos": [], "evidencias": ["EV-0154"]}, {"id": "GL-11", "termo": "Relação (fator do cubo)", "definicao": "Qualidade da relação: confiança, justiça percebida, retorno mútuo e equilíbrio entre dar e receber oportunidades. Índice de 0 a 100: Q = 0,5 x Pulso + 0,3 x Retorno mútuo + 0,2 x Equilíbrio. Pulso: três perguntas de 1 a 5 na revisão trimestral, respondidas pelo parceiro e pelo gerente sobre o outro lado: (1) você daria uma referência positiva a um cliente seu? (2) a divisão de esforço e ganho é justa? (3) sabemos o que esperar um do outro? A nota é a média das duas visões; diferença de 2 pontos ou mais gera alerta de percepção. Retorno mútuo: média de (a) percentual de oportunidades enviadas pela Wise ao parceiro com resposta em até 5 dias úteis e (b) percentual de indicações do parceiro cujo status voltou ao parceiro em até 5 dias úteis, registrado pelo gerente depois de falar com o closer. Equilíbrio: 100 menos 200 vezes a distância de 0,5, onde o saldo é indicações enviadas pelo parceiro dividido por (enviadas por ele mais enviadas a ele). ALTO se Q maior ou igual a 70. Sem pulso ainda, calcula só com os outros dois e mostra estado parcial.", "sinonimos": [], "evidencias": ["EV-0156", "EV-0133"]}, {"id": "GL-12", "termo": "Potencial", "definicao": "Quanto o parceiro poderia gerar: aderência de carteira ao cliente ideal da Wise e capacidade de agir. Nota de 0 a 4, um ponto por C, cada C valendo 0, 0,5 ou 1, preenchida no onboarding e revista a cada semestre com dados reais: Customer base (indústrias da carteira dentro do ICP, tamanho e acesso, incluindo Base Ativa), Credibility (reputação com as indústrias), Capability (equipe e ferramentas para operar as portas), Commitment (aceita ritual trimestral, tem dono interno, informa carteira). ALTO se nota maior ou igual a 3.", "sinonimos": [], "evidencias": ["EV-0244"]}, {"id": "GL-13", "termo": "Oportunidade compartilhada", "definicao": "Unidade de valor do programa: uma indústria com necessidade conhecida conectada, com contexto, a quem resolve.", "sinonimos": [], "evidencias": ["EV-0046"]}, {"id": "GL-14", "termo": "Parceiro ativo", "definicao": "Parceiro que já teve a primeira indicação no ICP que virou reunião.", "sinonimos": [], "evidencias": ["EV-0016"]}, {"id": "GL-15", "termo": "Exceção", "definicao": "O que fugiu da regra e por isso vira tarefa na fila; o que segue a regra não gera trabalho.", "sinonimos": [], "evidencias": ["EV-0061"]}, {"id": "GL-16", "termo": "Texto único", "definicao": "Minuta que circula como rascunho pedindo críticas até as duas partes aprovarem; o Diretor só assina.", "sinonimos": [], "evidencias": ["EV-0007"]}, {"id": "GL-17", "termo": "Valor devolvido", "definicao": "Segunda medida-mãe, com o mesmo peso do CAC: desfechos devolvidos aos parceiros, oportunidades enviadas de volta, apresentações feitas e acessos dados.", "sinonimos": [], "evidencias": ["EV-0028"]}, {"id": "GL-18", "termo": "Painel da semana", "definicao": "Poucos números estratégicos, sempre os mesmos, e a lista de casos da semana, cada um com histórico e jogada sugerida; base da conversa semanal do Gerente com o Igor.", "sinonimos": [], "evidencias": ["EV-0025"]}, {"id": "GL-19", "termo": "Ping", "definicao": "Contato curto que mantém a relação viva, no ritmo da importância do parceiro, de preferência levando algo de valor (expressão de Never Eat Alone).", "sinonimos": [], "evidencias": ["EV-0097"]}], "ideias": [], "historico": [{"data": "2026-11-05", "evento": "Mapeamento iniciado"}, {"data": "2026-11-05", "evento": "Rodada 3 respondida pelo patrocinador (13 perguntas); respostas ligadas como evidência no to-be v6"}, {"data": "2026-11-05", "evento": "Rodada 4 respondida: sete divergências entre livros e decisões resolvidas; painel da semana, voz do Igor, formações da Tríade e práticas de Never Eat Alone confirmados"}, {"data": "2026-11-05", "evento": "Rodada 5 respondida: 19 itens validados pelo dono; to-be inteiro confirmado"}, {"data": "2026-11-05", "evento": "To-be v6: conversa com o Igor de 04/11 registrada como hipóteses (diagnóstico como entrega padrão, foco em software de gestão, ativação de 90 dias); Rodada 6 enviada"}]}, "codigos": {"P-01": "1", "P-02": "1.1", "P-03": "1.2", "P-04": "1.3", "P-05": "1.4", "P-61": "1.4.1", "P-62": "1.4.2", "P-6 confirmado\n      n_f1([\"Parceiro retomado\"]):::confirmado\n      n_f2([\"Parceiro mantido em observação\"]):::confirmado\n      n_f3([\"Parceria encerrada\"]):::confirmado\n    end\n    subgraph raia_PA_02 [\"Diretor\"]\n      n_t6b[\"Assinar o aviso formal\"]:::confirmado\n    end\n    ext_X1[/\"Parceiro\"/]\n    n_i1 --> n_g1\n    n_g1 -->|Âncora esfriando| n_t1\n    n_g1 -->|Valioso em risco| n_t2\n    n_g1 -->|Cordial seletivo| n_t3\n    n_g1 -->|Desertor| n_t4\n    n_t1 --> n_e1\n    n_t2 --> n_e1\n    n_t3 --> n_e1\n    n_t4 --> n_t5\n    n_e1 --> n_g2\n    n_g2 -->|Sim| n_f1\n    n_g2 -->|Não| n_t5\n    n_t5 --> n_t6\n    n_t6 --> n_g3\n    n_g3 -->|Não| n_f2\n    n_g3 -->|Sim| n_t6b\n    n_t6b --> n_t7\n    n_t7 --> n_e2\n    n_e2 --> n_t8\n    n_t8 --> n_t9\n    n_t9 --> n_f3\n    n_t1 -.->|Oportunidade| ext_X1\n    n_t3 -.->|Convite com foco único| ext_X1\n    n_t7 -.->|Aviso formal assinado| ext_X1\n"}}</script>
<script src="https://cdn.jsdelivr.net/npm/bpmn-js@18.27.1/dist/bpmn-navigated-viewer.production.min.js"></script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("dados").textContent);
  var M = D.mapa;
  var COD = D.codigos || {};
  var NIV = D.niveis || {};
  var TIPO = D.tipos || {};
  var STATUS = { confirmado: "Confirmado", declarado: "Declarado", hipotese: "Hipótese", contestado: "Contestado" };
  var STATUS_EXPL = {
    confirmado: "validado pelo responsável ou por duas fontes independentes",
    declarado: "alguém da empresa ou um documento afirmou",
    hipotese: "suposição ainda não confirmada",
    contestado: "fontes discordam"
  };
  var TIPOS = { gestao: "Gestão", finalistico: "Finalísticos", suporte: "Suporte" };
  var TIPO_EXPL = { gestao: "direcionam e controlam", finalistico: "entregam valor ao cliente", suporte: "dão recursos aos demais" };
  var NIVEIS = (M.organizacao && M.organizacao.niveis) || ["Organização", "Macroprocesso", "Processo", "Subprocesso", "Atividade", "Tarefa"];
  var CAMPOS = [
    ["descricao", "Propósito"], ["dono", "Dono"], ["participantes", "Participam"], ["gatilho", "Começa quando"],
    ["entradas", "Recebe"], ["saidas", "Entrega"], ["cliente", "Cliente do processo"], ["sistemas", "Sistemas"],
    ["frequencia", "Frequência"], ["volume", "Volume"], ["duracao", "Duração"], ["indicadores", "Indicadores"],
    ["regras", "Regras"], ["dores", "Dores relatadas"]
  ];
  var OBRIG = { 1: ["tipo", "descricao", "dono"], 2: ["descricao", "dono", "gatilho", "saidas", "cliente"], 3: ["descricao", "dono", "gatilho", "entradas", "saidas", "cliente", "participantes"] };
  var TEMAS = [
    ["oferta", "O que vende"], ["cliente", "Para quem"], ["proposta_de_valor", "Por que compram"], ["canal", "Como chega ao cliente"],
    ["receita", "Como ganha dinheiro"], ["parceiro", "Parceiros"], ["recurso", "Recursos-chave"], ["custo", "Custos"],
    ["regulacao", "Regras e leis"], ["estrategia", "Estratégia e metas"], ["outro", "Outros"]
  ];

  var idx = {};
  ["fatos", "ofertas", "cadeias_de_valor", "areas", "papeis", "pessoas", "sistemas", "objetos", "processos", "evidencias", "perguntas", "formularios", "contradicoes", "decisoes", "glossario", "ideias"].forEach(function (c) {
    (M[c] || []).forEach(function (o) { if (o && o.id) idx[o.id] = o; });
  });
  var procs = M.processos || [];
  var filhos = {};
  procs.forEach(function (p) { var k = p.pai || "_raiz"; (filhos[k] = filhos[k] || []).push(p); });
  Object.keys(filhos).forEach(function (k) {
    filhos[k].sort(function (a, b) { return cmpCod(COD[a.id], COD[b.id]); });
  });
  var lacPor = {};
  (D.lacunas || []).forEach(function (l) { (lacPor[l.elemento] = lacPor[l.elemento] || []).push(l); });

  var estado = { aba: "cadeia", sel: null, abertos: {}, busca: "", filtro: { confirmado: true, declarado: true, hipotese: true, contestado: true }, fluxo: null, soSemPergunta: false };

  function cmpCod(a, b) {
    var x = String(a || "").split("."), y = String(b || "").split(".");
    for (var i = 0; i < Math.max(x.length, y.length); i++) {
      var d = (parseInt(x[i] || 0, 10) || 0) - (parseInt(y[i] || 0, 10) || 0);
      if (d) return d;
    }
    return 0;
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function vazio(v) { return v == null || (typeof v === "string" && !v.trim()) || (Array.isArray(v) && !v.length) || (typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length); }
  function nome(id) { var o = idx[id]; return o ? (o.nome || o.texto || id) : (id || ""); }
  function selo(st) { st = st || "hipotese"; return '<span class="selo ' + st + '" title="' + esc(STATUS_EXPL[st]) + '">' + STATUS[st] + "</span>"; }
  function ponto(st) { st = st || "hipotese"; return '<span class="ponto ' + st + '" title="' + STATUS[st] + '"></span>'; }
  function nivelNome(n) { return NIVEIS[n] || ("Nível " + n); }
  function refTexto(r) {
    if (!r) return "";
    if (typeof r === "string") { if (r.indexOf("EXT:") === 0) return r.slice(4) + " (externo)"; return idx[r] ? (COD[r] ? COD[r] + " " : "") + nome(r) : r; }
    if (typeof r === "object") {
      var t = r.nome || "";
      var de = r.de ? " ← " + refTexto(r.de) : "";
      var para = r.para ? " → " + refTexto(r.para) : "";
      var meta = r.meta ? " (meta: " + r.meta + ")" : "";
      return t + de + para + meta;
    }
    return String(r);
  }
  function valorCampo(p, k) {
    var v = p[k];
    if (vazio(v)) return null;
    if (k === "dono") return esc(nome(v));
    if (k === "participantes" || k === "sistemas") return v.map(function (x) { return esc(nome(x)); }).join(", ");
    if (Array.isArray(v)) return v.map(function (x) { return esc(refTexto(x)); }).join("<br>");
    return esc(v);
  }
  var SITUACAO = { no_papel: "só no papel", em_implantacao: "em implantação" };
  function situacaoTag(p) { return SITUACAO[p.situacao] ? '<span class="tag papel" title="Desenhado, mas ainda não roda (ou roda parcialmente)">' + SITUACAO[p.situacao] + "</span>" : ""; }
  function porcent(n) { return (Math.round(n * 10) / 10).toLocaleString("pt-BR") + "%"; }

  // ------------------------------------------------------------ cabeçalho
  function cabecalho() {
    var org = M.organizacao || {};
    document.getElementById("org-nome").textContent = org.nome || "Mapa de processos";
    var c = D.cobertura || {};
    document.getElementById("medidores").innerHTML =
      medidor("Informação levantada", c.completude || 0, "", "campos mínimos, fluxos e temas do negócio") +
      medidor("Validado", c.validacao || 0, "ok", (c.confirmados || 0) + " de " + (c.elementos || 0) + " elementos confirmados");
    var porNivel = c.por_nivel || {};
    var chips = Object.keys(porNivel).map(function (n) { return '<span class="chip"><b>' + porNivel[n].total + "</b> " + esc(nivelNome(+n).toLowerCase()) + (porNivel[n].total === 1 ? "" : "s") + "</span>"; });
    chips.push('<span class="chip"><b>' + (c.hipoteses || 0) + "</b> hipóteses</span>");
    chips.push('<span class="chip"><b>' + (c.perguntas_pendentes || 0) + "</b> perguntas pendentes</span>");
    chips.push('<span class="chip"><b>' + (c.contradicoes_abertas || 0) + "</b> contradições abertas</span>");
    document.getElementById("contagens").innerHTML = chips.join("");
    document.getElementById("legenda").innerHTML = ["confirmado", "declarado", "hipotese", "contestado"].map(function (s) { return selo(s); }).join("");
    document.getElementById("rodape-esq").textContent = "Atualizado em " + (org.atualizado_em || D.gerado_em || "") + (org.consultor ? " · " + org.consultor : "");
  }
  function medidor(rot, v, cls, dica) {
    return '<div class="medidor" title="' + esc(dica) + '"><div class="rot"><span>' + esc(rot) + '</span></div><div class="num">' + porcent(v) +
      '</div><div class="barra ' + cls + '"><i style="width:' + Math.max(0, Math.min(100, v)) + '%"></i></div></div>';
  }

  // ------------------------------------------------------------ cadeia de valor
  function vistaCadeia() {
    var raizes = filhos._raiz || [];
    var h = '<section class="secao"><div class="titulo-secao"><h2>Cadeia de valor</h2><span class="muted">Clique em um macroprocesso para ver o detalhe.</span></div>';
    var ordem = ["gestao", "finalistico", "suporte", null];
    var algum = false;
    ordem.forEach(function (t) {
      var grupo = raizes.filter(function (r) { return (r.tipo || null) === t; });
      if (!grupo.length) return;
      algum = true;
      h += '<div class="banda"><div class="nome-banda">' + (t ? TIPOS[t] : "Sem classificação") + "<small>" + (t ? TIPO_EXPL[t] : "tipo ainda não definido") + '</small></div><div class="fileira">';
      grupo.forEach(function (r) {
        var nf = (filhos[r.id] || []).length;
        var nl = (lacPor[r.id] || []).length;
        h += '<button class="macro ' + (t === "finalistico" ? "chevron " : "") + (r.status || "hipotese") + (estado.sel === r.id ? " sel" : "") + '" data-sel="' + esc(r.id) + '">' +
          '<span class="cab"><span class="mono muted">' + esc(COD[r.id]) + "</span>" + selo(r.status) + "</span>" +
          '<span class="nome">' + esc(r.nome) + "</span>" +
          '<span class="rodape"><span>' + (r.dono ? esc(nome(r.dono)) : "dono a definir") + "</span><span>" + (nf ? nf + " sub" : "") + (nl ? " · " + nl + " lac." : "") + "</span></span>" + situacaoTag(r) + "</button>";
      });
      h += "</div></div>";
    });
    if (!algum) h += '<div class="cartao vazio-msg">Ainda não há macroprocessos declarados. Eles aparecem aqui assim que a primeira rodada de formulários for respondida.</div>';
    h += "</section>";
    var cvs = M.cadeias_de_valor || [];
    if (cvs.length) {
      h += '<section class="secao cv"><div class="titulo-secao"><h2>Do pedido à entrega</h2><span class="muted">Caminhos ponta a ponta que atravessam os macroprocessos.</span></div>';
      cvs.forEach(function (cv) {
        h += '<div class="cartao" style="margin-bottom:10px"><div class="titulo-secao"><h3>' + esc(cv.nome) + "</h3>" + selo(cv.status) + "</div>" +
          '<p class="muted" style="margin:0 0 10px">Começa quando: ' + esc(cv.gatilho || "?") + " · Valor entregue: " + esc(cv.valor || "?") + (cv.stakeholder ? " · Para: " + esc(cv.stakeholder) : "") + "</p>" +
          '<div class="cv-etapas">' + (cv.etapas || []).map(function (et, i) {
            return '<div class="cv-etapa"><div class="n">Etapa ' + (i + 1) + "</div><div><b>" + esc(et.nome) + "</b></div>" +
              (et.processos || []).map(function (pid) { return '<div><button class="lnk" data-sel="' + esc(pid) + '">' + esc((COD[pid] || "") + " " + nome(pid)) + "</button></div>"; }).join("") + "</div>";
          }).join("") + "</div></div>";
      });
      h += "</section>";
    }
    return h;
  }

  // ------------------------------------------------------------ hierarquia
  function passaFiltro(p) {
    if (!estado.filtro[p.status || "hipotese"]) return false;
    if (!estado.busca) return true;
    var b = estado.busca.toLowerCase();
    return ((COD[p.id] || "") + " " + (p.nome || "") + " " + (p.descricao || "") + " " + nome(p.dono)).toLowerCase().indexOf(b) >= 0;
  }
  function visivel(p) {
    if (passaFiltro(p)) return true;
    return (filhos[p.id] || []).some(visivel);
  }
  function vistaHierarquia() {
    var h = '<section class="secao"><div class="titulo-secao"><h2>Hierarquia de processos</h2><span class="muted">' + procs.length + " processos</span></div>";
    h += '<div class="ferramentas"><input type="search" id="busca" placeholder="Buscar por nome, código ou dono" value="' + esc(estado.busca) + '" aria-label="Buscar processo">' +
      '<button class="btn" id="abrir-tudo">Abrir tudo</button><button class="btn" id="fechar-tudo">Fechar tudo</button></div>';
    h += '<div class="ferramentas">' + ["confirmado", "declarado", "hipotese", "contestado"].map(function (s) {
      return '<label class="filtro"><input type="checkbox" data-filtro="' + s + '"' + (estado.filtro[s] ? " checked" : "") + ">" + ponto(s) + STATUS[s] + "</label>";
    }).join("") + "</div>";
    var raizes = (filhos._raiz || []).filter(visivel);
    if (!raizes.length) h += '<div class="cartao vazio-msg">Nenhum processo com esses filtros.</div>';
    var ultimo = "_";
    h += '<div class="cartao">';
    raizes.forEach(function (r) {
      if ((r.tipo || null) !== ultimo) { ultimo = r.tipo || null; h += '<div class="grupo-tipo eyebrow">' + (ultimo ? TIPOS[ultimo] : "Sem classificação") + "</div>"; }
      h += '<ul class="arvore">' + noArvore(r) + "</ul>";
    });
    h += "</div></section>";
    return h;
  }
  function noArvore(p) {
    var kids = (filhos[p.id] || []).filter(visivel);
    var aberto = estado.abertos[p.id] || !!estado.busca;
    var nl = (lacPor[p.id] || []).length;
    var h = '<li><div class="no' + (estado.sel === p.id ? " sel" : "") + '" data-sel="' + esc(p.id) + '">' +
      (kids.length ? '<button class="seta" data-alterna="' + esc(p.id) + '" aria-expanded="' + aberto + '" aria-label="' + (aberto ? "Fechar" : "Abrir") + '">' + (aberto ? "▾" : "▸") + "</button>" : "<span></span>") +
      '<span class="cod">' + esc(COD[p.id]) + "</span>" +
      '<span class="nm">' + esc(p.nome) + " <small>· " + (p.dono ? esc(nome(p.dono)) : "dono a definir") + "</small></span>" +
      '<span class="tags">' + situacaoTag(p) + (p.fluxo ? '<span class="tag">fluxo</span>' : "") + (nl ? '<span class="tag falta">' + nl + " lacuna" + (nl > 1 ? "s" : "") + "</span>" : "") + ponto(p.status) + "</span></div>";
    if (kids.length && aberto) h += "<ul>" + kids.map(noArvore).join("") + "</ul>";
    return h + "</li>";
  }

  // ------------------------------------------------------------ fluxos
  function comFluxo() { return procs.filter(function (p) { return p.fluxo && (p.fluxo.nos || []).length; }).sort(function (a, b) { return cmpCod(COD[a.id], COD[b.id]); }); }
  function vistaFluxos() {
    var lst = comFluxo();
    if (!lst.length) return '<section class="secao"><h2>Fluxos</h2><div class="cartao vazio-msg" style="margin-top:10px">Nenhum passo a passo foi levantado ainda. Os fluxos aparecem depois das rodadas com quem executa o trabalho.</div></section>';
    if (!estado.fluxo || !lst.some(function (p) { return p.id === estado.fluxo; })) estado.fluxo = lst[0].id;
    var p = idx[estado.fluxo];
    var h = '<section class="secao"><div class="titulo-secao"><h2>Fluxos</h2><span class="muted">Diagrama em BPMN e a mesma lógica escrita em frases, para validar com quem executa.</span></div><div class="fluxos">';
    h += '<div class="lista-fluxos">' + lst.map(function (q) {
      return '<button data-fluxo="' + esc(q.id) + '" aria-pressed="' + (q.id === estado.fluxo) + '"><span class="mono muted">' + esc(COD[q.id]) + "</span><b>" + esc(q.nome) + "</b><span>" + selo(q.fluxo.status) + "</span></button>";
    }).join("") + "</div>";
    h += '<div style="min-width:0"><div class="titulo-secao"><h3>' + esc(COD[p.id] + " " + p.nome) + "</h3>" + selo(p.fluxo.status) + "</div>";
    h += '<div class="tela-bpmn" id="tela-bpmn"><div class="aviso">Carregando o diagrama…</div></div>';
    h += '<div class="acoes"><button class="btn" data-acao="copiar-bpmn">Copiar BPMN</button><button class="btn" data-acao="baixar-pacote">Baixar arquivos editáveis (.zip)</button>' +
      '<a class="btn" href="https://demo.bpmn.io/new" target="_blank" rel="noopener">Abrir o editor bpmn.io</a><button class="btn" data-sel="' + esc(p.id) + '">Ver ficha do processo</button></div>';
    h += '<p class="muted" id="msg-acao" role="status" style="margin:0 0 8px"></p>';
    h += '<div class="cartao"><h3 style="margin-bottom:8px">Leitura em frases</h3><ol class="frases">' + frasesFluxo(p).map(function (f) {
      return '<li class="' + f.cls + '">' + f.html + "</li>";
    }).join("") + "</ol></div></div></div></section>";
    return h;
  }
  function frasesFluxo(p) {

    (fl.externos || []).forEach(function (x) { ext[x.id] = x.nome; });
    (fl.mensagens || []).forEach(function (m) {
      if (ext[m.de]) (mIn[m.para] = mIn[m.para] || []).push(m);
      if (ext[m.para]) (mOut[m.de] = mOut[m.de] || []).push(m);
    });
    // Ordem de leitura: caminho principal primeiro (busca em profundidade), desvios depois, fins no final.
    var ordem = [], visto = {}, fins = [];

      if (visto[k] || !nos[k]) return;
      visto[k] = 1;
      if (nos[k].tipo === "fim") fins.push(k); else ordem.push(k);
      (out[k] || []).forEach(function (l) { dfs(l.para); });
    }
    (fl.nos || []).filter(function (n) { return n.tipo === "inicio"; }).forEach(function (n) { dfs(n.id); });
    (fl.nos || []).forEach(function (n) { dfs(n.id); });

    function ref(k) { var n = nos[k]; if (!n) return k; if (num[k]) return "passo " + num[k] + " (" + esc(n.nome || "") + ")"; if (n.tipo === "fim") return "o fim “" + esc(n.nome || "") + "”"; return esc(n.nome || "próximo passo"); }
    function papel(n) { return n.raia ? "<b>" + esc(nome(n.raia)) + "</b>" : "<b>Alguém (papel a definir)</b>"; }
    function msgs(k) {

      else if (t === "tarefa") { txt = num[k] + ". " + papel(n) + ": " + esc(n.nome || "") + (n.sistema ? " (usa " + esc(nome(n.sistema)) + ")" : "") + "." + msgs(k) + seguinte(k, pos); }
      else if (t === "subprocesso") { txt = num[k] + ". " + papel(n) + ": " + esc(n.nome || "") + (n.processo ? " (detalhado em " + esc(COD[n.processo] || "") + ")" : "") + "." + msgs(k) + seguinte(k, pos); }
      else if (t === "espera") { txt = num[k] + ". Aguarda: " + esc(n.nome || "") + "." + msgs(k) + seguinte(k, pos); }
      else if (t === "decisao" || t === "inclusivo") {
        txt = num[k] + ". " + papel(n) + " confere: " + esc(n.nome || "?") + " " + (out[k] || []).map(function (l) { return "Se “" + esc(l.rotulo || "?") + "”, segue para " + ref(l.para) + "."; }).join(" ");

      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, dados.length, true);
      h.setUint32(22, dados.length, true); h.setUint16(26, nomeB.length, true); h.setUint16(28, 0, true);
      partes.push(new Uint8Array(h.buffer), nomeB, dados);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, dados.length, true); c.setUint32(24, dados.length, true);
      c.setUint16(28, nomeB.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), nomeB);
      off += 30 + nomeB.length + dados.length;
    });
    var tam = central.reduce(function (s, x) { return s + x.length; }, 0);
    var fim = new DataView(new ArrayBuffer(22));
    fim.setUint32(0, 0x06054b50, true); fim.setUint16(8, arquivos.length, true); fim.setUint16(10, arquivos.length, true);
    fim.setUint32(12, tam, true); fim.setUint32(16, off, true);
    return new Blob(partes.concat(central, [new Uint8Array(fim.buffer)]), { type: "application/zip" });
  }
  function slug(s) { return String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48) || "item"; }
  function aviso(t) { var m = document.getElementById("msg-acao"); if (m) m.textContent = t; }
  function salvar(blob, nomeArq) {
    var w = window.claude;
    var p = w && typeof w.use === "function" ? w.use("downloads") : Promise.resolve(null);
    return Promise.resolve(p).then(function (dl) {
      if (dl) return dl.save({ filename: nomeArq, data: blob }).then(function () { aviso("Arquivo pronto: " + nomeArq); }, function (e) { aviso(e && e.code === "declined" ? "Download cancelado." : "Não foi possível baixar aqui: " + ((e && e.message) || "")); });
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = nomeArq; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      aviso("Arquivo pronto: " + nomeArq);
    });
  }
  function pacote() {
    var arqs = [];
    Object.keys(D.bpmn || {}).forEach(function (pid) { arqs.push({ nome: "bpmn/" + slug(COD[pid]) + "-" + slug(nome(pid)) + ".bpmn", texto: D.bpmn[pid] }); });
    if (D.drawio) arqs.push({ nome: "mapa.drawio", texto: D.drawio });
    Object.keys(D.mermaid || {}).forEach(function (k) { arqs.push({ nome: "mermaid/" + k, texto: D.mermaid[k] }); });
    arqs.push({ nome: "mapa.json", texto: JSON.stringify(M, null, 2) });
    arqs.push({ nome: "LEIA-ME.txt", texto: "Arquivos editáveis do mapa de processos.\n\n.bpmn: abra em https://demo.bpmn.io, Camunda Modeler ou Bizagi Modeler.\nmapa.drawio: abra em https://app.diagrams.net (uma página por visão).\nmermaid/*.mmd: cole em https://mermaid.live, Notion, GitHub ou Obsidian.\nmapa.json: a fonte de verdade do mapeamento.\n" });
    return salvar(zip(arqs), "mapa-de-processos-" + slug((M.organizacao || {}).nome) + ".zip");
  }

  // ------------------------------------------------------------ navegação
  var ABAS = { cadeia: vistaCadeia, hierarquia: vistaHierarquia, fluxos: vistaFluxos, lacunas: vistaLacunas, negocio: vistaNegocio, pessoas: vistaPessoas };
  function render() {
    document.querySelectorAll("#abas a").forEach(function (a) { if (a.dataset.aba === estado.aba) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    document.getElementById("principal").innerHTML = ABAS[estado.aba]();
    painel();
    if (estado.aba === "fluxos") montarBpmn();
  }
  function lerHash() { var h = (location.hash || "").replace("#", ""); estado.aba = ABAS[h] ? h : "cadeia"; render(); }
  window.addEventListener("hashchange", lerHash);

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-alterna],[data-sel],[data-fluxo],[data-acao],[data-ver-fluxo],#abrir-tudo,#fechar-tudo,#fechar-painel");
    if (!t) return;
    if (t.dataset.alterna) { ev.stopPropagation(); estado.abertos[t.dataset.alterna] = !estado.abertos[t.dataset.alterna]; render(); return; }
    if (t.id === "abrir-tudo") { procs.forEach(function (p) { estado.abertos[p.id] = true; }); render(); return; }
    if (t.id === "fechar-tudo") { estado.abertos = {}; render(); return; }
    if (t.id === "fechar-painel") { estado.sel = null; render(); return; }
    if (t.dataset.fluxo) { estado.fluxo = t.dataset.fluxo; render(); return; }
    if (t.dataset.verFluxo) { estado.fluxo = t.dataset.verFluxo; if (location.hash !== "#fluxos") location.hash = "fluxos"; else render(); return; }
    if (t.dataset.acao === "copiar-bpmn") {
      var xml = (D.bpmn || {})[estado.fluxo] || "";
      try { navigator.clipboard.writeText(xml).then(function () { aviso("BPMN copiado. No bpmn.io, use 'Open' e cole ou arraste o arquivo baixado."); }, function () { aviso("Não consegui copiar aqui; use o botão de baixar."); }); }
      catch (e) { aviso("Não consegui copiar aqui; use o botão de baixar."); }
      return;
    }
    if (t.dataset.acao === "baixar-pacote") { pacote(); return; }
    if (t.dataset.sel) {
      estado.sel = t.dataset.sel;
      var p = idx[estado.sel], a = p;
      while (a && a.pai) { estado.abertos[a.pai] = true; a = idx[a.pai]; }
      render();
    }
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "busca") {
      estado.busca = ev.target.value;
      var pos = ev.target.selectionStart;
      render();
      var b = document.getElementById("busca"); if (b) { b.focus(); try { b.setSelectionRange(pos, pos); } catch (e) {} }
    }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.dataset && ev.target.dataset.filtro) { estado.filtro[ev.target.dataset.filtro] = ev.target.checked; render(); }
    if (ev.target.id === "so-sem") { estado.soSemPergunta = ev.target.checked; render(); }
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && estado.sel) { estado.sel = null; render(); } });

  cabecalho();
  lerHash();
})();
</script>
