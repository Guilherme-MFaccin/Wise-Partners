earbound and the Rise of the Who Economy (Jared Fuller, Jill Rowley)", "pessoa": null, "data": "2026-11-01", "trecho": "The channel world owns the point of transaction, while the emerging partner world seems to own the points of influence and retention.", "local": "p. 24 (Who Economy)"}, {"id": "EV-0205", "tipo": "documento", "fonte": "The Channel Advantage (Lawrence G. Friedman e Timothy R. Furey)", "pessoa": null, "data": "2026-11-01", "trecho": "The company pays a sales commission of five to fifteen per cent to anyone whose routes a customer from their own web site to www.amazon.com for a book or compact disk purchase.", "local": "p. 113"}, {"id": "EV-0206", "tipo": "documento", "fonte": "Ecossistema de Parceiros: Método Octo (Juliana Tubino e Nara Vaz Guimarães)", "pessoa": null, "data": "2026-11-01", "trecho": "essa comissão não deve ser tão alta e pode levar em consideração critérios de qualidade do lead", "local": "p. 172"}, {"id": "EV-0207", "tipo": "documento", "fonte": "Building Successful Partner Channels in the software industry (Hans Peter Bech)", "pessoa": null, "data": "2026-11-01", "trecho": "Margins are like staff salaries; a hygiene factor that may cause dissatisfaction, but on the other hand does not generate changes in behavior.", "local": "p. 146"}, {"id": "EV-0208", "tipo": "documento", "fonte": "Building Successful Partner Channels in the software industry (Hans Peter Bech)", "pessoa": null, "data": "2026-11-01", "trecho": "5% of our partners will grow by themselves, 15% will grow if helped and 80% has no growth potential whatsoever.", "local": "p. 91 (Pirâmide do canal)"}, {"id": "EV-0209", "tipo": "documento", "fonte": "Nearbound and the Rise of the Who Economy (Jared Fuller, Jill Rowley)", "pessoa": null, "data": "2026-11-01", "trecho": "Culture is what you promote and what you tolerate.", "local": "p. 188 (Nearbound Rhythm of Business)"}, {"id": "EV-0210", "tipo": "documento", "fonte": "Getting to Yes: Negotiating Agreement Without Giving In (Roger Fisher, William Ury e Bruce Patton)", "pessoa": null, "data": "2026-11-01", "trecho": "Before starting on any give-and-take, find out about the authority on the other side.", "local": "p. 137 (Texto único, acordo-quadro, jiu-jitsu de negociação e conversas difíceis)"}, {"id": "EV-0211", "tipo": "documento", "fonte": "Strategic Alliances and Marketing Partnerships (Richard Gibbs, Andrew Humphries)", "pessoa": null, "data": "2026-11-01", "trecho": "Sometimes the best contract is the one that is filed and forgotten as soon as it is inked", "local": "p. 171 (Governança de ciclo completo e ciclo de gestão do relacionamento)"}, {"id": "EV-0212", "tipo": "documento", "fonte": "Platform Revolution: How Networked Markets Are Transforming the Economy and How to Make Them Work for You (Geoffrey G. Parker, Marshall W. Van Alstyne e Sangeet Paul Choudary)", "pessoa": null, "data": "2026-11-01", "trecho": "service provider platforms that want to capture and monetize interactions must create tools and services that benefit both parties by removing friction, mitigate risk, and otherwise facilitate interactions.", "local": "p. 115 (Monetization: capturing the value created by network effects)"}], "perguntas": [{"id": "Q-0001", "texto": "Você aprova a nova hierarquia em 12 macroprocessos: Arquitetar o ecossistema e Gerir por rituais (gestão); Atrair e selecionar, Integrar e ativar, Gerar oportunidades, Desenvolver, Reter ou encerrar (finalísticos); Prateleira, Conteúdos, Dados, Ecossistema interno e Portal (suporte)?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["P-01", "P-16"], "para": ["PE-01"], "rodada": 2, "bloco": "A nova arquitetura", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "hap", "contexto": ["A primeira versão do to-be organizava o programa pelos processos que o web app já tinha. Esta versão parte dos modelos dos livros. O Método Octo divide a construção de um ecossistema em três movimentos: arquitetar, conduzir a jornada do parceiro e gerir para escalar. Strategic Alliances diz que a governança cobre o começo, a operação e o fim da relação.", "Daí saem dois macroprocessos de gestão que não existiam: Arquitetar o ecossistema (papel da Wise, arquitetura de valor, perfil ideal, regras, fase) e Gerir por rituais (fila diária, revisão semanal, mesa mensal, fechamento trimestral, fila do Diretor). Os cinco finalísticos seguem a jornada do parceiro, com Gerar oportunidades no centro, porque é ali que o valor acontece. O suporte ganha Dados e Ecossistema interno.", "Ao todo são 12 macroprocessos, 42 processos e 25 subprocessos, com 11 fluxos detalhados. Todos estão no mapa to-be, com a fonte de cada elemento."], "logica": "Um processo só existe se tem caso, gatilho e fim. Por isso rituais e arquitetura viraram processos com data, não funções vagas. A jornada do parceiro dá a ordem dos finalísticos, e a oportunidade dá o centro.", "citacoes": ["EV-0071", "EV-0201", "EV-0112"], "visual": "hap"}, {"id": "Q-0002", "texto": "A unidade de valor do programa passa a ser a oportunidade compartilhada, e os pilares viram quatro portas para ela (indicação por link, Prateleira, cruzamento de carteiras, Base Ativa). Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-002", "P-51", "P-51.fluxo", "OB-02", "P-57", "CV-02"], "para": ["PE-01"], "rodada": 2, "bloco": "Modelo de negócio", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "interacao", "contexto": ["Platform Revolution diz que toda plataforma bem-sucedida começa por uma única interação central, que gera valor alto e repetido. Ela tem três partes: participantes, unidade de valor e filtro. No Wise Partners, a interação é esta: uma indústria com uma necessidade conhecida encontra, com contexto, quem resolve. Ou o parceiro traz ao grupo uma indústria que precisa de gestão comercial.", "Hoje cada pilar tem o próprio funil, como se fossem negócios diferentes. Pela lógica do livro, todos produzem a mesma coisa: uma oportunidade com contexto. A indicação por link é o parceiro trazendo uma indústria. A Prateleira é a Wise levando uma indústria ao parceiro. O cruzamento revela contas em comum. O Base Ativa ativa a carteira do parceiro, que gera contatos.", "Resultado prático: as oportunidades de todas as portas ficam num único quadro, com a porta como etiqueta. Uma esteira só, com as mesmas etapas, o mesmo SLA e o mesmo retorno ao parceiro."], "logica": "Unificar a unidade de valor reduz o número de processos e quadros e deixa o programa medir o que importa: quantas interações boas acontecem e quantas viram negócio. O papel do parceiro também fica claro: ele abre a porta e a Wise conduz, porque a transação e o contrato ficam com o grupo.", "citacoes": ["EV-0023", "EV-0024", "EV-0025", "EV-0204"], "visual": "interacao"}, {"id": "Q-0003", "texto": "A Wise passa a declarar o próprio papel por categoria: orquestradora onde a demanda das indústrias do grupo dá legitimidade, seguidora onde o parceiro já tem programa de canais (grandes ERPs). E cada parceiro é registrado com papéis múltiplos na rede de valor (complementador, concorrente parcial, cliente, fornecedor). Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-003", "F-006", "P-02", "P-03", "P-04", "P-05", "P-33"], "para": ["PE-01"], "rodada": 2, "bloco": "Modelo de negócio", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "papel", "contexto": ["The Ecosystem Economy divide os papéis em orquestrador e participante e avisa que muitas empresas não conseguem orquestrar. Por isso a escolha precisa ser realista. Winning the Right Game acrescenta que liderança num ecossistema é papel, não resultado, e depende de os outros aceitarem você como líder. Com grandes ERPs que já têm programa de canais, a Wise faz melhor como seguidora inteligente.", "Co-Opetition traz a rede de valor: clientes, fornecedores, concorrentes e complementadores. Um ERP que vende para a mesma indústria é complementador quando a indústria valoriza mais a Wise por ter o ERP. É concorrente onde também vende consultoria. Rotular o parceiro com um papel só esconde isso.", "No to-be, o papel por categoria é decidido uma vez por ano (1.1). Cada candidato ganha uma ficha de jogo antes do workshop (3.2.2), com os papéis dele, quem ganha com a entrada dele e as regras de escopo onde ele concorre com o grupo."], "logica": "Saber o papel evita dois erros caros: tentar liderar quem não aceita ser liderado e descartar um bom complementador porque ele concorre num pedaço do escopo. O contrato separa as regras de cooperação (Prateleira, comunidade, evento) das de divisão (comissão, escopo, proteção).", "citacoes": ["EV-0072", "EV-0030", "EV-0038", "EV-0039"], "visual": "rede"}, {"id": "Q-0004", "texto": "A proposta de valor do programa passa a ser escrita para a indústria em cinco elementos (Descobrir quem resolve, Comparar e decidir, Implantar de forma integrada, Pertencer e aprender, Confiar), e cada pilar e cada parceiro é mapeado nos elementos que preenche. Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-004", "P-06"], "para": ["PE-01"], "rodada": 2, "bloco": "Modelo de negócio", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "arquitetura", "contexto": ["Winning the Right Game separa modelo de negócio (como você é pago) de arquitetura de valor (como o valor que o cliente recebe é construído). A arquitetura é feita de elementos, e cada parceiro preenche um ou mais deles. Quando um elemento muda, o jogo inteiro pode mudar.", "Aplicado ao Wise Partners, o consumidor final é a indústria. A Prateleira preenche Descobrir e Comparar e decidir. A consultoria do grupo com o software do parceiro preenche Implantar de forma integrada. O Base Ativa e os eventos preenchem Pertencer e aprender. As regras, o SLA e a política de dados preenchem Confiar.", "A visão central passa a ser uma matriz de parceiros por elemento. Assim fica claro onde a cobertura é fraca, e é ali que vale recrutar ou criar uma porta nova."], "logica": "Medir o programa pela cobertura dos elementos, e não pela soma de cards, diz onde investir. Também protege a Wise da inversão de valor: um parceiro que fica dez vezes melhor num elemento pode mudar o equilíbrio do programa.", "citacoes": ["EV-0032", "EV-0033", "EV-0074"], "visual": "arquitetura"}, {"id": "Q-0005", "texto": "Você perguntou que parâmetro os livros usam para a comissão. Sobre o LTV, os 40% da primeira mensalidade (mais 10% ao Gerente) ficam perto de 2 a 4% para clientes de 12 a 24 meses. O que você quer adotar?", "tipo": "multipla", "opcoes": ["Publicar no regulamento o critério objetivo da comissão (a conta sobre o LTV e as referências de mercado)", "Somar reconhecimento em espécie por nível, divulgado antes (palco, selo, mentoria, prioridade na Prateleira)", "Manter a regra única, sem exceção por parceiro", "Estudar comissão recorrente pequena no lugar da primeira mensalidade"], "alvo": ["F-009", "F-011", "P-10", "P-68"], "para": ["PE-01"], "rodada": 2, "bloco": "Modelo de negócio", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "comissao", "contexto": ["Os livros não trazem um número único. The Channel Advantage cita 5 a 15% da venda para quem só gera lead, mas o exemplo é de varejo digital (afiliados da Amazon), longe do caso Wise. O Método Octo não fixa percentual: manda calibrar a comissão pelo trabalho que fica com quem vende, pela qualidade do lead, e escolher entre pagamento único e recorrente. Bech chama a margem de fator de higiene: a falta dela incomoda, mas ela sozinha não muda comportamento.", "Fazendo a sua conta: 40% de uma mensalidade, sobre um cliente que fica 12 meses, é 3,3% do LTV. Com 24 meses, 1,7%. Somando os 10% do Gerente, o total vai de 4,2% a 2,1%. Na Swallow, 6% do projeto mais 2% dá 8% do valor do projeto. Dentro ou abaixo da faixa citada, portanto.", "Getting to Yes diz que a regra convence quando tem critério objetivo, independente da vontade das partes e aplicável aos dois lados. Publicar essa conta transforma os 40% em regra com fundamento, não em número para negociar."], "logica": "A comissão já está decidida (40%). A questão agora é como sustentá-la: com critério escrito, com reconhecimento que vale mais do que custa e sem exceções que viram precedente.", "citacoes": ["EV-0205", "EV-0206", "EV-0207", "EV-0047", "EV-0054"], "visual": "ltv"}, {"id": "Q-0006", "texto": "No lugar dos oito funis: um quadro da jornada (um card por parceiro, do candidato ao encerramento, com os marcos dentro do card), um quadro de oportunidades (um card por oportunidade), uma fila única de tarefas por exceção e uma agenda de rituais. Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["OB-01", "OB-03", "P-17", "P-17.fluxo", "CV-01"], "para": ["PE-01"], "rodada": 2, "bloco": "Funis e tarefas", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "quadros", "contexto": ["Você disse que um card por parceiro em cada funil vira coisa demais para gerir. As cinco frentes de leitura chegaram, por caminhos diferentes, à mesma resposta.", "Strategic Alliances propõe um ciclo de vida único por parceiro. O Método Octo propõe a jornada como um único quadro, com o onboarding em marcos de 30, 60, 90 e 120 dias dentro do card. Ecosystem-Led Growth e Platform Revolution tiram do quadro tudo o que segue a regra: só a exceção vira trabalho humano. Nearbound avisa que o parceiro nunca entra no portal tanto quanto se espera.", "Resultado: dois quadros e uma fila. O parceiro aparece uma vez só, na fase da jornada. A oportunidade aparece uma vez só, na etapa da esteira. Revisão de nível, Base Ativa, revisões conjuntas e ações conjuntas viram datas na agenda, com pauta montada pelo portal. A fila diária traz só o que fugiu da regra: SLA vencendo, marco atrasado, régua atrasada, risco, pedido parado."], "logica": "Menos quadros não é menos controle. As regras rodam no portal e o Gerente só olha a exceção, o que libera as horas para os parceiros que mais rendem. Os oito funis aprovados continuam existindo como visões filtradas dos dois quadros.", "citacoes": ["EV-0201", "EV-0140", "EV-0202", "EV-0058", "EV-0025"], "visual": "quadros"}, {"id": "Q-0007", "texto": "Cada parceiro ganha, além do nível (potencial e resultado), um segmento de atenção revisto todo mês: gerenciado (cadência humana) ou atendido pelo portal e pela comunidade (sem acompanhamento individual, só exceções). Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["P-19"], "para": ["PE-01"], "rodada": 2, "bloco": "Funis e tarefas", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "atencao", "contexto": ["Bech chama isso de pirâmide do canal: cerca de 5% dos parceiros crescem sozinhos, 15% crescem se ajudados e 80% não têm potencial de crescimento. O tempo do gerente vai para os dois primeiros grupos. Os demais são atendidos pelo portal, com chat e e-mail.", "Ecosystem-Led Growth chama os demais de parceiros não gerenciados. Eles não ficam esquecidos numa lista: geram resultado por automação e quando a equipe os aciona. Strategic Alliances classifica o portfólio por importância e dificuldade de gestão e dá intensidade diferente a cada grupo.", "Com poucos parceiros no início, as proporções não valem como número. Vale o princípio: a mesa mensal do portfólio decide onde as horas vão no mês. Nível e segmento são coisas diferentes: um parceiro pode ser Elite pela carteira e estar parado no comportamento."], "logica": "Sem segmento de atenção, todo parceiro pede o mesmo cuidado, e o tempo do Gerente acaba antes do mês. Com ele, o custo de servir cada parceiro fica proporcional ao que ele demonstra.", "citacoes": ["EV-0208", "EV-0097", "EV-0202", "EV-0061"], "visual": "piramide"}, {"id": "Q-0008", "texto": "A gestão passa a seguir uma agenda de rituais: fila diária de exceções, revisão semanal (com três perguntas levadas à reunião comercial do grupo), mesa mensal do portfólio, fechamento trimestral e arquitetura anual; e o Diretor recebe uma fila de decisões só de sim ou não. Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["P-16", "P-28", "P-20.fluxo"], "para": ["PE-01"], "rodada": 2, "bloco": "Funis e tarefas", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "rituais", "contexto": ["Nearbound diz que cultura é o que se promove e o que se tolera, mais as cadências e os rituais que fazem isso valer. Strategic Alliances recomenda uma revisão operacional regular, provavelmente mensal, em toda relação importante. The Ecosystem Economy mostra check-ins semanais, e às vezes mais frequentes, focados em remover obstáculos.", "Na semana, a ideia é não criar reunião nova. A revisão de terça com o Igor continua, e três perguntas entram na reunião comercial do grupo: que oportunidades novas têm parceiro, que negócios parados podem usar um parceiro, que pedidos a parceiros estão sem retorno. É assim que o programa vira parte da rotina de venda.", "Getting to Yes sugere o procedimento do texto único: o Diretor recebe a proposta pronta e só decide sim ou não. Assinatura, desligamento, descida de nível e exceção de regra chegam a ele numa fila própria."], "logica": "Os rituais agrupam as decisões em datas fixas, em vez de espalhá-las em quadros que alguém precisa abrir todo dia. O custo de gestão fica previsível e cabe no tempo disponível.", "citacoes": ["EV-0209", "EV-0092", "EV-0093", "EV-0094", "EV-0086"], "visual": "rituais"}, {"id": "Q-0009", "texto": "No fechamento trimestral, cada parceria ganha uma nota de saúde em três fatores (qualidade da parceria, inovação colaborativa, criação de valor) e um tipo entre oito, que indica a jogada padrão. O que você adota?", "tipo": "escolha", "opcoes": ["Os três fatores e os oito tipos", "Só os três fatores de saúde", "Não agora"], "alvo": ["P-22", "P-70"], "para": ["PE-01"], "rodada": 2, "bloco": "Funis e tarefas", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "saude", "contexto": ["Strategic Alliances diz que as empresas medem entradas e saídas, mas quase nunca o processo da parceria. Por isso os problemas aparecem tarde demais. O livro propõe três fatores como indicadores que antecipam o sucesso ou o fracasso, e três perguntas simples: o parceiro nos recomendaria a um cliente? A parceria melhorou a satisfação dos clientes? Houve ganho real?", "O mesmo livro classifica as parcerias em oito tipos, e o tipo muda com o comportamento. Cada tipo pede uma jogada diferente. O catador de cerejas, por exemplo, deve ser abordado como se estivesse sendo recrutado pela primeira vez. Com o desertor, a decisão crítica é se a relação ainda vale o tempo investido.", "No portal, a maior parte da nota sai dos dados que já existem: indicações, SLA, trilhas, ações conjuntas, presença nas revisões. O tipo é escolhido na mesa do portfólio."], "logica": "O nível diz quanto de gestão o parceiro recebe. O tipo diz como essa gestão é feita. A saúde diz se vale continuar investindo. As três respostas juntas substituem a percepção pela evidência.", "citacoes": ["EV-0102", "EV-0101", "EV-0171", "EV-0173", "EV-0177"], "visual": "saude"}, {"id": "Q-0010", "texto": "No recrutamento, o que você adota?", "tipo": "multipla", "opcoes": ["A lista de candidatos é tabela, não quadro: o candidato só vira card depois da primeira reunião", "Ficha de jogo do candidato antes do workshop (papéis na rede de valor, quem ganha com a entrada dele)", "Estimativa de sobreposição de carteiras antes de investir horas", "Caso de negócio do parceiro no workshop: quantos negócios saem da carteira dele, quanto ganha, que demanda recebe de volta"], "alvo": ["P-30.regras", "P-33", "P-34", "P-36.descricao"], "para": ["PE-01"], "rodada": 2, "bloco": "Atrair e selecionar", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "recrutamento", "contexto": ["Bech compara recrutar parceiros com contratar por headhunter. A lista longa deve ter pelo menos dez vezes o número de parceiros que se quer assinar, e o recrutamento num território novo leva de 6 a 9 meses. Ele recomenda fazer o workshop estratégico antes de assinar e montar o P&L do parceiro: quanto ele ganha com a parceria, vendendo primeiro para a base que já tem.", "Co-Opetition manda fazer a pergunta de Cícero antes de aceitar alguém no jogo: quem ganha com isso? The Ecosystem Economy pontua cada candidato em atratividade e viabilidade e pergunta se a carteira dele complementa a sua.", "Você já aprovou o workshop de alinhamento como uma conversa mais longa. A proposta é que ele inclua o caso de negócio do parceiro, porque um parceiro que vê o próprio ganho no papel investe mais."], "logica": "Como os parceiros chegam de forma orgânica, o risco não é falta de candidato, e sim gastar horas com quem não vai render. As quatro práticas filtram antes do custo.", "citacoes": ["EV-0115", "EV-0128", "EV-0129", "EV-0119", "EV-0121"], "visual": "recrutamento"}, {"id": "Q-0011", "texto": "A negociação passa a usar o texto único: um termo-quadro modular, preenchido e enviado como rascunho pedindo críticas, até virar a proposta que o Diretor aprova com sim ou não; termos fora do pacote gatilho encerram a negociação ou voltam ao desenho. Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["P-37.fluxo", "P-12"], "para": ["PE-01"], "rodada": 2, "bloco": "Atrair e selecionar", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "texto_unico", "contexto": ["Getting to Yes conta o procedimento de Camp David: um mediador redige um texto único, as partes só criticam e ele revisa até não conseguir melhorar. Fazer concessões é difícil, criticar é fácil. No fim, cada parte tem uma única decisão a tomar: sim ou não.", "O mesmo livro recomenda definir antes um pacote gatilho. Antes de aceitar qualquer acordo pior do que ele, pare e reexamine a situação. Recomenda também perguntar, antes de negociar, quem tem alçada do outro lado.", "Strategic Alliances diz que muitas vezes o melhor contrato é o que se arquiva e esquece depois de assinado. Por isso o termo deve ser curto, pensado para a saída. O termo-quadro modular (1.4.4) junta as duas ideias: um texto curto, igual para todos, com campos que mudam por parceiro."], "logica": "O texto único tira o Gerente da posição de quem cede, porque ele é quem medeia. O Diretor também sai do papel de segunda rodada de negociação, porque só responde sim ou não. A negociação fica mais curta e a regra se mantém igual para todos.", "citacoes": ["EV-0085", "EV-0086", "EV-0111", "EV-0210", "EV-0211"], "visual": "texto_unico"}, {"id": "Q-0012", "texto": "A comunidade Wise Partners no WhatsApp ganha um processo próprio (animar a comunidade): comunicado do mês, troca de práticas entre parceiros, inclusive concorrentes, convites para mentoria e eventos. Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["P-64", "P-65", "P-66"], "para": ["PE-01"], "rodada": 2, "bloco": "Desenvolver o parceiro", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "comunidade", "contexto": ["Você decidiu que a conversa com os parceiros fica na comunidade do WhatsApp, e Nearbound concorda: o parceiro nunca vai entrar no portal tanto quanto você gostaria. Com os principais, é preciso mandar mensagem e ligar com frequência, sem depender de portal.", "Bech diz que a troca de práticas entre parceiros pesa mais do que margem. Co-Opetition mostra que reunir concorrentes no mesmo evento cria o mercado para todos antes de dividi-lo, como as lojas de antiguidades que ficam na mesma rua.", "Se a comunidade é o canal, ela precisa de dono, ritmo e pauta. Sem isso, um grupo de WhatsApp vira silêncio ou ruído."], "logica": "Tratar a comunidade como processo transforma o canal que você já escolheu num ativo do programa: retenção, troca e reconhecimento público custam pouco e valem muito para o parceiro.", "citacoes": ["EV-0058", "EV-0154", "EV-0166", "EV-0168"], "visual": "comunidade"}, {"id": "Q-0013", "texto": "O programa registra a fase (experimentação, tração, crescimento) e os portões para passar de uma à outra, medidos por ativação, liquidez das oportunidades, qualidade da combinação e confiança; uma vez por ano, faz o autodiagnóstico nos oito eixos do Método Octo. Metas numéricas ficam para depois. Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-015", "P-14", "P-15"], "para": ["PE-01"], "rodada": 2, "bloco": "Gestão do programa", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "fase", "contexto": ["Você pediu para não fixar metas agora, só a capacidade de defini-las. Os livros dizem o que medir em cada fase. Platform Revolution: na partida, as métricas são liquidez, qualidade da combinação e confiança, e o que conta é compromisso e uso, não cadastro. The Ecosystem Economy: no começo, o único objetivo que importa é entregar o básico e chegar aos clientes; mais tarde, a medida principal vira o valor criado para todos.", "Winning the Right Game define o ecossistema mínimo viável como a menor configuração capaz de gerar a prova que atrai novos parceiros. Você decidiu abrir os três pilares desde o primeiro parceiro, e isso se mantém. A proposta é que os portões controlem o ritmo de escala (quantos parceiros, quantas categorias), não a abertura dos pilares.", "O autodiagnóstico do Método Octo mostra quais eixos estão fracos, para equilibrar antes de refinar."], "logica": "Com fase e portões, a decisão de crescer depende de evidência, não de calendário. E a meta, quando vier, nasce ligada ao que a fase pede.", "citacoes": ["EV-0062", "EV-0063", "EV-0064", "EV-0091", "EV-0090"], "visual": "fases"}, {"id": "Q-0014", "texto": "Antes do primeiro parceiro ativo, Wise Makers, Tríade e Swallow realinham a rotina comercial para receber oportunidades de parceiros: SLA interno, briefing, dono da conta e crédito integral na meta de quem fecha (uma receita só). Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)", "Não sei: perguntar ao Igor"], "alvo": ["F-016", "P-78"], "para": ["PE-01"], "rodada": 2, "bloco": "Gestão do programa", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "interno", "contexto": ["Winning the Right Game conta casos em que o ecossistema foi dobrado para funcionar, mas não realinhado para virar rotina, e por isso falhou. Wise Makers, Tríade e Swallow são um ecossistema interno. Se o comercial de cada empresa não tiver SLA e incentivo para tratar a oportunidade do parceiro, o retorno ao parceiro atrasa e a confiança cai.", "Nearbound diz que é uma receita só, não direta e indireta. The Channel Advantage mostra que o crédito duplo de receita costuma ser um jeito melhor de pagar canais do que fazê-los disputar a mesma comissão. Você já aprovou o crédito integral na meta de quem fecha.", "O processo M11 formaliza esse acordo interno, revisto a cada mudança de regra."], "logica": "O parceiro julga o programa pela velocidade do retorno. Quem dá esse retorno é o comercial do grupo, que não entra no portal. Sem acordo interno, o melhor desenho quebra na primeira indicação.", "citacoes": ["EV-0066", "EV-0067", "EV-0068"], "visual": "interno"}, {"id": "Q-0015", "texto": "Hoje o dinheiro só corre da Wise para o parceiro. Para o futuro, o que você quer manter aberto como opção?", "tipo": "multipla", "opcoes": ["Nada cobrado do parceiro, em nenhuma fase", "Contrapartida não financeira para entrar num pedido da Prateleira (ação conjunta, condição comercial para a indústria)", "Estudar, numa fase futura, taxa de sucesso do fornecedor quando a Prateleira gera contrato", "Estudar serviços pagos ao fornecedor (destaque marcado, relatório de por que perdeu um pedido)"], "alvo": ["F-010"], "para": ["PE-01"], "rodada": 2, "bloco": "Modelo de negócio", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "monetizacao", "contexto": ["Platform Revolution recomenda subsidiar a entrada em vez de cobrar para participar, e cobrar só na conclusão, quando a interação gerou valor para os dois lados. O livro lembra também que quem se encontra pela plataforma tem incentivo para fechar por fora. A captura de valor depende de a plataforma resolver problemas para as duas partes.", "Co-Opetition diz o contrário em um ponto: competição é valiosa, então não a ofereça de graça. Quando a Wise coloca um fornecedor num pedido da Prateleira, ela entrega a ele uma chance que a indústria valoriza.", "As duas ideias convivem se a cobrança, quando houver, vier depois do resultado e nunca na entrada. Nada disso muda a comissão já decidida."], "logica": "É uma decisão de direção, não de agora. Deixar escrito o que pode e o que não pode ser cobrado evita mudar a regra no meio do caminho, que é o que mais desgasta a confiança dos parceiros.", "citacoes": ["EV-0050", "EV-0052", "EV-0212", "EV-0053"], "visual": "monetizacao"}, {"id": "Q-0016", "texto": "Na retomada do parceiro em risco, a primeira tentativa leva uma oportunidade concreta (não um convite genérico) e a segunda é por telefone, porque conversa difícil não se faz por texto. Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alv <script src="https://cdn.jsdelivr.net/npm/bpmn-js@18.27.1/dist/bpmn-navigated-viewer.production.min.js"></script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("dados").textContent);
  var M = D.mapa;
  var COD = D.codigos || {};
  var NIV = D.niveis || {};
  var TIPO = D.tipos || {};
  var STATUS = { confirmado: "Confirmado", declarado: "Declarado", hipotese: "Hipótese", contestado: "Contestado" };
  var STATUS_EXPL = {
    confirmado: "validado pelo responsável ou por duas fontes independentes",
    declarado: "alguém da empresa ou um documento afirmou",
    hipotese: "suposição ainda não confirmada",
    contestado: "fontes discordam"
  };
  var TIPOS = { gestao: "Gestão", finalistico: "Finalísticos", suporte: "Suporte" };
  var TIPO_EXPL = { gestao: "direcionam e controlam", finalistico: "entregam valor ao cliente", suporte: "dão recursos aos demais" };
  var NIVEIS = (M.organizacao && M.organizacao.niveis) || ["Organização", "Macroprocesso", "Processo", "Subprocesso", "Atividade", "Tarefa"];
  var CAMPOS = [
    ["descricao", "Propósito"], ["dono", "Dono"], ["participantes", "Participam"], ["gatilho", "Começa quando"],
    ["entradas", "Recebe"], ["saidas", "Entrega"], ["cliente", "Cliente do processo"], ["sistemas", "Sistemas"],
    ["frequencia", "Frequência"], ["volume", "Volume"], ["duracao", "Duração"], ["indicadores", "Indicadores"],
    ["regras", "Regras"], ["dores", "Dores relatadas"]
  ];
  var OBRIG = { 1: ["tipo", "descricao", "dono"], 2: ["descricao", "dono", "gatilho", "saidas", "cliente"], 3: ["descricao", "dono", "gatilho", "entradas", "saidas", "cliente", "participantes"] };
  var TEMAS = [
    ["oferta", "O que vende"], ["cliente", "Para quem"], ["proposta_de_valor", "Por que compram"], ["canal", "Como chega ao cliente"],
    ["receita", "Como ganha dinheiro"], ["parceiro", "Parceiros"], ["recurso", "Recursos-chave"], ["custo", "Custos"],
    ["regulacao", "Regras e leis"], ["estrategia", "Estratégia e metas"], ["outro", "Outros"]
  ];

  var idx = {};
  ["fatos", "ofertas", "cadeias_de_valor", "areas", "papeis", "pessoas", "sistemas", "objetos", "processos", "evidencias", "perguntas", "formularios", "contradicoes", "decisoes", "glossario", "ideias"].forEach(function (c) {
    (M[c] || []).forEach(function (o) { if (o && o.id) idx[o.id] = o; });
  });
  var procs = M.processos || [];
  var filhos = {};
  procs.forEach(function (p) { var k = p.pai || "_raiz"; (filhos[k] = filhos[k] || []).push(p); });
  Object.keys(filhos).forEach(function (k) {
    filhos[k].sort(function (a, b) { return cmpCod(COD[a.id], COD[b.id]); });
  });
  var lacPor = {};
  (D.lacunas || []).forEach(function (l) { (lacPor[l.elemento] = lacPor[l.elemento] || []).push(l); });

  var estado = { aba: "cadeia", sel: null, abertos: {}, busca: "", filtro: { confirmado: true, declarado: true, hipotese: true, contestado: true }, fluxo: null, soSemPergunta: false };

  function cmpCod(a, b) {
    var x = String(a || "").split("."), y = String(b || "").split(".");
    for (var i = 0; i < Math.max(x.length, y.length); i++) {
      var d = (parseInt(x[i] || 0, 10) || 0) - (parseInt(y[i] || 0, 10) || 0);
      if (d) return d;
    }
    return 0;
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function vazio(v) { return v == null || (typeof v === "string" && !v.trim()) || (Array.isArray(v) && !v.length) || (typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length); }
  function nome(id) { var o = idx[id]; return o ? (o.nome || o.texto || id) : (id || ""); }
  function selo(st) { st = st || "hipotese"; return '<span class="selo ' + st + '" title="' + esc(STATUS_EXPL[st]) + '">' + STATUS[st] + "</span>"; }
  function ponto(st) { st = st || "hipotese"; return '<span class="ponto ' + st + '" title="' + STATUS[st] + '"></span>'; }
  function nivelNome(n) { return NIVEIS[n] || ("Nível " + n); }
  function refTexto(r) {
    if (!r) return "";
    if (typeof r === "string") { if (r.indexOf("EXT:") === 0) return r.slice(4) + " (externo)"; return idx[r] ? (COD[r] ? COD[r] + " " : "") + nome(r) : r; }
    if (typeof r === "object") {
      var t = r.nome || "";
      var de = r.de ? " ← " + refTexto(r.de) : "";
      var para = r.para ? " → " + refTexto(r.para) : "";
      var meta = r.meta ? " (meta: " + r.meta + ")" : "";
      return t + de + para + meta;
    }
    return String(r);
  }
  function valorCampo(p, k) {
    var v = p[k];
    if (vazio(v)) return null;
    if (k === "dono") return esc(nome(v));
    if (k === "participantes" || k === "sistemas") return v.map(function (x) { return esc(nome(x)); }).join(", ");
    if (Array.isArray(v)) return v.map(function (x) { return esc(refTexto(x)); }).join("<br>");
    return esc(v);
  }
  var SITUACAO = { no_papel: "só no papel", em_implantacao: "em implantação" };
  function situacaoTag(p) { return SITUACAO[p.situacao] ? '<span class="tag papel" title="Desenhado, mas ainda não roda (ou roda parcialmente)">' + SITUACAO[p.situacao] + "</span>" : ""; }
  function porcent(n) { return (Math.round(n * 10) / 10).toLocaleString("pt-BR") + "%"; }

  // ------------------------------------------------------------ cabeçalho
  function cabecalho() {
    var org = M.organizacao || {};
    document.getElementById("org-nome").textContent = org.nome || "Mapa de processos";
    var c = D.cobertura || {};
    document.getElementById("medidores").innerHTML =
      medidor("Informação levantada", c.completude || 0, "", "campos mínimos, fluxos e temas do negócio") +
      medidor("Validado", c.validacao || 0, "ok", (c.confirmados || 0) + " de " + (c.elementos || 0) + " elementos confirmados");
    var porNivel = c.por_nivel || {};
    var chips = Object.keys(porNivel).map(function (n) { return '<span class="chip"><b>' + porNivel[n].total + "</b> " + esc(nivelNome(+n).toLowerCase()) + (porNivel[n].total === 1 ? "" : "s") + "</span>"; });
    chips.push('<span class="chip"><b>' + (c.hipoteses || 0) + "</b> hipóteses</span>");
    chips.push('<span class="chip"><b>' + (c.perguntas_pendentes || 0) + "</b> perguntas pendentes</span>");
    chips.push('<span class="chip"><b>' + (c.contradicoes_abertas || 0) + "</b> contradições abertas</span>");
    document.getElementById("contagens").innerHTML = chips.join("");
    document.getElementById("legenda").innerHTML = ["confirmado", "declarado", "hipotese", "contestado"].map(function (s) { return selo(s); }).join("");
    document.getElementById("rodape-esq").textContent = "Atualizado em " + (org.atualizado_em || D.gerado_em || "") + (org.consultor ? " · " + org.consultor : "");
  }
  function medidor(rot, v, cls, dica) {
    return '<div class="medidor" title="' + esc(dica) + '"><div class="rot"><span>' + esc(rot) + '</span></div><div class="num">' + porcent(v) +
      '</div><div class="barra ' + cls + '"><i style="width:' + Math.max(0, Math.min(100, v)) + '%"></i></div></div>';
  }

  // ------------------------------------------------------------ cadeia de valor
  function vistaCadeia() {
    var raizes = filhos._raiz || [];
    var h = '<section class="secao"><div class="titulo-secao"><h2>Cadeia de valor</h2><span class="muted">Clique em um macroprocesso para ver o detalhe.</span></div>';
    var ordem = ["gestao", "finalistico", "suporte", null];
    var algum = false;
    ordem.forEach(function (t) {
      var grupo = raizes.filter(function (r) { return (r.tipo || null) === t; });
      if (!grupo.length) return;
      algum = true;
      h += '<div class="banda"><div class="nome-banda">' + (t ? TIPOS[t] : "Sem classificação") + "<small>" + (t ? TIPO_EXPL[t] : "tipo ainda não definido") + '</small></div><div class="fileira">';
      grupo.forEach(function (r) {
        var nf = (filhos[r.id] || []).length;
        var nl = (lacPor[r.id] || []).length;
        h += '<button class="macro ' + (t === "finalistico" ? "chevron " : "") + (r.status || "hipotese") + (estado.sel === r.id ? " sel" : "") + '" data-sel="' + esc(r.id) + '">' +
          '<span class="cab"><span class="mono muted">' + esc(COD[r.id]) + "</span>" + selo(r.status) + "</span>" +
          '<span class="nome">' + esc(r.nome) + "</span>" +
          '<span class="rodape"><span>' + (r.dono ? esc(nome(r.dono)) : "dono a definir") + "</span><span>" + (nf ? nf + " sub" : "") + (nl ? " · " + nl + " lac." : "") + "</span></span>" + situacaoTag(r) + "</button>";
      });
      h += "</div></div>";
    });
    if (!algum) h += '<div class="cartao vazio-msg">Ainda não há macroprocessos declarados. Eles aparecem aqui assim que a primeira rodada de formulários for respondida.</div>';
    h += "</section>";
    var cvs = M.cadeias_de_valor || [];
    if (cvs.length) {
      h += '<section class="secao cv"><div class="titulo-secao"><h2>Do pedido à entrega</h2><span class="muted">Caminhos ponta a ponta que atravessam os macroprocessos.</span></div>';
      cvs.forEach(function (cv) {
        h += '<div class="cartao" style="margin-bottom:10px"><div class="titulo-secao"><h3>' + esc(cv.nome) + "</h3>" + selo(cv.status) + "</div>" +
          '<p class="muted" style="margin:0 0 10px">Começa quando: ' + esc(cv.gatilho || "?") + " · Valor entregue: " + esc(cv.valor || "?") + (cv.stakeholder ? " · Para: " + esc(cv.stakeholder) : "") + "</p>" +
          '<div class="cv-etapas">' + (cv.etapas || []).map(function (et, i) {
            return '<div class="cv-etapa"><div class="n">Etapa ' + (i + 1) + "</div><div><b>" + esc(et.nome) + "</b></div>" +
              (et.processos || []).map(function (pid) { return '<div><button class="lnk" data-sel="' + esc(pid) + '">' + esc((COD[pid] || "") + " " + nome(pid)) + "</button></div>"; }).join("") + "</div>";
          }).join("") + "</div></div>";
      });
      h += "</section>";
    }
    return h;
  }

  // ------------------------------------------------------------ hierarquia
  function passaFiltro(p) {
    if (!estado.filtro[p.status || "hipotese"]) return false;
    if (!estado.busca) return true;
    var b = estado.busca.toLowerCase();
    return ((COD[p.id] || "") + " " + (p.nome || "") + " " + (p.descricao || "") + " " + nome(p.dono)).toLowerCase().indexOf(b) >= 0;
  }
  function visivel(p) {
    if (passaFiltro(p)) return true;
    return (filhos[p.id] || []).some(visivel);
  }
  function vistaHierarquia() {
    var h = '<section class="secao"><div class="titulo-secao"><h2>Hierarquia de processos</h2><span class="muted">' + procs.length + " processos</span></div>";
    h += '<div class="ferramentas"><input type="search" id="busca" placeholder="Buscar por nome, código ou dono" value="' + esc(estado.busca) + '" aria-label="Buscar processo">' +
      '<button class="btn" id="abrir-tudo">Abrir tudo</button><button class="btn" id="fechar-tudo">Fechar tudo</button></div>';
    h += '<div class="ferramentas">' + ["confirmado", "declarado", "hipotese", "contestado"].map(function (s) {
      return '<label class="filtro"><input type="checkbox" data-filtro="' + s + '"' + (estado.filtro[s] ? " checked" : "") + ">" + ponto(s) + STATUS[s] + "</label>";
    }).join("") + "</div>";
    var raizes = (filhos._raiz || []).filter(visivel);
    if (!raizes.length) h += '<div class="cartao vazio-msg">Nenhum processo com esses filtros.</div>';
    var ultimo = "_";
    h += '<div class="cartao">';
    raizes.forEach(function (r) {
      if ((r.tipo || null) !== ultimo) { ultimo = r.tipo || null; h += '<div class="grupo-tipo eyebrow">' + (ultimo ? TIPOS[ultimo] : "Sem classificação") + "</div>"; }
      h += '<ul class="arvore">' + noArvore(r) + "</ul>";
    });
    h += "</div></section>";
    return h;
  }
  function noArvore(p) {
    var kids = (filhos[p.id] || []).filter(visivel);
    var aberto = estado.abertos[p.id] || !!estado.busca;
    var nl = (lacPor[p.id] || []).length;
    var h = '<li><div class="no' + (estado.sel === p.id ? " sel" : "") + '" data-sel="' + esc(p.id) + '">' +
      (kids.length ? '<button class="seta" data-alterna="' + esc(p.id) + '" aria-expanded="' + aberto + '" aria-label="' + (aberto ? "Fechar" : "Abrir") + '">' + (aberto ? "▾" : "▸") + "</button>" : "<span></span>") +
      '<span class="cod">' + esc(COD[p.id]) + "</span>" +
      '<span class="nm">' + esc(p.nome) + " <small>· " + (p.dono ? esc(nome(p.dono)) : "dono a definir") + "</small></span>" +
      '<span class="tags">' + situacaoTag(p) + (p.fluxo ? '<span class="tag">fluxo</span>' : "") + (nl ? '<span class="tag falta">' + nl + " lacuna" + (nl > 1 ? "s" : "") + "</span>" : "") + ponto(p.status) + "</span></div>";
    if (kids.length && aberto) h += "<ul>" + kids.map(noArvore).join("") + "</ul>";
    return h + "</li>";
  }

  // ------------------------------------------------------------ fluxos
  function comFluxo() { return procs.filter(function (p) { return p.fluxo && (p.fluxo.nos || []).length; }).sort(function (a, b) { return cmpCod(COD[a.id], COD[b.id]); }); }
  function vistaFluxos() {
    var lst = comFluxo();
    if (!lst.length) return '<section class="secao"><h2>Fluxos</h2><div class="cartao vazio-msg" style="margin-top:10px">Nenhum passo a passo foi levantado ainda. Os fluxos aparecem depois das rodadas com quem executa o trabalho.</div></section>';
    if (!estado.fluxo || !lst.some(function (p) { return p.id === estado.fluxo; })) estado.fluxo = lst[0].id;
    var p = idx[estado.fluxo];
    var h = '<section class="secao"><div class="titulo-secao"><h2>Fluxos</h2><span class="muted">Diagrama em BPMN e a mesma lógica escrita em frases, para validar com quem executa.</span></div><div class="fluxos">';
    h += '<div class="lista-fluxos">' + lst.map(function (q) {
      return '<button data-fluxo="' + esc(q.id) + '" aria-pressed="' + (q.id === estado.fluxo) + '"><span class="mono muted">' + esc(COD[q.id]) + "</span><b>" + esc(q.nome) + "</b><span>" + selo(q.fluxo.status) + "</span></button>";
    }).join("") + "</div>";
    h += '<div style="min-width:0"><div class="titulo-secao"><h3>' + esc(COD[p.id] + " " + p.nome) + "</h3>" + selo(p.fluxo.status) + "</div>";
    h += '<div class="tela-bpmn" id="tela-bpmn"><div class="aviso">Carregando o diagrama…</div></div>';
    h += '<div class="acoes"><button class="btn" data-acao="copiar-bpmn">Copiar BPMN</button><button class="btn" data-acao="baixar-pacote">Baixar arquivos editáveis (.zip)</button>' +
      '<a class="btn" href="https://demo.bpmn.io/new" target="_blank" rel="noopener">Abrir o editor bpmn.io</a><button class="btn" data-sel="' + esc(p.id) + '">Ver ficha do processo</button></div>';
    h += '<p class="muted" id="msg-acao" role="status" style="margin:0 0 8px"></p>';
    h += '<div class="cartao"><h3 style="margin-bottom:8px">Leitura em frases</h3><ol class="frases">' + frasesFluxo(p).map(function (f) {
      return '<li class="' + f.cls + '">' + f.html + "</li>";
    }).join("") + "</ol></div></div></div></section>";
    return h;
  }
  function frasesFluxo(p) {
    var fl = p.fluxo || {}, nos = {}, out = {}, ext = {}, mIn = {}, mOut = {};
    (fl.nos || []).forEach(function (n) { nos[n.id] = n; });
    (fl.ligacoes || []).forEach(function (l) { (out[l.de] = out[l.de] || []).push(l); });
    (fl.externos || []).forEach(function (x) { ext[x.id] = x.nome; });
    (fl.mensagens || []).forEach(function (m) {
      if (ext[m.de]) (mIn[m.para] = mIn[m.para] || []).push(m);
      if (ext[m.para]) (mOut[m.de] = mOut[m.de] || []).push(m);
    });
    // Ordem de leitura: caminho principal primeiro (busca em profundidade), desvios depois, fins no final.
    var ordem = [], visto = {}, fins = [];
    function dfs(k) {
      if (visto[k] || !nos[k]) return;
      visto[k] = 1;
      if (nos[k].tipo === "fim") fins.push(k); else ordem.push(k);
      (out[k] || []).forEach(function (l) { dfs(l.para); });
    }
    (fl.nos || []).filter(function (n) { return n.tipo === "inicio"; }).forEach(function (n) { dfs(n.id); });
    (fl.nos || []).forEach(function (n) { dfs(n.id); });
    ordem = ordem.concat(fins);
    var num = {}, i = 0;
    ordem.forEach(function (k) { if (["tarefa", "subprocesso", "decisao", "espera"].indexOf(nos[k].tipo) >= 0) num[k] = ++i; });

  // ------------------------------------------------------------ arquivos para baixar
  var CRC = (function () { var t = [], c; for (var n = 0; n < 256; n++) { c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    fim.setUint32(0, 0x06054b50, true); fim.setUint16(8, arquivos.length, true); fim.setUint16(10, arquivos.length, true);
    fim.setUint32(12, tam, true); fim.setUint32(16, off, true);
    return new Blob(partes.concat(central, [new Uint8Array(fim.buffer)]), { type: "application/zip" });
  }
  function slug(s) { return String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48) || "item"; }
  function aviso(t) { var m = document.getElementById("msg-acao"); if (m) m.textContent = t; }
  function salvar(blob, nomeArq) {
    var w = window.claude;
    var p = w && typeof w.use === "function" ? w.use("downloads") : Promise.resolve(null);
    return Promise.resolve(p).then(function (dl) {
      if (dl) return dl.save({ filename: nomeArq, data: blob }).then(function () { aviso("Arquivo pronto: " + nomeArq); }, function (e) { aviso(e && e.code === "declined" ? "Download cancelado." : "Não foi possível baixar aqui: " + ((e && e.message) || "")); });
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = nomeArq; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      aviso("Arquivo pronto: " + nomeArq);
    });
  }
  function pacote() {
    var arqs = [];
    Object.keys(D.bpmn || {}).forEach(function (pid) { arqs.push({ nome: "bpmn/" + slug(COD[pid]) + "-" + slug(nome(pid)) + ".bpmn", texto: D.bpmn[pid] }); });
    if (D.drawio) arqs.push({ nome: "mapa.drawio", texto: D.drawio });
    Object.keys(D.mermaid || {}).forEach(function (k) { arqs.push({ nome: "mermaid/" + k, texto: D.mermaid[k] }); });
    arqs.push({ nome: "mapa.json", texto: JSON.stringify(M, null, 2) });
    arqs.push({ nome: "LEIA-ME.txt", texto: "Arquivos editáveis do mapa de processos.\n\n.bpmn: abra em https://demo.bpmn.io, Camunda Modeler ou Bizagi Modeler.\nmapa.drawio: abra em https://app.diagrams.net (uma página por visão).\nmermaid/*.mmd: cole em https://mermaid.live, Notion, GitHub ou Obsidian.\nmapa.json: a fonte de verdade do mapeamento.\n" });
    return salvar(zip(arqs), "mapa-de-processos-" + slug((M.organizacao || {}).nome) + ".zip");
  }

  // ------------------------------------------------------------ navegação
  var ABAS = { cadeia: vistaCadeia, hierarquia: vistaHierarquia, fluxos: vistaFluxos, lacunas: vistaLacunas, negocio: vistaNegocio, pessoas: vistaPessoas };
  function render() {
    document.querySelectorAll("#abas a").forEach(function (a) { if (a.dataset.aba === estado.aba) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    document.getElementById("principal").innerHTML = ABAS[estado.aba]();
    painel();
    if (estado.aba === "fluxos") montarBpmn();
  }
  function lerHash() { var h = (location.hash || "").replace("#", ""); estado.aba = ABAS[h] ? h : "cadeia"; render(); }
  window.addEventListener("hashchange", lerHash);

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-alterna],[data-sel],[data-fluxo],[data-acao],[data-ver-fluxo],#abrir-tudo,#fechar-tudo,#fechar-painel");
    if (!t) return;
    if (t.dataset.alterna) { ev.stopPropagation(); estado.abertos[t.dataset.alterna] = !estado.abertos[t.dataset.alterna]; render(); return; }
    if (t.id === "abrir-tudo") { procs.forEach(function (p) { estado.abertos[p.id] = true; }); render(); return; }
    if (t.id === "fechar-tudo") { estado.abertos = {}; render(); return; }
    if (t.id === "fechar-painel") { estado.sel = null; render(); return; }
    if (t.dataset.fluxo) { estado.fluxo = t.dataset.fluxo; render(); return; }
    if (t.dataset.verFluxo) { estado.fluxo = t.dataset.verFluxo; if (location.hash !== "#fluxos") location.hash = "fluxos"; else render(); return; }
    if (t.dataset.acao === "copiar-bpmn") {
      var xml = (D.bpmn || {})[estado.fluxo] || "";
      try { navigator.clipboard.writeText(xml).then(function () { aviso("BPMN copiado. No bpmn.io, use 'Open' e cole ou arraste o arquivo baixado."); }, function () { aviso("Não consegui copiar aqui; use o botão de baixar."); }); }
      catch (e) { aviso("Não consegui copiar aqui; use o botão de baixar."); }
      return;
    }
    if (t.dataset.acao === "baixar-pacote") { pacote(); return; }
    if (t.dataset.sel) {
      estado.sel = t.dataset.sel;
      var p = idx[estado.sel], a = p;
      while (a && a.pai) { estado.abertos[a.pai] = true; a = idx[a.pai]; }
      render();
    }
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "busca") {
      estado.busca = ev.target.value;
      var pos = ev.target.selectionStart;
      render();
      var b = document.getElementById("busca"); if (b) { b.focus(); try { b.setSelectionRange(pos, pos); } catch (e) {} }
    }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.dataset && ev.target.dataset.filtro) { estado.filtro[ev.target.dataset.filtro] = ev.target.checked; render(); }
    if (ev.target.id === "so-sem") { estado.soSemPergunta = ev.target.checked; render(); }
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && estado.sel) { estado.sel = null; render(); } });

  cabecalho();
  lerHash();
})();
</script>
