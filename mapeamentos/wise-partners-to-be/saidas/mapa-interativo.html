ches your company's ICP?", "local": "p. 174 (tipologia e fatores)"}, {"id": "EV-0195", "tipo": "documento", "fonte": "Strategic Alliances and Marketing Partnerships (Richard Gibbs, Andrew Humphries)", "pessoa": null, "data": "2026-11-01", "trecho": "There are doubtless other types, but these are unlikely to be generic or widely applicable.", "local": "p. 212 (tipologia e fatores)"}], "perguntas": [{"id": "Q-0001", "texto": "Você aprova estes 18 princípios, em quatro camadas, como a base que ordena toda a hierarquia de processos?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-002", "F-010", "F-011", "F-012", "F-013", "F-014", "F-015", "F-016"], "para": ["PE-01"], "rodada": 3, "bloco": "Os princípios", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "principios", "contexto": ["Você pediu para refatorar todos os conceitos de uma vez. Juntei o que os 16 livros dizem em comum e separei em quatro camadas: por que o programa existe, como se organiza, como se relaciona e como se mede e evolui. Cada camada responde a uma pergunta diferente, e cada princípio aponta para os processos que o colocam em prática.", "Dez dos dezoito já estavam aprovados nas suas respostas: canal mais barato que os ativos, interação central, ocupar pouco, interface simples, portal no centro, atenção proporcional, só a exceção vira trabalho, primeiro valor em 90 dias, ritmos no lugar de quadros e governança com o Diretor só assinando.", "Os oito novos vêm dos livros da segunda pasta: criar valor antes de capturar (Keystone, Give and Take), fechar o ciclo e mostrar o impacto (Referral Engine, Give and Take, Business of Belonging), ensinar a indicar (Referral Engine), norma social antes de norma de mercado (Business of Belonging, Referral Engine), reciprocidade visível (Give and Take), comunidade com ritual (Business of Belonging), medir por fatores objetivos (Keystone, Customer Success) e crescer por fases (Keystone, Winning the Right Game)."], "logica": "Quando os princípios estão escritos e ordenados, cada decisão nova tem um critério para ser julgada. Um processo que não serve a nenhum princípio é candidato a sair, o que protege o programa da complexidade que você quer evitar.", "citacoes": ["EV-0026", "EV-0051", "EV-0056", "EV-0059", "EV-0066"], "visual": "principios"}, {"id": "Q-0002", "texto": "Você aprova a hierarquia v3: três macroprocessos de gestão (Arquitetar, Gerir por rituais, Medir e aprender), seis finalísticos (Atrair, Integrar, Gerar oportunidades, Desenvolver, Cultivar a comunidade, Reter ou encerrar) e três de suporte (Prateleira, Equipar o parceiro, Operar o portal no centro)?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["P-15", "P-47"], "para": ["PE-01"], "rodada": 3, "bloco": "A nova arquitetura", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "hap", "contexto": ["Três mudanças em relação à v2. Medir e aprender virou macroprocesso, porque é ali que o portal calcula o CAC, o cubo de cada parceiro, o nível, a saúde do ecossistema e os portões. Cultivar a comunidade também virou macroprocesso, porque os livros novos mostram que a comunidade é onde o parceiro decide ficar e dar.", "No suporte, Dados e Portal viraram um só: Operar o portal no centro da gestão. É onde moram as regras que rodam sozinhas, os dados e a privacidade, os contratos e os acessos. O ecossistema interno saiu como processo, porque você decidiu que o lead vai direto ao closer, sem SLA, e isso virou uma atividade dentro de Gerar oportunidades.", "Cada processo agora diz o que o portal faz nele (registra, calcula, alerta, prepara mensagem, monta pauta). Ao todo são 12 macroprocessos, 54 processos e 24 subprocessos, com 13 fluxos detalhados."], "logica": "Com o portal descrito em cada processo, o web app fica no centro da gestão de forma concreta: dá para ver, processo a processo, o que é trabalho humano e o que é trabalho do sistema.", "citacoes": ["EV-0040", "EV-0041", "EV-0042"], "visual": "hap"}, {"id": "Q-0003", "texto": "No lugar dos três fatores de saúde e dos oito tipos do livro, você aprova o cubo: Valor, Ritmo e Relação, cada um alto ou baixo, formando oito tipos por regra fixa, com o Potencial definindo só a atenção?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-034", "P-17", "P-17.fluxo", "P-18", "F-015", "P-63", "P-64", "P-65", "P-66"], "para": ["PE-01"], "rodada": 3, "bloco": "Fatores e tipos", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "cubo", "contexto": ["Você desconfiou dos três fatores e pediu uma regra lógica que levasse aos oito tipos. Relemos o livro inteiro para isso. O próprio Strategic Alliances diz que a autoavaliação posiciona a parceria só de forma muito aproximada. Os oito tipos são perfis escolhidos entre 64 combinações de quatro níveis em três fatores: só 8 combinações batem exatamente com um perfil, e 22 empatam entre perfis. Nenhum corte alto ou baixo separa os oito. Ou seja, não é uma matriz, e a sua desconfiança procedia.", "A proposta mantém a ideia do livro (valor, cooperação, qualidade da relação), mas mede comportamentos que o portal registra e transforma tudo numa matriz de verdade. Valor: o que a relação já entregou em 12 meses, receita ganha mais pipeline ponderado. Ritmo: recência e frequência de ações de valor. Relação: o pulso trimestral, o retorno mútuo e o equilíbrio entre indicações enviadas e recebidas, a reciprocidade de Give and Take. Dois níveis em cada fator dão exatamente oito células, e cada célula é um tipo.", "A lógica RFV que você pediu está dentro do cubo: o Ritmo é a recência e a frequência, e o Valor é o V. A Relação acrescenta o que o RFV de clientes não vê, a tensão na relação. O Potencial (os 4 Cs de Nearbound: carteira, credibilidade, capacidade, compromisso) não muda o tipo, só decide se vale pôr mais horas."], "logica": "Com três fatores binários, qualquer pessoa explica a regra em um minuto, e cada tipo leva a uma ação. Os cortes (12 meses, 30 dias, 2 ações, índice 70) são provisórios e se calibram na primeira revisão trimestral com dados reais.", "citacoes": ["EV-0096", "EV-0067", "EV-0195", "EV-0119", "EV-0098"], "visual": "cubo"}, {"id": "Q-0004", "texto": "Você aprova a ação, a abordagem e a cadência de cada um dos oito tipos, inclusive para quem está em risco (Âncora esfriando, Valioso em risco, Cordial seletivo, Desertor)?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["P-42", "P-53", "P-52.fluxo"], "para": ["PE-01"], "rodada": 3, "bloco": "Fatores e tipos", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "tipos", "contexto": ["Você pediu uma abordagem por tipo, como numa matriz RFV. A tabela da figura mostra o resumo. Embaixador: proteger e alavancar, com tom de sócio. Gerador sob tensão: diagnosticar em 7 dias o que tensiona (lead sem retorno, comissão percebida como injusta). Âncora esfriando: chegar com uma oportunidade pronta, sem cobrança. Valioso em risco: ouvir primeiro, por ligação, e decidir em 15 dias se vale. Promissor: buscar a primeira venda em 90 dias. Ativo sem tração: descobrir em 60 dias por que a atividade não vira receita. Cordial seletivo: recrutar de novo com foco único. Desertor: decidir, sem insistir.", "As ações vêm do que o Strategic Alliances recomenda para os perfis equivalentes: o catador de cerejas tratado como recrutamento novo, o desertor como decisão sobre se vale o esforço. A elas se somam Customer Success (todo sinal vira ação com dono e prazo) e Give and Take (julgar quem só toma pelo comportamento).", "No portal, a mudança de tipo cria a tarefa da jogada na sua fila, com a mensagem sugerida. A retenção deixa de ser um fluxo único e passa a seguir o tipo de cada parceiro."], "logica": "Abordar o parceiro pelo motivo real do afastamento economiza tempo e preserva a relação: quem esfriou por falta de oportunidade não precisa de cobrança, e quem nunca teve tração precisa de diagnóstico, não de convite.", "citacoes": ["EV-0150", "EV-0121", "EV-0047", "EV-0060"], "visual": "tipos"}, {"id": "Q-0005", "texto": "A métrica-mãe do programa passa a ser o CAC dos clientes vindos de parceiros, comparado ao CAC dos canais ativos. Quem informa o CAC dos canais ativos?", "tipo": "escolha", "opcoes": ["Eu informo", "O financeiro informa", "O Igor informa", "Não sei: perguntar ao Igor"], "alvo": ["F-028", "P-06", "P-15"], "para": ["PE-01"], "rodada": 3, "bloco": "Modelo de negócio", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "cac", "contexto": ["Você deixou claro o porquê do programa: parceria é um canal de aquisição de receita mais barato que os canais ativos, e a comissão só serve para baratear ainda mais o CAC. Se é esse o objetivo, ele precisa ser a primeira medida, não um resultado escondido entre outros.", "O portal já tem o que precisa para o lado do canal: comissões, horas registradas e custos diretos, divididos pelos clientes fechados vindos de parceiros. O Método Octo compara a relação entre critério e benefício à de CAC e LTV, e o Referral Engine manda medir fonte, conversão e custo por cliente.", "Falta o termo de comparação: o CAC dos canais ativos do grupo (prospecção, eventos, mídia). Só alguém fora do portal tem esse número."], "logica": "Uma métrica-mãe ligada ao motivo de existir do programa decide sozinha boa parte das discussões: o que não baixa o CAC nem aumenta a adesão não entra.", "citacoes": ["EV-0021", "EV-0024", "EV-0091"], "visual": "cac"}, {"id": "Q-0006", "texto": "Além do cubo por parceiro, o programa inteiro ganha três medidas de saúde: produtividade (oportunidades e clientes por parceiro ativo, e o CAC caindo), robustez (ativos que seguem ativos e base que não depende de um só parceiro) e criação de nicho (categorias e tipos novos gerando valor). Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-033", "P-20"], "para": ["PE-01"], "rodada": 3, "bloco": "Fatores e tipos", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "saude", "contexto": ["The Keystone Advantage mostra que um programa pode ter parceiros bons e mesmo assim estar doente. É o caso de quando tudo depende de um parceiro só, ou quando o custo de servir cresce mais do que o valor. Por isso o livro mede o ecossistema inteiro em três medidas: produtividade, robustez e criação de nicho.", "Aqui elas viram números do painel trimestral, calculados pelo portal. Produtividade: oportunidades e clientes por parceiro ativo e a tendência do CAC. Robustez: quantos ativos seguem ativos depois de dois trimestres e quanto o resultado depende dos três maiores parceiros. Criação de nicho: categorias e tipos de parceiro novos que já geram oportunidade."], "logica": "O cubo diz onde agir em cada parceiro. A saúde do ecossistema diz se o programa como um todo está ficando mais forte ou mais frágil, que é a pergunta do Diretor.", "citacoes": ["EV-0093", "EV-0094", "EV-0095"], "visual": "saude"}, {"id": "Q-0007", "texto": "Você pediu que eu recomendasse os portões. Você aprova os portões abaixo (ajustando números no comentário, se quiser)?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-035", "F-016", "P-12.fluxo"], "para": ["PE-01"], "rodada": 3, "bloco": "Gestão do programa", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "portoes", "contexto": ["Recomendação, juntando o seu objetivo (CAC menor que os canais ativos) com o que os livros pedem em cada fase. Winning the Right Game pede evidência que atraia o próximo parceiro. Keystone pede liquidez em escala pequena antes de escalar. Customer Success pede um processo que se repete antes de se padronizar. Business of Belonging pede que os parceiros comecem a puxar a conversa.", "Experimentação para Tração, valendo por um trimestre: 5 parceiros ativados; 3 clientes fechados vindos de parceiros; CAC do canal menor ou igual ao dos canais ativos; metade das oportunidades qualificadas virando reunião; rituais rodando dois trimestres seguidos do mesmo jeito.", "Tração para Crescimento: 15 parceiros ativos, com 40% em Ritmo alto; parceiros originando 20% dos clientes novos do grupo; CAC do canal na metade do dos canais ativos; metade das conversas da comunidade iniciadas por parceiros; 80% dos ativos seguindo ativos depois de dois trimestres. Na fase de Crescimento entram categorias e regiões novas e, quando o custo de servir passar das horas disponíveis, uma segunda pessoa no time.", "Os números são inferência minha, calibrada ao tamanho do grupo; nenhum livro dá números para o caso Wise. Os três pilares ficam abertos desde o início, como você decidiu."], "logica": "O portão controla o ritmo de escala, não a abertura dos pilares. Com portões ligados ao CAC, crescer só faz sentido quando crescer barateia a aquisição.", "citacoes": ["EV-0069", "EV-0070", "EV-0100", "EV-0101"], "visual": "portoes"}, {"id": "Q-0008", "texto": "Revisei o princípio das três perguntas, como você pediu: elas saem. No lugar, toda semana você revisa as oportunidades abertas e conversa com cada closer sobre as dele, e uma vez por mês o Igor recebe um resumo de poucos números. Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["P-10", "P-13"], "para": ["PE-01"], "rodada": 3, "bloco": "Gestão do programa", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "semana", "contexto": ["As três perguntas vinham de Nearbound, que propõe embutir o programa na reunião comercial (uma receita só, não direta e indireta). O princípio continua certo: o parceiro tem de fazer parte da rotina de venda. Mas o meio estava pesado para o caso Wise. Você já decidiu que o lead vai direto ao closer e que a conversa com ele é pessoal.", "Então o ritual semanal fica seu, sem pauta formal com o grupo. O portal lista, por closer, as oportunidades abertas e o último retorno dado ao parceiro, e você conversa com cada um como preferir. Com o Igor, o contato vira um resumo mensal de poucos números: CAC do canal, parceiros ativos, oportunidades e clientes do mês, distância dos portões. Ele já confia na sua autonomia."], "logica": "O princípio (o programa vive dentro da rotina comercial) fica; o mecanismo vira o mais leve possível. Isso tira uma reunião da agenda dos closers e do Igor e mantém a informação que importa.", "citacoes": ["EV-0111", "EV-0009", "EV-0007"], "visual": "semana"}, {"id": "Q-0009", "texto": "Como o Igor só assina, quem decide o desligamento de um parceiro?", "tipo": "escolha", "opcoes": ["Eu decido e informo o Igor", "Eu decido e o Igor assina o aviso formal", "O Igor decide, como na especificação", "Não sei: perguntar ao Igor"], "alvo": ["P-54.dono"], "para": ["PE-01"], "rodada": 3, "bloco": "Gestão do programa", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "diretor", "contexto": ["A especificação prevê aprovação do Diretor no desligamento. Na Rodada 2 você disse que o Igor não faz aprovação criteriosa: ele assina. A governança que os livros pedem (Keystone, Customer Success) é ter um dono único com autoridade e regras visíveis, não necessariamente uma aprovação em duas camadas.", "O desligamento já tem critérios objetivos no portal (tempo sem resultado, duas tentativas de retomada, tipo Desertor no cubo). A pergunta é só quem dá a palavra final."], "logica": "Se você é o dono do programa, a decisão é sua; se o desligamento tem peso de contrato, a assinatura do Igor no aviso fecha o rito sem exigir análise dele.", "citacoes": ["EV-0075", "EV-0076", "EV-0007"], "visual": "diretor"}, {"id": "Q-0010", "texto": "A cada mudança de etapa de uma oportunidade, o portal prepara a mensagem e você a envia no grupo do parceiro; no fim, mostra o impacto gerado (cliente fechado, valor, comissão). Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-010", "P-35", "P-35.fluxo", "P-32.fluxo", "P-78"], "para": ["PE-01"], "rodada": 3, "bloco": "A relação com o parceiro", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "ciclo", "contexto": ["Três livros novos chegam ao mesmo ponto. O Referral Engine diz para fechar o ciclo com quem indicou em cada fase, não só no fechamento. Give and Take mostra que quem dá se esgota quando não vê o impacto do que fez, não por dar demais. Business of Belonging diz que, sem validação, a participação não volta.", "Como o closer está fora do portal, o retorno ao parceiro só acontece se alguém o fizer. O portal detecta a mudança de etapa e deixa a mensagem pronta. Você só copia, ajusta e envia no WhatsApp, como já é o seu canal."], "logica": "O parceiro que vê o que sua indicação gerou indica de novo. Este é provavelmente o gesto de maior retorno do programa, e custa um minuto por etapa.", "citacoes": ["EV-0051", "EV-0052", "EV-0053"], "visual": "ciclo"}, {"id": "Q-0011", "texto": "Na integração, o parceiro aprende a indicar: o perfil do cliente ideal, frases que reconhecem a dor na conversa com o cliente dele e um gesto de indicação sem atrito. O que você adota?", "tipo": "multipla", "opcoes": ["Perfil do cliente ideal de cada empresa do grupo em uma página", "Frases-gatilho: o que o cliente diz quando precisa da Wise, da Tríade ou da Swallow", "Mensagem pronta de indicação para o parceiro enviar ao cliente dele", "Encontro curto de prática na integração"], "alvo": ["F-011", "P-30", "P-27.fluxo", "P-74", "P-75", "P-76", "P-87"], "para": ["PE-01"], "rodada": 3, "bloco": "A relação com o parceiro", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "ensinar", "contexto": ["O Referral Engine diz que a indicação falha mais por falta de método do que por falta de vontade. Quem indica precisa reconhecer o cliente certo e saber o que dizer, e qualquer atrito reduz a taxa de indicação.", "O kit de vendas e o simulador de ganho que você pediu já entram no portal do parceiro. A proposta acrescenta o que transforma conhecimento em gesto: as frases que o cliente do parceiro diz quando precisa de gestão comercial, e a mensagem pronta para apresentar a Wise."], "logica": "Ensinar a reconhecer o momento é mais barato que gerar lead do zero, e baixa o CAC sem mudar a comissão.", "citacoes": ["EV-0054", "EV-0055", "EV-0176"], "visual": "ensinar"}, {"id": "Q-0012", "texto": "Para cultivar a comunidade Wise Partners, o que você adota?", "tipo": "multipla", "opcoes": ["Um ou dois objetivos por fase (nesta, trazer parceiros e trazer oportunidades), medidos pelo portal", "Rituais de formato fixo: comunicado do mês, encontro trimestral de parceiros e mentoria mensal", "Um grupo geral da comunidade, além dos grupos por parceiro, com pedidos e contribuições à vista", "Reconhecimento por status, rede e acesso (destaque, acesso antecipado à Prateleira, palco), separado da comissão"], "alvo": ["P-47", "P-48", "P-49", "P-50", "P-51", "F-014", "F-012", "F-013", "P-80", "P-81"], "para": ["PE-01"], "rodada": 3, "bloco": "A relação com o parceiro", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "comunidade", "contexto": ["Business of Belonging diz que a comunidade precisa de um objetivo de negócio claro por fase, de rituais que se repetem e de validação. Diz também que trocar norma social por norma de mercado mata o pertencimento: o parceiro fica pela utilidade e pela identidade, não pelo pagamento.", "Give and Take traz o Anel de Reciprocidade: a maior parte do dar nasce de um pedido explícito, e o dar visível faz os outros darem também. Com um grupo por parceiro, ninguém vê ninguém dar. Por isso a proposta de um espaço geral, que fica opcional porque muda a dinâmica que você já tem.", "A comissão continua sendo a regra única que você decidiu, só fica fora da conversa da comunidade."], "logica": "Uma comunidade com objetivo, ritual e reconhecimento custa poucas horas e vira o lugar onde o parceiro decide ficar. Isso pesa na robustez do ecossistema e no CAC.", "citacoes": ["EV-0159", "EV-0061", "EV-0056", "EV-0162"], "visual": "comunidade"}, {"id": "Q-0013", "texto": "Na qualificação, você aprova incluir a leitura de comportamento (quem só toma se reconhece pelo que faz, não pela simpatia) e a regra de só aceitar quem a Wise indicaria ao seu melhor cliente?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["P-23.descricao", "F-002", "P-70"], "para": ["PE-01"], "rodada": 3, "bloco": "Atrair e selecionar", "status": "em_formulario", "formulario": "FO-01", "respostas": [], "chave": "qualificacao", "contexto": ["Give and Take mostra que quem só toma costuma ser simpático com quem está acima e duro com quem está ao lado, e que se reconhece pelo comportamento e pela reputação. O Referral Engine dá a regra de entrada mais simples possível: só entra na rede quem você indicaria ao seu melhor cliente.", "Na prática, isso entra na ficha de jogo que você já aprovou, como duas perguntas: o que esse candidato já deu antes de pedir, e se a Wise o indicaria a um cliente importante. Sem formulário novo."], "logica": "Um tomador na rede consome horas, pede exceções e desanima quem dá. Filtrar na entrada é muito mais barato que desligar depois.", "citacoes": ["EV-0060", "EV-0107", "EV-0026"], "visual": "qualificacao"}], "formularios": [{"id": "FO-01", "titulo": "Rodada 3: princípios e to-be refatorado com 16 livros", "rodada": 3, "para": ["PE-01"], "canal": "artifact", "perguntas": ["Q-0001", "Q-0002", "Q-0003", "Q-0004", "Q-0005", "Q-0006", "Q-0007", "Q-0008", "Q-0009", "Q-0010", "Q-0011", "Q-0012", "Q-0013"], "introducao": "Cada pergunta traz o contexto, a lógica, o que os livros dizem e um visual.", "link": "https://claude.ai/artifact/ErCdBFw4dwso4pcz9RbUEw", "status": "enviado", "enviado_em": "2026-11-01", "prazo": "", "identificacao": false}], "contradicoes": [], "decisoes": [{"id": "DE-01", "data": "2026-11-01", "texto": "A especificação e o web app prevalecem sobre o Playbook v3.1, que está desatualizado.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0015", "EV-0016"]}, {"id": "DE-02", "data": "2026-11-01", "texto": "O to-be é refeito do zero a partir dos modelos conceituais dos livros, com mais processos e mais detalhe, mesmo que mude 100% do desenho anterior.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0017"]}, {"id": "DE-03", "data": "2026-11-01", "texto": "Os três pilares (Prateleira, Base Ativa e indicações) entram juntos desde o primeiro parceiro.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0018"]}, {"id": "DE-04", "data": "2026-11-01", "texto": "Metas e horas não são fixadas agora: o desenho guarda só a capacidade de definir metas e de gerir o tempo dedicado ao programa.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0019", "EV-0020"]}, {"id": "DE-05", "data": "2026-11-01", "texto": "A comunicação com os parceiros fica na comunidade Wise Partners no WhatsApp; o portal não vira canal de conversa.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0012"]}, {"id": "DE-06", "data": "2026-11-01", "texto": "Todas as tarefas do portal têm o Gerente de Parcerias como dono, mesmo quando outra pessoa executa; consultores e comercial não entram no portal.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0005"]}, {"id": "DE-07", "data": "2026-11-01", "texto": "O programa é um canal de aquisição de receita mais barato que os canais ativos; a comissão só barateia ainda mais o CAC e nada deve complicar o programa a ponto de reduzir a adesão.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0021"]}, {"id": "DE-08", "data": "2026-11-01", "texto": "A comissão é regra única, sem exceção por parceiro.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0022"]}, {"id": "DE-09", "data": "2026-11-01", "texto": "O lead vai direto ao closer da empresa do grupo; o Gerente de Parcerias combina com ele pessoalmente, sem SLA interno.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0009"]}, {"id": "DE-10", "data": "2026-11-01", "texto": "O Diretor só assina o termo; o Gerente de Parcerias negocia com autonomia.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0007"]}, {"id": "DE-11", "data": "2026-11-01", "texto": "A Prateleira pede ao fornecedor só contrapartida não financeira (ação conjunta ou condição comercial para a indústria).", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0021"]}, {"id": "DE-12", "data": "2026-11-01", "texto": "Passo a passo detalhado só para os processos que viram quadro, fila ou ritual; os demais ficam no nível de dono, gatilho e entregas.", "por": "PE-01", "provisoria": false, "evidencias": ["EV-0023"]}], "glossario": [{"id": "GL-01", "termo": "Tipo Embaixador", "definicao": "V alto, R alto, Q alto (AAA). Ação: Proteger e alavancar. Pedir dois movimentos por trimestre: uma indicação nova de alta qualidade e um movimento conjunto (caso de sucesso, ação na Base Ativa ou resposta a uma RFP da Prateleira). Conferir os números reais da relação: o livro alerta que muitos Evangelistas não são os mais lucrativos. Usar como piloto de novas jogadas. Abordagem: Tom de sócio: reconhecimento, acesso antecipado às RFPs da Prateleira, co-marketing, novidades das empresas do grupo. Mensagens constantes e conservadoras, sem mudar o processo de repente, e uma iniciativa nova de tempos em tempos para não virar acomodação. Nenhuma exceção de comissão (regra única). Cadência: Ligação ou conversa mensal com o gerente, grupo de WhatsApp conforme a demanda, revisão trimestral conjunta com dados.", "sinonimos": [], "evidencias": ["EV-0096", "EV-0150"]}, {"id": "GL-02", "termo": "Tipo Gerador sob tensão", "definicao": "V alto, R alto, Q baixo (AAB). Ação: Diagnosticar em 7 dias úteis a causa da tensão (lead sem retorno do closer, comissão percebida como injusta, expectativa de volume, concorrência) e fazer uma revisão conjunta extra em 30 dias, com os números das indicações, retornos, comissão paga e receita gerada. Resolver pela conversa de negócio e não pela de relacionamento. Abordagem: Direta e baseada em dados, com o ROI dele e o que a Wise investiu; entender o modelo de negócio do parceiro antes de explicar o da Wise. Falar com o decisor dele. Não oferecer exceção de comissão. Alavancas legítimas: prioridade de retorno dos closers, acesso à Prateleira e co-marketing. Registrar tudo o que for combinado. Cadência: Quinzenal até Q maior ou igual a 70 por dois meses; revisão extra em 30 dias.", "sinonimos": [], "evidencias": ["EV-0096", "EV-0150"]}, {"id": "GL-03", "termo": "Tipo Âncora esfriando", "definicao": "V alto, R baixo, Q alto (ABA). Ação: Reativar em 7 dias após a recência passar de 30 dias, com um motivo concreto: uma RFP da Prateleira aderente ao perfil, um cruzamento de carteiras ou uma ação na Base Ativa. Confirmar quem é o responsável do lado dele. Abordagem: Sem cobrança, com utilidade: chegar com oportunidade pronta e reconhecer o resultado passado (ajudar primeiro). Pedir 15 minutos. Na variante rebelde: reafirmar objetivos, auditar investimentos dos dois lados e não trocar o contato-chave sem consentimento. Cadência: Quinzenal até duas leituras seguidas de Ritmo alto.", "sinonimos": [], "evidencias": ["EV-0096", "EV-0150"]}, {"id": "GL-04", "termo": "Tipo Valioso em risco", "definicao": "V alto, R baixo, Q baixo (ABB). Ação: Decidir em 15 dias se vale o investimento (o livro chama isso de decisão crítica). Se vale: ligação do gerente em 48 horas, ligação de cortesia de uma pessoa sênior do grupo se não houver resposta em 10 dias (gesto de relação, não aprovação), corrigir pendências (leads sem retorno, comissões em aberto) e combinar um objetivo curto e tangível. Abordagem: Ouvir primeiro, reconhecer falhas e tratar como parceria nova, com horizonte de 6 a 12 meses. Se a queixa for com uma pessoa, oferecer outro interlocutor (por exemplo, o líder do closer). Evitar campanhas genéricas. Cadência: Semanal por 6 semanas, depois quinzenal; reavaliar em 90 dias.", "sinonimos": [], "evidencias": ["EV-0096", "EV-0150"]}, {"id": "GL-05", "termo": "Tipo Promissor", "definicao": "V baixo, R alto, Q alto (BAA). Ação: Obter a primeira venda em 90 dias: escolher uma oportunidade concreta (RFP da Prateleira ou cruzamento de carteiras), acompanhar de perto e garantir retorno rápido do closer ao gerente e do gerente ao parceiro; fazer a indicação com a participação dele (apresentação a três). Abordagem: Onboarding guiado: ensinar o perfil do cliente ideal, as frases-gatilho e o que acontece depois da indicação. Cuidar da expectativa para não virar impaciência de Adolescente Rebelde. Cadência: Semanal nas primeiras 4 semanas, depois quinzenal até a primeira venda.", "sinonimos": [], "evidencias": ["EV-0096", "EV-0150"]}, {"id": "GL-06", "termo": "Tipo Ativo sem tração", "definicao": "V baixo, R alto, Q baixo (BAB). Ação: Descobrir em 60 dias por que a atividade não vira receita: revisar as oportunidades recusadas ou paradas (motivo, perfil, etapa), corrigir o entendimento do cliente ideal e do que a Wise vende, e separar o que é gargalo do lado do parceiro (qualidade da indicação) do que é do lado da Wise (retorno lento). Abordagem: Ação unilateral que quebra o impasse: consertar primeiro o que é da Wise e depois pedir o ajuste. Aproximar quem fala a mesma língua (closer e gestor técnico do parceiro, 20 minutos). Mostrar pequenas vitórias. Cadência: Quinzenal; checkpoint em 60 dias.", "sinonimos": [], "evidencias": ["EV-0096", "EV-0150"]}, {"id": "GL-07", "termo": "Tipo Cordial seletivo", "definicao": "V baixo, R baixo, Q alto (BBA). Ação: Recrutar de novo com foco único: uma atividade, um cliente ou uma RFP, mais um credenciamento (treinamento na oferta do grupo) que aumente o compromisso. Se P for alto, vale o esforço; se for baixo, atenção baixa. Abordagem: Não propor rodada de reuniões executivas. Mostrar a proposta de valor e o que ele ganha, começando pelo cliente dele. Convite curto para falar de um cliente específico. Cadência: Mensal e leve (WhatsApp), uma jogada por trimestre; reavaliar em 90 dias.", "sinonimos": [], "evidencias": ["EV-0096", "EV-0150"]}, {"id": "GL-08", "termo": "Tipo Desertor", "definicao": "V baixo, R baixo, Q baixo (BBB). Ação: Decidir. Se P alto: uma conversa de reinício, tratando como parceria nova, com 6 meses de observação. Se P baixo: atenção baixa (comunicação em grupo e automação trimestral) e, sem ação de valor em 180 dias, arquivar com saída cordial e registrar o motivo. Abordagem: Sem pressão e sem campanha genérica, que tende a falhar. Porta aberta. Registrar o motivo da saída para alimentar o onboarding. Cadência: Trimestral e automatizada; se P alto, um contato pessoal por trimestre.", "sinonimos": [], "evidencias": ["EV-0096", "EV-0150"]}, {"id": "GL-09", "termo": "Valor (fator do cubo)", "definicao": "Quanto a relação já entregou em receita para o grupo Wise, em contratos ganhos e em pipeline ponderado. V = soma do valor contratado das oportunidades ganhas com origem no parceiro nos últimos 12 meses (ou desde a adesão, se menor) + soma do valor estimado das oportunidades abertas dele multiplicado pela probabilidade da etapa. Vale qualquer das quatro portas (indicação por link, Prateleira, cruzamento de carteiras, Base Ativa). Corte inicial: ALTO se houver pelo menos 1 contrato ganho nos 12 meses (fase com até 10 parceiros ativos); depois, ALTO se V for maior ou igual à mediana dos parceiros com ao menos 1 oportunidade registrada. Convenção de valor: a mesma da base de cálculo da comissão de cada empresa do grupo.", "sinonimos": [], "evidencias": ["EV-0096"]}, {"id": "GL-10", "termo": "Ritmo (fator do cubo)", "definicao": "Se a relação está viva: há quanto tempo o parceiro fez algo de valor e com que frequência faz. Ação de valor = (a) indicação enviada, (b) retorno do parceiro a uma oportunidade enviada pela Wise ou a uma RFP da Prateleira em até 5 dias úteis, (c) ação de Base Ativa registrada (comunidade ou evento), (d) presença na revisão trimestral. Recência: dias desde a última ação de valor. Frequência: número de ações de valor nos últimos 90 dias. ALTO se recência menor ou igual a 30 dias E frequência maior ou igual a 2 em 90 dias. Parceiro com menos de 30 dias de adesão fica em aquecimento e não é classificado. Quando houver 30 ou mais parceiros, separar R e F e trocar o corte fixo por quintis.", "sinonimos": [], "evidencias": ["EV-0119"]}, {"id": "GL-11", "termo": "Relação (fator do cubo)", "definicao": "Qualidade da relação: confiança, justiça percebida, retorno mútuo e equilíbrio entre dar e receber oportunidades. Índice de 0 a 100: Q = 0,5 x Pulso + 0,3 x Retorno mútuo + 0,2 x Equilíbrio. Pulso: três perguntas de 1 a 5 na revisão trimestral, respondidas pelo parceiro e pelo gerente sobre o outro lado: (1) você daria uma referência positiva a um cliente seu? (2) a divisão de esforço e ganho é justa? (3) sabemos o que esperar um do outro? A nota é a média das duas visões; diferença de 2 pontos ou mais gera alerta de percepção. Retorno mútuo: média de (a) percentual de oportunidades enviadas pela Wise ao parceiro com resposta em até 5 dias úteis e (b) percentual de indicações do parceiro cujo status voltou ao parceiro em até 5 dias úteis, registrado pelo gerente depois de falar com o closer. Equilíbrio: 100 menos 200 vezes a distância de 0,5, onde o saldo é indicações enviadas pelo parceiro dividido por (enviadas por ele mais enviadas a ele). ALTO se Q maior ou igual a 70. Sem pulso ainda, calcula só com os outros dois e mostra estado parcial.", "sinonimos": [], "evidencias": ["EV-0121", "EV-0098"]}, {"id": "GL-12", "termo": "Potencial", "definicao": "Quanto o parceiro poderia gerar: aderência de carteira ao cliente ideal da Wise e capacidade de agir. Nota de 0 a 4, um ponto por C, cada C valendo 0, 0,5 ou 1, preenchida no onboarding e revista a cada semestre com dados reais: Customer base (indústrias da carteira dentro do ICP, tamanho e acesso, incluindo Base Ativa), Credibility (reputação com as indústrias), Capability (equipe e ferramentas para operar as portas), Commitment (aceita ritual trimestral, tem dono interno, informa carteira). ALTO se nota maior ou igual a 3.", "sinonimos": [], "evidencias": ["EV-0194"]}, {"id": "GL-13", "termo": "Oportunidade compartilhada", "definicao": "Unidade de valor do programa: uma indústria com necessidade conhecida conectada, com contexto, a quem resolve.", "sinonimos": [], "evidencias": ["EV-0032"]}, {"id": "GL-14", "termo": "Parceiro ativo", "definicao": "Parceiro que já teve a primeira indicação no ICP que virou reunião.", "sinonimos": [], "evidencias": ["EV-0016"]}, {"id": "GL-15", "termo": "Exceção", "definicao": "O que fugiu da regra e por isso vira tarefa na fila; o que segue a regra não gera trabalho.", "sinonimos": [], "evidencias": ["EV-0047"]}, {"id": "GL-16", "termo": "Texto único", "definicao": "Minuta que circula como rascunho pedindo críticas até as duas partes aprovarem; o Diretor só assina.", "sinonimos": [], "evidencias": ["EV-0007"]}], "ideias": [], "historico": [{"data": "2026-11-01", "evento": "Mapeamento iniciado"}, {"data": "2026-11-01", "evento": "To-be v3: 18 princípios de 16 livros, cubo Valor, Ritmo e Relação, hierarquia refatorada com o portal no centro; Rodada 3"}]}, "codigos": {"P-01": "1", "P-02": "1.1", "P-03": "1.2", "P-04": "1.3", "P-05": "1.4", "P-59": "1.4.1", "P-60": "1.4.2", "P-61": "1.4.3", "P-62": "1.4.4", "P-06": "1.5", "P-07": "1.6", "P-08": "2", "P-09": "2.1", "P-10": "2.2", "P-11": "2.3", "P-12": "2.4", "P-13": "2.5", "P-14": "2.6", "P-15": "3", "P-16": "3.1", "P-17": "3.2", "P-63": "3.2.1 rtunidade pronta ao parceiro\"]:::hipotese\n      n_t2[\"Ouvir o parceiro e decidir em 15 dias se vale\"]:::hipotese\n      n_t3[\"Recrutar de novo com um foco único\"]:::hipotese\n      n_t4[\"Decidir sem insistir\"]:::hipotese\n      n_e1>\"30 dias\"]:::hipotese\n      n_g2{\"O Ritmo voltou a ser alto?\"}:::hipotese\n      n_t5[\"Sugerir o desligamento\"]:::hipotese\n      n_t6[\"Decidir o desligamento com motivo\"]:::hipotese\n      n_g3{\"Desligar?\"}:::hipotese\n      n_t7[\"Comunicar o encerramento em conversa e por escrito\"]:::hipotese\n      n_e2>\"30 dias de aviso\"]:::hipotese\n      n_t8[\"Encerrar a parceria e revogar acessos\"]:::hipotese\n      n_f1([\"Parceiro retomado\"]):::hipotese\n      n_f2([\"Parceiro mantido em observação\"]):::hipotese\n      n_f3([\"Parceria encerrada\"]):::hipotese\n    end\n    ext_X1[/\"Parceiro\"/]\n    n_i1 --> n_g1\n    n_g1 -->|Âncora esfriando| n_t1\n    n_g1 -->|Valioso em risco| n_t2\n    n_g1 -->|Cordial seletivo| n_t3\n    n_g1 -->|Desertor| n_t4\n    n_t1 --> n_e1\n    n_t2 --> n_e1\n    n_t3 --> n_e1\n    n_t4 --> n_t5\n    n_e1 --> n_g2\n    n_g2 -->|Sim| n_f1\n    n_g2 -->|Não| n_t5\n    n_t5 --> n_t6\n    n_t6 --> n_g3\n    n_g3 -->|Não| n_f2\n    n_g3 -->|Sim| n_t7\n    n_t7 --> n_e2\n    n_e2 --> n_t8\n    n_t8 --> n_f3\n    n_t1 -.->|Oportunidade| ext_X1\n    n_t3 -.->|Convite com foco único| ext_X1\n    n_t7 -.->|Aviso formal| ext_X1\n"}}</script>

<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("dados").textContent);
  var M = D.mapa;
  var COD = D.codigos || {};
  var NIV = D.niveis || {};
  var TIPO = D.tipos || {};
  var STATUS = { confirmado: "Confirmado", declarado: "Declarado", hipotese: "Hipótese", contestado: "Contestado" };
  var STATUS_EXPL = {
    confirmado: "validado pelo responsável ou por duas fontes independentes",
    declarado: "alguém da empresa ou um documento afirmou",
    hipotese: "suposição ainda não confirmada",
    contestado: "fontes discordam"
  };
  var TIPOS = { gestao: "Gestão", finalistico: "Finalísticos", suporte: "Suporte" };
  var TIPO_EXPL = { gestao: "direcionam e controlam", finalistico: "entregam valor ao cliente", suporte: "dão recursos aos demais" };
  var NIVEIS = (M.organizacao && M.organizacao.niveis) || ["Organização", "Macroprocesso", "Processo", "Subprocesso", "Atividade", "Tarefa"];
  var CAMPOS = [
    ["descricao", "Propósito"], ["dono", "Dono"], ["participantes", "Participam"], ["gatilho", "Começa quando"],
    ["entradas", "Recebe"], ["saidas", "Entrega"], ["cliente", "Cliente do processo"], ["sistemas", "Sistemas"],
    ["frequencia", "Frequência"], ["volume", "Volume"], ["duracao", "Duração"], ["indicadores", "Indicadores"],
    ["regras", "Regras"], ["dores", "Dores relatadas"]
  ];
  var OBRIG = { 1: ["tipo", "descricao", "dono"], 2: ["descricao", "dono", "gatilho", "saidas", "cliente"], 3: ["descricao", "dono", "gatilho", "entradas", "saidas", "cliente", "participantes"] };
  var TEMAS = [
    ["oferta", "O que vende"], ["cliente", "Para quem"], ["proposta_de_valor", "Por que compram"], ["canal", "Como chega ao cliente"],
    ["receita", "Como ganha dinheiro"], ["parceiro", "Parceiros"], ["recurso", "Recursos-chave"], ["custo", "Custos"],
    ["regulacao", "Regras e leis"], ["estrategia", "Estratégia e metas"], ["outro", "Outros"]
  ];

  var idx = {};
  ["fatos", "ofertas", "cadeias_de_valor", "areas", "papeis", "pessoas", "sistemas", "objetos", "processos", "evidencias", "perguntas", "formularios", "contradicoes", "decisoes", "glossario", "ideias"].forEach(function (c) {
    (M[c] || []).forEach(function (o) { if (o && o.id) idx[o.id] = o; });
  });
  var procs = M.processos || [];
  var filhos = {};
  procs.forEach(function (p) { var k = p.pai || "_raiz"; (filhos[k] = filhos[k] || []).push(p); });
  Object.keys(filhos).forEach(function (k) {
    filhos[k].sort(function (a, b) { return cmpCod(COD[a.id], COD[b.id]); });
  });
  var lacPor = {};
  (D.lacunas || []).forEach(function (l) { (lacPor[l.elemento] = lacPor[l.elemento] || []).push(l); });

  var estado = { aba: "cadeia", sel: null, abertos: {}, busca: "", filtro: { confirmado: true, declarado: true, hipotese: true, contestado: true }, fluxo: null, soSemPergunta: false };

  function cmpCod(a, b) {
    var x = String(a || "").split("."), y = String(b || "").split(".");
    for (var i = 0; i < Math.max(x.length, y.length); i++) {
      var d = (parseInt(x[i] || 0, 10) || 0) - (parseInt(y[i] || 0, 10) || 0);
      if (d) return d;
    }
    return 0;
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function vazio(v) { return v == null || (typeof v === "string" && !v.trim()) || (Array.isArray(v) && !v.length) || (typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length); }
  function nome(id) { var o = idx[id]; return o ? (o.nome || o.texto || id) : (id || ""); }
  function selo(st) { st = st || "hipotese"; return '<span class="selo ' + st + '" title="' + esc(STATUS_EXPL[st]) + '">' + STATUS[st] + "</span>"; }
  function ponto(st) { st = st || "hipotese"; return '<span class="ponto ' + st + '" title="' + STATUS[st] + '"></span>'; }
  function nivelNome(n) { return NIVEIS[n] || ("Nível " + n); }
  function refTexto(r) {
    if (!r) return "";
    if (typeof r === "string") { if (r.indexOf("EXT:") === 0) return r.slice(4) + " (externo)"; return idx[r] ? (COD[r] ? COD[r] + " " : "") + nome(r) : r; }
    if (typeof r === "object") {
      var t = r.nome || "";
      var de = r.de ? " ← " + refTexto(r.de) : "";
      var para = r.para ? " → " + refTexto(r.para) : "";
      var meta = r.meta ? " (meta: " + r.meta + ")" : "";
      return t + de + para + meta;
    }
    return String(r);
  }
  function valorCampo(p, k) {
    var v = p[k];
    if (vazio(v)) return null;
    if (k === "dono") return esc(nome(v));
    if (k === "participantes" || k === "sistemas") return v.map(function (x) { return esc(nome(x)); }).join(", ");
    if (Array.isArray(v)) return v.map(function (x) { return esc(refTexto(x)); }).join("<br>");
    return esc(v);
  }
  var SITUACAO = { no_papel: "só no papel", em_implantacao: "em implantação" };
  function situacaoTag(p) { return SITUACAO[p.situacao] ? '<span class="tag papel" title="Desenhado, mas ainda não roda (ou roda parcialmente)">' + SITUACAO[p.situacao] + "</span>" : ""; }
  function porcent(n) { return (Math.round(n * 10) / 10).toLocaleString("pt-BR") + "%"; }

  // ------------------------------------------------------------ cabeçalho
  function cabecalho() {
    var org = M.organizacao || {};
    document.getElementById("org-nome").textContent = org.nome || "Mapa de processos";
    var c = D.cobertura || {};
    document.getElementById("medidores").innerHTML =
      medidor("Informação levantada", c.completude || 0, "", "campos mínimos, fluxos e temas do negócio") +
      medidor("Validado", c.validacao || 0, "ok", (c.confirmados || 0) + " de " + (c.elementos || 0) + " elementos confirmados");
    var porNivel = c.por_nivel || {};
    var chips = Object.keys(porNivel).map(function (n) { return '<span class="chip"><b>' + porNivel[n].total + "</b> " + esc(nivelNome(+n).toLowerCase()) + (porNivel[n].total === 1 ? "" : "s") + "</span>"; });
    chips.push('<span class="chip"><b>' + (c.hipoteses || 0) + "</b> hipóteses</span>");
    chips.push('<span class="chip"><b>' + (c.perguntas_pendentes || 0) + "</b> perguntas pendentes</span>");
    chips.push('<span class="chip"><b>' + (c.contradicoes_abertas || 0) + "</b> contradições abertas</span>");
    document.getElementById("contagens").innerHTML = chips.join("");
    document.getElementById("legenda").innerHTML = ["confirmado", "declarado", "hipotese", "contestado"].map(function (s) { return selo(s); }).join("");
    document.getElementById("rodape-esq").textContent = "Atualizado em " + (org.atualizado_em || D.gerado_em || "") + (org.consultor ? " · " + org.consultor : "");
  }
  function medidor(rot, v, cls, dica) {
    return '<div class="medidor" title="' + esc(dica) + '"><div class="rot"><span>' + esc(rot) + '</span></div><div class="num">' + porcent(v) +
      '</div><div class="barra ' + cls + '"><i style="width:' + Math.max(0, Math.min(100, v)) + '%"></i></div></div>';
  }

  // ------------------------------------------------------------ cadeia de valor
  function vistaCadeia() {
    var raizes = filhos._raiz || [];

  function vistaFluxos() {

  function frasesFluxo(p) {
    var fl = p.fluxo || {}, nos = {}, out = {}, ext = {}, mIn = {}, mOut = {};
    (fl.nos || []).forEach(function (n) { nos[n.id] = n; });
    (fl.ligacoes || []).forEach(function (l) { (out[l.de] = out[l.de] || []).push(l); });
    (fl.externos || []).forEach(function (x) { ext[x.id] = x.nome; });
    (fl.mensagens || []).forEach(function (m) {
      if (ext[m.de]) (mIn[m.para] = mIn[m.para] || []).push(m);
      if (ext[m.para]) (mOut[m.de] = mOut[m.de] || []).push(m);
    });
    // Ordem de leitura: caminho principal primeiro (busca em profundidade), desvios depois, fins no final.
    var ordem = [], visto = {}, fins = [];
    function dfs(k) {
      if (visto[k] || !nos[k]) return;
      visto[k] = 1;
      if (nos[k].tipo === "fim") fins.push(k); else ordem.push(k);
      (out[k] || []).forEach(function (l) { dfs(l.para); });
    }
    (fl.nos || []).filter(function (n) { return n.tipo === "inicio"; }).forEach(function (n) { dfs(n.id); });
    (fl.nos || []).forEach(function (n) { dfs(n.id); });
    ordem = ordem.concat(fins);
    var num = {}, i = 0;
    ordem.forEach(function (k) { if (["tarefa", "subprocesso", "decisao", "espera"].indexOf(nos[k].tipo) >= 0) num[k] = ++i; });
    function ref(k) { var n = nos[k]; if (!n) return k; if (num[k]) return "passo " + num[k] + " (" + esc(n.nome || "") + ")"; if (n.tipo === "fim") return "o fim “" + esc(n.nome || "") + "”"; return esc(n.nome || "próximo passo"); }
    function papel(n) { return n.raia ? "<b>" + esc(nome(n.raia)) + "</b>" : "<b>Alguém (papel a definir)</b>"; }
    function msgs(k) {
      var s = "";
      (mIn[k] || []).forEach(function (m) { s += " Recebe de " + esc(ext[m.de]) + ": " + esc(m.rotulo || "mensagem") + "."; });
      (mOut[k] || []).forEach(function (m) { s += " Envia para " + esc(ext[m.para]) + ": " + esc(m.rotulo || "mensagem") + "."; });
      return s;
    }
    function seguinte(k, pos) {
      var o = out[k] || [];
      if (o.length !== 1) return "";
      var alvo = o[0].para, prox = ordem[pos + 1];
      if (alvo === prox) return "";
      return " Depois segue para " + ref(alvo) + ".";
    }
    var frases = [];
    ordem.forEach(function (k, pos) {
      var n = nos[k], t = n.tipo, txt = "", cls = "";
      if (t === "inicio") { cls = "ini"; txt = "O processo começa quando: <b>" + esc(n.nome || "?") + "</b>." + msgs(k); }
      else if (t === "fim") { cls = "fim"; txt = "Termina em: <b>" + esc(n.nome || "fim") + "</b>." + msgs(k); }
      else if (t === "tarefa") { txt = num[k] + ". " + papel(n) + ": " + esc(n.nome || "") + (n.sistema ? " (usa " + esc(nome(n.sistema)) + ")" : "") + "." + msgs(k) + seguinte(k, pos); }
      else if (t === "subprocesso") { txt = num[k] + ". " + papel(n) + ": " + esc(n.nome || "") + (n.processo ? " (detalhado em " + esc(COD[n.processo] || "") + ")" : "") + "." + msgs(k) + seguinte(k, pos); }
      else if (t === "espera") { txt = num[k] + ". Aguarda: " + esc(n.nome || "") + "." + msgs(k) + seguinte(k, pos); }
      else if (t === "decisao" || t === "inclusivo") {
        txt = num[k] + ". " + papel(n) + " confere: " + esc(n.nome || "?") + " " + (out[k] || []).map(function (l) { return "Se “" + esc(l.rotulo || "?") + "”, segue para " + ref(l.para) + "."; }).join(" ");
      } else if (t === "paralelo") {
        var o = out[k] || [];
        if (o.length > 1) txt = "A partir daqui acontecem ao mesmo tempo: " + o.map(function (l) { return ref(l.para); }).join("; ") + ".";
        else txt = "Os caminhos em paralelo se juntam e seguem para " + (o[0] ? ref(o[0].para) : "o próximo passo") + ".";
      }
      if (txt) frases.push({ html: txt, cls: cls });
    });
    return frases;
  }

  function montarBpmn() {

    } else h += '<div class="cartao vazio-msg">Os papéis e processos ainda não foram levantados.</div>';
    h += "</section>";
    h += '<section class="secao"><h2 style="margin-bottom:10px">Áreas, papéis e pessoas</h2><div class="canvas">';
    var semArea = papeis.filter(function (pa) { return !pa.area; });
    areas.concat(semArea.length ? [{ id: "_sem", nome: "Sem área definida" }] : []).forEach(function (ar) {
      var pas = papeis.filter(function (pa) { return (pa.area || "_sem") === ar.id; });
      h += '<div class="bloco"><div class="titulo-secao" style="margin:0"><h3>' + esc(ar.nome) + "</h3>" + (ar.status ? ponto(ar.status) : "") + "</div>" + (pas.length ? pas.map(function (pa) {
        var pes = (M.pessoas || []).filter(function (pe) { return (pe.papeis || []).indexOf(pa.id) >= 0; });
        return '<div class="fato"><div><b>' + esc(pa.nome) + "</b> " + ponto(pa.status) + '</div><div class="muted">' + (pes.length ? pes.map(function (pe) { return esc(pe.nome); }).join(", ") : "ninguém identificado") + "</div></div>";
      }).join("") : '<div class="vazio-msg">Sem papéis registrados.</div>') + "</div>";
    });
    h += "</div></section>";
    var sis = M.sistemas || [];
    if (sis.length) {
      h += '<section class="secao"><h2 style="margin-bottom:10px">Sistemas</h2><div class="cartao tabela-wrap"><table><thead><tr><th>Sistema</th><th>Tipo</th><th>Usado em</th><th>Status</th></tr></thead><tbody>' +
        sis.map(function (s) {
          var usos = procs.filter(function (p) { return (p.sistemas || []).indexOf(s.id) >= 0 || ((p.fluxo && p.fluxo.nos) || []).some(function (n) { return n.sistema === s.id; }); });
          return "<tr><td><b>" + esc(s.nome) + "</b></td><td>" + esc(s.tipo || "") + "</td><td>" + (usos.map(function (p) { return '<button class="lnk" data-sel="' + esc(p.id) + '">' + esc(COD[p.id] + " " + p.nome) + "</button>"; }).join("<br>") || '<span class="muted">nenhum processo ligado</span>') + "</td><td>" + selo(s.status) + "</td></tr>";
        }).join("") + "</tbody></table></div></section>";
    }
    var pes = M.pessoas || [];
    if (pes.length) {
      h += '<section class="secao"><h2 style="margin-bottom:10px">Pessoas ouvidas</h2><div class="cartao tabela-wrap"><table><thead><tr><th>Nome</th><th>Cargo</th><th>Indicado por</th><th>Evidências</th></tr></thead><tbody>' +
        pes.map(function (pe) {
          var n = (M.evidencias || []).filter(function (e) { return e.pessoa === pe.id; }).length;
          return "<tr><td><b>" + esc(pe.nome) + "</b></td><td>" + esc(pe.cargo || "") + "</td><td>" + esc(pe.indicado_por ? nome(pe.indicado_por) : "") + '</td><td class="mono">' + n + "</td></tr>";
        }).join("") + "</tbody></table></div></section>";
    }
    return h;
  }

  // ------------------------------------------------------------ painel de detalhe
  function evidencias(ids) {
    ids = ids || [];
    if (!ids.length) return "";
    return ids.map(function (e) {
      var ev = idx[e];
      if (!ev) return '<div class="ev"><span class="mono">' + esc(e) + "</span></div>";
      var quem = ev.pessoa ? nome(ev.pessoa) : "";
      return '<div class="ev"><q>' + esc(ev.trecho || "(sem trecho)") + '</q><span class="fonte"><span class="mono">' + esc(ev.id) + "</span> · " + esc(ev.tipo) + " · " + esc(ev.fonte || "") + (quem ? " · " + esc(quem) : "") + (ev.data ? " · " + esc(ev.data) : "") + "</span></div>";
    }).join("");
  }
  function painel() {
    var el = document.getElementById("painel"), grade = document.getElementById("grade");
    var p = estado.sel && idx[estado.sel];
    if (!p) { el.hidden = true; grade.classList.add("sem-painel"); return; }
    el.hidden = false; grade.classList.remove("sem-painel");
    var nv = NIV[p.id] || 1;
    var obrig = OBRIG[Math.min(nv, 3)];
    var hip = p.hipoteses || [];
    var h = '<button class="btn fechar" id="fechar-painel" aria-label="Fechar detalhe">Fechar</button>';
    h += '<div class="eyebrow">' + esc(nivelNome(nv)) + (TIPO[p.id] ? " · " + esc(TIPOS[TIPO[p.id]]) : "") + '</div><h2 style="margin:4px 0 6px"><span class="mono muted">' + esc(COD[p.id]) + "</span> " + esc(p.nome) + "</h2>" + selo(p.status) + " " + situacaoTag(p);
    if (p.pai) h += '<p style="margin:8px 0 0" class="muted">Faz parte de <button class="lnk" data-sel="' + esc(p.pai) + '">' + esc(COD[p.pai] + " " + nome(p.pai)) + "</button></p>";
    h += '<div style="margin-top:10px">';
    CAMPOS.forEach(function (c) {
      var k = c[0], v = valorCampo(p, k), ob = obrig.indexOf(k) >= 0;
      if (v == null && !ob) return;
      var cls = v == null ? "falta" : hip.indexOf(k) >= 0 ? "hip" : "";
      h += '<div class="campo ' + cls + '"><div class="k">' + esc(c[1]) + (cls === "hip" ? ' <span class="selo hipotese">hipótese</span>' : "") + '</div><div class="v">' + (v == null ? "falta levantar" : v) + "</div></div>";
    });
    h += "</div>";
    var kids = filhos[p.id] || [];
    if (kids.length) h += '<div class="campo"><div class="k">Se divide em</div><div class="v">' + kids.map(function (k) { return '<div>' + ponto(k.status) + ' <button class="lnk" data-sel="' + esc(k.id) + '">' + esc(COD[k.id] + " " + k.nome) + "</button></div>"; }).join("") + "</div></div>";
    if (p.fluxo) h += '<div class="campo"><div class="k">Passo a passo</div><div class="v">' + selo(p.fluxo.status) + ' <button class="lnk" data-ver-fluxo="' + esc(p.id) + '">ver fluxo</button></div></div>';
    var lac = lacPor[p.id] || [];
    if (lac.length) h += '<div class="campo"><div class="k">Lacunas</div><div class="v">' + lac.map(function (l) { return "<div>• " + esc(l.mensagem.replace((COD[p.id] || "") + " " + p.nome + ": ", "")) + (l.pergunta ? ' <span class="mono muted">' + esc(l.pergunta) + "</span>" : "") + "</div>"; }).join("") + "</div></div>";
    var perg = (M.perguntas || []).filter(function (q) { return (q.alvo || []).some(function (a) { return a === p.id || a.indexOf(p.id + ".") === 0; }) && (q.status === "aberta" || q.status === "em_formulario"); });
    if (perg.length) h += '<div class="campo"><div class="k">Perguntas pendentes</div><div class="v">' + perg.map(function (q) { return '<div><span class="mono muted">' + esc(q.id) + "</span> " + esc(q.texto) + "</div>"; }).join("") + "</div></div>";
    var cts = (M.contradicoes || []).filter(function (c) { return c.elemento === p.id && (c.status || "aberta") === "aberta"; });
    if (cts.length) h += '<div class="campo"><div class="k">Contradição</div><div class="v">' + cts.map(function (c) { return esc(c.descricao); }).join("<br>") + "</div></div>";
    var ide = (M.ideias || []).filter(function (i) { return i.processo === p.id; });
    if (ide.length) h += '<div class="campo"><div class="k">Ideias de melhoria anotadas</div><div class="v">' + ide.map(function (i) { return "• " + esc(i.texto); }).join("<br>") + "</div></div>";
    h += '<div class="campo"><div class="k">De onde veio</div><div class="v">' + (evidencias(p.evidencias) || '<span class="vazio-msg">Nenhuma evidência: é uma hipótese a confirmar.</span>') + "</div></div>";
    el.innerHTML = h;
  }

  // ------------------------------------------------------------ arquivos para baixar
  var CRC = (function () { var t = [], c; for (var n = 0; n < 256; n++) { c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { var c = 0xFFFFFFFF; for (var i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zip(arquivos) {
    var enc = new TextEncoder(), partes = [], central = [], off = 0;
    arquivos.forEach(function (a) {
      var nomeB = enc.encode(a.nome), dados = enc.encode(a.texto), crc = crc32(dados);
      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, dados.length, true);
      h.setUint32(22, dados.length, true); h.setUint16(26, nomeB.length, true); h.setUint16(28, 0, true);
      partes.push(new Uint8Array(h.buffer), nomeB, dados);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, dados.length, true); c.setUint32(24, dados.length, true);
      c.setUint16(28, nomeB.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), nomeB);
      off += 30 + nomeB.length + dados.length;
    });
    var tam = central.reduce(function (s, x) { return s + x.length; }, 0);
    var fim = new DataView(new ArrayBuffer(22));
    fim.setUint32(0, 0x06054b50, true); fim.setUint16(8, arquivos.length, true); fim.setUint16(10, arquivos.length, true);
    fim.setUint32(12, tam, true); fim.setUint32(16, off, true);
    return new Blob(partes.concat(central, [new Uint8Array(fim.buffer)]), { type: "application/zip" });
  }
  function slug(s) { return String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48) || "item"; }
  function aviso(t) { var m = document.getElementById("msg-acao"); if (m) m.textContent = t; }
  function salvar(blob, nomeArq) {
    var w = window.claude;
    var p = w && typeof w.use === "function" ? w.use("downloads") : Promise.resolve(null);
    return Promise.resolve(p).then(function (dl) {
      if (dl) return dl.save({ filename: nomeArq, data: blob }).then(function () { aviso("Arquivo pronto: " + nomeArq); }, function (e) { aviso(e && e.code === "declined" ? "Download cancelado." : "Não foi possível baixar aqui: " + ((e && e.message) || "")); });
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = nomeArq; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      aviso("Arquivo pronto: " + nomeArq);
    });
  }
  function pacote() {
    var arqs = [];
    Object.keys(D.bpmn || {}).forEach(function (pid) { arqs.push({ nome: "bpmn/" + slug(COD[pid]) + "-" + slug(nome(pid)) + ".bpmn", texto: D.bpmn[pid] }); });
    if (D.drawio) arqs.push({ nome: "mapa.drawio", texto: D.drawio });
    Object.keys(D.mermaid || {}).forEach(function (k) { arqs.push({ nome: "mermaid/" + k, texto: D.mermaid[k] }); });
    arqs.push({ nome: "mapa.json", texto: JSON.stringify(M, null, 2) });
    arqs.push({ nome: "LEIA-ME.txt", texto: "Arquivos editáveis do mapa de processos.\n\n.bpmn: abra em https://demo.bpmn.io, Camunda Modeler ou Bizagi Modeler.\nmapa.drawio: abra em https://app.diagrams.net (uma página por visão).\nmermaid/*.mmd: cole em https://mermaid.live, Notion, GitHub ou Obsidian.\nmapa.json: a fonte de verdade do mapeamento.\n" });
    return salvar(zip(arqs), "mapa-de-processos-" + slug((M.organizacao || {}).nome) + ".zip");
  }

  // ------------------------------------------------------------ navegação
  var ABAS = { cadeia: vistaCadeia, hierarquia: vistaHierarquia, fluxos: vistaFluxos, lacunas: vistaLacunas, negocio: vistaNegocio, pessoas: vistaPessoas };
  function render() {
    document.querySelectorAll("#abas a").forEach(function (a) { if (a.dataset.aba === estado.aba) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    document.getElementById("principal").innerHTML = ABAS[estado.aba]();
    painel();
    if (estado.aba === "fluxos") montarBpmn();
  }
  function lerHash() { var h = (location.hash || "").replace("#", ""); estado.aba = ABAS[h] ? h : "cadeia"; render(); }
  window.addEventListener("hashchange", lerHash);

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-alterna],[data-sel],[data-fluxo],[data-acao],[data-ver-fluxo],#abrir-tudo,#fechar-tudo,#fechar-painel");
    if (!t) return;
    if (t.dataset.alterna) { ev.stopPropagation(); estado.abertos[t.dataset.alterna] = !estado.abertos[t.dataset.alterna]; render(); return; }
    if (t.id === "abrir-tudo") { procs.forEach(function (p) { estado.abertos[p.id] = true; }); render(); return; }
    if (t.id === "fechar-tudo") { estado.abertos = {}; render(); return; }
    if (t.id === "fechar-painel") { estado.sel = null; render(); return; }
    if (t.dataset.fluxo) { estado.fluxo = t.dataset.fluxo; render(); return; }
    if (t.dataset.verFluxo) { estado.fluxo = t.dataset.verFluxo; if (location.hash !== "#fluxos") location.hash = "fluxos"; else render(); return; }
    if (t.dataset.acao === "copiar-bpmn") {
      var xml = (D.bpmn || {})[estado.fluxo] || "";
      try { navigator.clipboard.writeText(xml).then(function () { aviso("BPMN copiado. No bpmn.io, use 'Open' e cole ou arraste o arquivo baixado."); }, function () { aviso("Não consegui copiar aqui; use o botão de baixar."); }); }
      catch (e) { aviso("Não consegui copiar aqui; use o botão de baixar."); }
      return;
    }
    if (t.dataset.acao === "baixar-pacote") { pacote(); return; }
    if (t.dataset.sel) {
      estado.sel = t.dataset.sel;
      var p = idx[estado.sel], a = p;
      while (a && a.pai) { estado.abertos[a.pai] = true; a = idx[a.pai]; }
      render();
    }
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "busca") {
      estado.busca = ev.target.value;
      var pos = ev.target.selectionStart;
      render();
      var b = document.getElementById("busca"); if (b) { b.focus(); try { b.setSelectionRange(pos, pos); } catch (e) {} }
    }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.dataset && ev.target.dataset.filtro) { estado.filtro[ev.target.dataset.filtro] = ev.target.checked; render(); }
    if (ev.target.id === "so-sem") { estado.soSemPergunta = ev.target.checked; render(); }
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && estado.sel) { estado.sel = null; render(); } });

  cabecalho();
  lerHash();
})();
</script>

</body>
