", "local": "User Story 4"}, {"id": "EV-0003", "tipo": "documento", "fonte": "Especificação 001: Portal Wise Partners", "pessoa": null, "data": "2026-11-05", "trecho": "ele fala com o consultor ou o gerente de conta, que registra o pedido", "local": "User Story 9"}, {"id": "EV-0004", "tipo": "documento", "fonte": "Especificação 001: Portal Wise Partners", "pessoa": null, "data": "2026-11-05", "trecho": "avisa o financeiro por e-mail quando há comissão a pagar", "local": "User Story 6"}, {"id": "EV-0005", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "O consultor que atende o cliente, com tarefa gerada pelo portal (recomendado). A tarefa no portal deve ser feita par ao gerente de parcerias. Não quero que o consultor ou a equipe comercial, ou CS tenham a necessidade de acessar o portal para ver isso (eles não o farão e deixarão as tarefas lá sem fazer). Quem tem responsabilidade para com o portal e a governança das tarefas de lá, mesmo que devam ser executadas por terceiros, deve ser o gerente de parcerias.", "local": "FO-01/Q-0013"}, {"id": "EV-0006", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "O Igor", "local": "FO-01/Q-0021"}, {"id": "EV-0007", "tipo": "validacao", "fonte": "FO-02: Rodada 2, to-be refeito a partir dos livros", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Aprovo como está. Gostei da parte de eu propor uma minuta, rascunho ou proposta pedindo críticas e ela ir sendo trabalhada até ser aprovada pelas duas partes. É uma forma mais orgânica e funcional do que um contrato padrão único e travado. A única coisa é que isso toma tempo e, se for através de e-mail pode levar semanas. Não vou me opor de fazer assim, pois realmente é o melhor encaixe, até porque, imagino que serão excessões que pedirão ajustes constantes. A única coisa que quero pontuar é a aprovação final do diretor. Nem eu nem ele queremos que ele faça uma efetiva aprovação criteriosa. Ele não tem tempo para isso e me dá autonomia para negociar com o parceiro e encontrar o melhor dos dois lados. A única coisa que ele faz é assinar. Claro que ele pode revisar etc, mas tem que ser um processo simples da parte dele.", "local": "FO-02/Q-0011"}, {"id": "EV-0008", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "O consultor ou comercial da empresa que vai atender (recomendado: quem fecha é dono da conta)", "local": "FO-01/Q-0014"}, {"id": "EV-0009", "tipo": "validacao", "fonte": "FO-02: Rodada 2, to-be refeito a partir dos livros", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Aprovo com ajustes (comente). Vamos fazer de maneira simples, cara. Simplesmente o lead que vem, vai para o closer de cada respectiva empresa do grupo. O próprio gerente de parcerias conversa com o closer diretamente (até pessoalmente) para que ele atenda no tempo que melhor funcionar. O closer nunca vai atrasar. Vamos manter simples. O SLA pode funcionar, mas é uma regra que só pesa o sistema e não serve efetivamente para nada. Siga o que eu falei e será sucesso.", "local": "FO-02/Q-0014"}, {"id": "EV-0010", "tipo": "documento", "fonte": "Especificação 002: Portal Wise Partners 2.0 (23/10/2026)", "pessoa": null, "data": "2026-11-05", "trecho": "Responsável nomeado com 2 horas ou mais por semana no primeiro mês", "local": "Apêndice A"}, {"id": "EV-0011", "tipo": "documento", "fonte": "Especificação 002: Portal Wise Partners 2.0 (23/10/2026)", "pessoa": null, "data": "2026-11-05", "trecho": "A versão 1 do portal está construída e testada com dados fictícios.", "local": "Contexto"}, {"id": "EV-0012", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Não agora. Não precisamos fazer com que o portal seja uma forma de comunicação entre o parceiro e a Wise Makers / grupo tríade, porque já temos grupos de whatsapp para cada respectivo parceiro dentro de uma comunidade da wise partners. Vamos manter a comunicação por lá. Ao mesmo tempo, precisamos deixar alguma parte no perfil do parceiro para que tenha a possibilidade de eu resgatar a apresentação de vendas dele. Ao mesmo tempo precisamos deixar disponível uma seção do portal wise partners para que o parceiro possa aprender a vender a wise makers e as outras empresas do grupo, tendo acesso a material de vendas de cada um e também entendendo quanto pode ganhar de comissão para cada indicação.", "local": "FO-01/Q-0012"}, {"id": "EV-0013", "tipo": "documento", "fonte": "Especificação 001: Portal Wise Partners", "pessoa": null, "data": "2026-11-05", "trecho": "O contrato é enviado para assinatura no Autentique fora do portal, e o PDF assinado é anexado.", "local": "User Story 4"}, {"id": "EV-0014", "tipo": "documento", "fonte": "Especificação 002: Portal Wise Partners 2.0 (23/10/2026)", "pessoa": null, "data": "2026-11-05", "trecho": "As trilhas ficam só no portal, nunca no Wise Hub, porque o Hub é aberto à carteira do parceiro.", "local": "User Story 10"}, {"id": "EV-0015", "tipo": "validacao", "fonte": "FO-06: Rodada 1, o que o patrocinador já sabe", "pessoa": "PE-01", "data": "2026-10-31", "trecho": "As duas: entra pela carteira e depois acompanha o resultado. Acabei de identificar que precisaremos atualizar o playbook com as novas direções que viemos a fazer no web app. O playbook está desatualizado e não segue o que o webapp possibilita", "local": "FO-01/Q-0004 (mapa as-is, EV-0109)"}, {"id": "EV-0016", "tipo": "validacao", "fonte": "FO-06: Rodada 1, o que o patrocinador já sabe", "pessoa": "PE-01", "data": "2026-10-31", "trecho": "Vale a especificação: na ativação. Isso foi atualizado com o web app, mas o playbook acabou não acompanhando", "local": "FO-01/Q-0005 (mapa as-is, EV-0110)"}, {"id": "EV-0017", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Aprovo com ajustes (comente). Vejo que a atualização que fizemos depois da leitura dos livros foi só para incluir citações dos livros em alguns processos. Não vejo que conseguimos extrair conceitos importantes e novas perspectivas de modelo de negócio para trazer como melhoria essencial no mapeamento dos processos e modelo de negócio do programa Wise Partners. Preciso que você reveja os livros e traga novas soluções, mesmo que venham a fazer grandes alterações. Precisamos rever tudo do zero, mesmo que venhamos a fazer uma alteração para mudar 100% dos processos como estão agora. Tente fazer o conhecimentos dos livros para a realidade do Wise Partners em uma perspectiva estruturada de mapeamento de processos. Além disso, preciso de mais detalhe nos processos e mais processos", "local": "FO-01/Q-0001"}, {"id": "EV-0018", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Os três pilares desde o primeiro parceiro", "local": "FO-01/Q-0002"}, {"id": "EV-0019", "tipo": "validacao", "fonte": "FO-04: Rodada 4, onde os livros discordam das decisões", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Vamos seguir o que está no playbook V3: A entrega varia de acordo com a capacidade do parceiro de poder entregar de volta. Se o parceiro é muito pequeno, não faz sentido abrirmos o wise hub, nem chamarmos para os nossos treinamentos, muito menos focarmos em uma consultoria de base ativa por 12 semanas para um evento da Wise Makers para o Parceiro. Temos que fazer escalonado assim como já descrevi no playbook v3. Pode ser que possamos melhorar também com o tempo, à medida que o parceiro tem mais relacionamento, podemos abrir para mais coisas, mas isso tem que ser orgânico e fica difícil registrar na fase que estamos agora.", "local": "FO-04/Q-0017"}, {"id": "EV-0020", "tipo": "documento", "fonte": "Playbook Wise Partners v3.1 (24/09/2026)", "pessoa": null, "data": "2026-10-29", "trecho": "O parceiro sobe de pacote quando passa a entregar a contrapartida do pacote de cima. Registra-se por confirmação escrita entre os responsáveis, sem aditivo.", "local": "Seção 4.4 (mapa as-is, EV-0025)"}, {"id": "EV-0021", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "10 assinados e também uma meta de ativados (recomendado). Gosto da meta, mas não podemos nos ater às metas agora, mas sim para o mapeamento dos processos e do modelo de negócio. A meta, por enquanto, será apenas a capacidade de estupilarmos as metas e a relação da meta no modelo de negócio. Veremos efetivamente qual será a meta em um segundo momento", "local": "FO-01/Q-0003"}, {"id": "EV-0022", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Outra regra (comente). As horas semanais não vão interferir agora. Este momento é para refletirmos sobre mapeamento de processos e modelo de negócio. Não quero que nos atamos em detalhes agora. Deixe apenas a capacidade de podermos fazer a gestão de tempo e recursos de tempo gasto com o programa, nada mais.", "local": "FO-01/Q-0004"}, {"id": "EV-0023", "tipo": "validacao", "fonte": "FO-02: Rodada 2, to-be refeito a partir dos livros", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Contrapartida não financeira para entrar num pedido da Prateleira (ação conjunta, condição comercial para a indústria). Não vamos complicar o que não precisa. Parceria para a Wise Makers é um canal de aquisição de receita mais barato do que os canais ativos agora. O nosso benefício são leads e novos clientes. Comissão da parte do parceiro pode vir só para baratear ainda mais o CAC, mas não pode ser um fator de tornar o programa mais complexo e diminuir a taxa de aderência, o que diminuiria a quantidade de parceiros, por consequência a quantidade de empresas indicadas e, por fim, o CAC.\nVamos manter simples nessa parte que é sucesso.", "local": "FO-02/Q-0015"}, {"id": "EV-0024", "tipo": "validacao", "fonte": "FO-02: Rodada 2, to-be refeito a partir dos livros", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Manter a regra única, sem exceção por parceiro", "local": "FO-02/Q-0005"}, {"id": "EV-0025", "tipo": "validacao", "fonte": "FO-03: Rodada 3, princípios e to-be refatorado", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Não aprovo (comente). Não sei se vou ter tantas oportunidades recorrentes assim para falar com os closers toda a semana. Vou conversar com eles esporadicamente quando houverem propostas / indicações novas. Por outro lado, preciso conversar toda a semana com o Igor para falar sobre os parceiros, como está o andamento, etc. Preciso de um dashboard relativamente simples e fácil de se basear com informações estratégicas e ao mesmo tempo, que eu tenha a possibilidade de falar sobre cada caso.", "local": "FO-03/Q-0008"}, {"id": "EV-0026", "tipo": "validacao", "fonte": "FO-04: Rodada 4, onde os livros discordam das decisões", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Combino com cada closer um aviso curto por WhatsApp a cada etapa, sem portal. ", "local": "FO-04/Q-0016"}, {"id": "EV-0027", "tipo": "validacao", "fonte": "FO-03: Rodada 3, princípios e to-be refatorado", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Ninguém precisa informar o cac de outros canais no portal do wise partners. Só temos que ver qual o CAC do wise partners e ponto final", "local": "FO-03/Q-0005"}, {"id": "EV-0028", "tipo": "validacao", "fonte": "FO-04: Rodada 4, onde os livros discordam das decisões", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Seguir os livros: valor devolvido ao parceiro e CAC lado a lado no painel, com o mesmo peso, em todas as fases. ", "local": "FO-04/Q-0014"}, {"id": "EV-0029", "tipo": "validacao", "fonte": "FO-04: Rodada 4, onde os livros discordam das decisões", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Meio-termo: dinheiro igual para todos, e o que varia por tipo de parceiro é o não monetário (acesso, palco, apoio), revendo a regra depois de dois trimestres com dados de permanência. ", "local": "FO-04/Q-0015"}, {"id": "EV-0030", "tipo": "validacao", "fonte": "FO-04: Rodada 4, onde os livros discordam das decisões", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Manter: eu sou dono de tudo, sem teto. ", "local": "FO-04/Q-0018"}, {"id": "EV-0031", "tipo": "validacao", "fonte": "FO-04: Rodada 4, onde os livros discordam das decisões", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "CAC do Wise Partners no trimestre e a tendência; Parceiros ativos, novos e em risco; Oportunidades abertas por etapa e as paradas há mais de 15 dias; Clientes fechados e receita vinda de parceiros no trimestre; Parceiros que mudaram de tipo no cubo nesta semana; Distância do próximo portão de fase; Desfechos devolvidos aos parceiros (quantas oportunidades tiveram retorno); Horas dedicadas ao programa na semana. ", "local": "FO-04/Q-0020"}, {"id": "EV-0032", "tipo": "validacao", "fonte": "FO-04: Rodada 4, onde os livros discordam das decisões", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Manter a especificação: nível de entrada pela faixa de clientes no ICP. ", "local": "FO-04/Q-0019"}, {"id": "EV-0033", "tipo": "validacao", "fonte": "FO-04: Rodada 4, onde os livros discordam das decisões", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Meio-termo: o portal mede o equilíbrio só para a leitura interna do cubo, e o parceiro nunca vê placar; na comunidade aparece o dar, não a conta. ", "local": "FO-04/Q-0023"}, {"id": "EV-0034", "tipo": "validacao", "fonte": "FO-03: Rodada 3, princípios e to-be refatorado", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Eu decido e o Igor assina o aviso formal. ", "local": "FO-03/Q-0009"}, {"id": "EV-0035", "tipo": "validacao", "fonte": "FO-03: Rodada 3, princípios e to-be refatorado", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Aprovo com ajustes (comente). As minhas aprovações não podem ser consideradas lei e não devem ter um peso maior do que a dos livros. Preciso que na próxima resposta você atualize reconsiderando isso.", "local": "FO-03/Q-0001"}, {"id": "EV-0036", "tipo": "entrevista", "fonte": "Conversa com Guilherme Faccin (escopo do mapeamento)", "pessoa": "PE-01", "data": "2026-10-29", "trecho": "Hierarquia + fluxos dos kanbans: Todos os macroprocessos e processos com dono, gatilho e entregas; passo a passo validado só dos processos que viram funil (recrutamento, onboarding, Base Ativa, indicações e os que surgirem).", "local": "Fase 0, profundidade (mapa as-is, EV-0004)"}, {"id": "EV-0037", "tipo": "documento", "fonte": "The Keystone Advantage (Marco Iansiti, Roy Levien)", "pessoa": null, "data": "2026-11-05", "trecho": "Broadly speaking, there are two foundational components of an effective keystone strategy. The first is to create value within the ecosystem.", "local": "p. 100 (princípio: Crie valor antes de capturar valor e compartilhe o que criar.)"}, {"id": "EV-0038", "tipo": "documento", "fonte": "Give and Take (Adam Grant)", "pessoa": null, "data": "2026-11-05", "trecho": "Being a giver is not good for a 100-yard dash, but it’s valuable in a marathon", "local": "p. 20 (princípio: Tratar o dar como maratona e evitar relações de soma zero.)"}, {"id": "EV-0039", "tipo": "documento", "fonte": "Ecossistema de Parceiros: Método Octo (Juliana Tubino e Nara Vaz Guimarães)", "pessoa": null, "data": "2026-11-05", "trecho": "A relação entre critério e benefício é muito semelhante à relação de CAC versus LTV.", "local": "p. 137 (Programa de Parceiros: programa mínimo viável, canvas de proposta de valor e nív)"}, {"id": "EV-0040", "tipo": "documento", "fonte": "Give and Take (Adam Grant)", "pessoa": null, "data": "2026-11-05", "trecho": "Being otherish means being willing to give more than you receive, but still keeping your own interests in sight", "local": "p. 117 (princípio: Dar mais do que receber, mantendo o próprio interesse à vista (postura)"}, {"id": "EV-0041", "tipo": "documento", "fonte": "Never Eat Alone (Keith Ferrazzi, Tahl Raz)", "pessoa": null, "data": "2026-11-05", "trecho": "Bottom line: It's better to give before you receive. And never keep score.", "local": "p. 33 (princípio: Dar primeiro e não manter placar de favores.)"}, {"id": "EV-0042", "tipo": "documento", "fonte": "The Referral Engine (John Jantsch)", "pessoa": null, "data": "2026-11-05", "trecho": "in the business of referrals, those who give usually get.", "local": "p. 26 (princípio: Dê indicação para receber: o parceiro que recebe boas oportunidades in)"}, {"id": "EV-0043", "tipo": "documento", "fonte": "Nearbound and the Rise of the Who Economy (Jared Fuller, Jill Rowley)", "pessoa": null, "data": "2026-11-05", "trecho": "Pair every ask for a nearbound “I” of intel, influence, or intro with a give of the same.", "local": "p. 179 (Who Economy)"}, {"id": "EV-0044", "tipo": "validacao", "fonte": "FO-02: Rodada 2, to-be refeito a partir dos livros", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Aprovo como está", "local": "FO-02/Q-0002"}, {"id": "EV-0045", "tipo": "documento", "fonte": "Platform Revolution: How Networked Markets Are Transforming the Economy and How to Make Them Work for You (Geoffrey G. Parker, Marshall W. Van Alstyne e Sangeet Paul Choudary)", "pessoa": null, "data": "2026-11-05", "trecho": "successful platforms begin with a single core interaction that consistently generates high value for users.", "local": "p. 48 (Core Interaction: Participants, Value Unit and Filter, com os quatro efeitos de )"}, {"id": "EV-0046", "tipo": "documento", "fonte": "Platform Revolution: How Networked Markets Are Transforming the Economy and How to Make Them Work for You (Geoffrey G. Parker, Marshall W. Van Alstyne e Sangeet Paul Choudary)", "pessoa": null, "data": "2026-11-05", "trecho": "Participants + Value Unit + Filter → Core Interaction", "local": "p. 47 (Core Interaction: Participants, Value Unit and Filter, com os quatro efeitos de )"}, {"id": "EV-0047", "tipo": "validacao", "fonte": "FO-02: Rodada 2, to-be refeito a partir dos livros", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Aprovo como está", "local": "FO-02/Q-0003"}, {"id": "EV-0048", "tipo": "documento", "fonte": "The Keystone Advantage (Marco Iansiti, Roy Levien)", "pessoa": null, "data": "2026-11-05", "trecho": "Good keystones ought to avoid taking over the activities of their ecosystems, leaving room for a wide variety of other participants to grow and thrive.", "local": "p. 116 (princípio: Ocupe pouco do ecossistema e deixe o resto aos parceiros.)"}, {"id": "EV-0049", "tipo": "documento", "fonte": "Winning the Right Game: How to Disrupt, Defend, and Deliver in a Changing World (Ron Adner)", "pessoa": null, "data": "2026-11-05", "trecho": "In ecosystems, leadership is not an outcome but a role.", "local": "p. 142 (Ego-System Trap)"}, {"id": "EV-0050", "tipo": "documento", "fonte": "The Keystone Advantage (Marco Iansiti, Roy Levien)", "pessoa": null, "data": "2026-11-05", "trecho": "Platform interfaces are the visible embodiment of the solutions achieved in the implementation.", "local": "p. 156 (princípio: Mantenha a interface com o parceiro simples e estável, e mude a operaç)"}, {"id": "EV-0051", "tipo": "documento", "fonte": "The Business of Belonging (David Spinks)", "pessoa": null, "data": "2026-11-05", "trecho": "Keep your list of rules short and simple so that they're easy to remember. I recommend having no more than 10 rules and offer more detailed guidelines in your code of conduct.", "local": "p. 171 (princípio: Poucas regras, aplicadas sempre da mesma forma e com transparência.)"}, {"id": "EV-0052", "tipo": "documento", "fonte": "Ecossistema de Parceiros: Método Octo (Juliana Tubino e Nara Vaz Guimarães)", "pessoa": null, "data": "2026-11-05", "trecho": "Você sabe que as regras do seu programa estão claras quando um parceiro consegue explicá-las para outros parceiros.", "local": "p. 136 (Programa de Parceiros: programa mínimo viável, canvas de proposta de valor e nív)"}, {"id": "EV-0053", "tipo": "validacao", "fonte": "FO-02: Rodada 2, to-be refeito a partir dos livros", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Aprovo com ajustes (comente). Atualizei com mais livros. Pode ser que acabe não mudando muito, mas preciso que você refatore todos os conceitos para que considere tudo de uma vez e traga todos os princípios de maneira ordenada no mapeamento de processos do wise makers, levando em consideração o web app no centro da gestão.", "local": "FO-02/Q-0001"}, {"id": "EV-0054", "tipo": "documento", "fonte": "The Keystone Advantage (Marco Iansiti, Roy Levien)", "pessoa": null, "data": "2026-11-05", "trecho": "The key to creating leverage is to make sure that the value of these assets divided by the cost of creating, maintaining, and sharing them increases rapidly with the number of ecosystem members that share them.", "local": "p. 100 (princípio: Faça o custo de compartilhar valor cair a cada novo parceiro.)"}, {"id": "EV-0055", "tipo": "documento", "fonte": "Customer Success (Dan Steinman, Lincoln Murphy e Nick Mehta)", "pessoa": null, "data": "2026-11-05", "trecho": "Não faz sentido, porém, tentar automatizar alguma coisa que não tenha passado por um mínimo de racionalização prévia. Você acabará cometendo os mesmos erros, com mais rapidez. É como pavimentar o caminho das vacas!", "local": "p. 129 (princípio: Racionalize à mão antes de automatizar.)"}, {"id": "EV-0056", "tipo": "documento", "fonte": "Building Successful Partner Channels in the software industry (Hans Peter Bech)", "pessoa": null, "data": "2026-11-05", "trecho": "The PRM supports the channel partner relationship management processes, thus we must define these first and then implement the system afterwards.", "local": "p. 94 (Pirâmide do canal)"}, {"id": "EV-0057", "tipo": "validacao", "fonte": "FO-02: Rodada 2, to-be refeito a partir dos livros", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Aprovo como está", "local": "FO-02/Q-0007"}, {"id": "EV-0058", "tipo": "documento", "fonte": "Customer Success (Dan Steinman, Lincoln Murphy e Nick Mehta)", "pessoa": null, "data": "2026-11-05", "trecho": "Aqui há sem dúvida uma hierarquia de valor do cliente e do correspondente tipo de atendimento para cada nível.", "local": "p. 66 (princípio: Dê a cada parceiro a atenção que o valor dele justifica e use canais u)"}, {"id": "EV-0059", "tipo": "documento", "fonte": "Building Successful Partner Channels in the software industry (Hans Peter Bech)", "pessoa": null, "data": "2026-11-05", "trecho": "5% of our partners will grow by themselves, 15% will grow if helped and 80% has no growth potential whatsoever.", "local": "p. 91 (Pirâmide do canal)"}, {"id": "EV-0060", "tipo": "validacao", "fonte": "FO-02: Rodada 2, to-be refeito a partir dos livros", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Aprovo como está", "local": "FO-02/Q-0006"}, {"id": "EV-0061", "tipo": "documento", "fonte": "Customer Success (Dan Steinman, Lincoln Murphy e Nick Mehta)", "pessoa": null, "data": "2026-11-05", "trecho": "Parta para a ação! Não se limite a observar e a refletir. Faça alguma coisa!", "local": "p. 128 (princípio: Todo sinal precisa virar uma ação com dono e prazo.)"}, {"id": "EV-0062", "tipo": "documento", "fonte": "Ecosystem-Led Growth: A Blueprint for Sales and Marketing Success Using the Power of Partnerships (Bob Moore)", "pessoa": null, "data": "2026-11-05", "trecho": "As soon as an opportunity in Salesforce hits the “Solution Review” sales stage, the partner manager will get an alert in a Slack channel called #no-partner-attached.", "local": "secao 26 (Partner Prioritization Matrix)"}, {"id": "EV-0063", "tipo": "documento", "fonte": "Customer Success (Dan Steinman, Lincoln Murphy e Nick Mehta)", "pessoa": null, "data": "2026-11-05", "trecho": "Os clientes não renovam, nem ficam com você, nem compram mais de você a não ser que, ou até que, você realmente lhes entregue valor.", "local": "p. 162 (princípio: Obceque-se pelo primeiro valor do parceiro e entregue em fatias.)"}, {"id": "EV-0064", "tipo": "documento", "fonte": "Ecossistema de Parceiros: Método Octo (Juliana Tubino e Nara Vaz Guimarães)", "pessoa": null, "data": "2026-11-05", "trecho": "o onboarding deve ser considerado finalizado depois da ativação do primeiro cliente e não apenas após o consumo de determinado volume de treinamentos", "local": "p. 46 (Jornada do Parceiro em sete etapas e onboarding por marcos de 30, 60, 90 e 120 d)"}, {"id": "EV-0065", "tipo": "documento", "fonte": "The Referral Engine (John Jantsch)", "pessoa": null, "data": "2026-11-05", "trecho": "It’s as important to acknowledge the sent referral as it is to acknowledge the converted referral.", "local": "p. 191 (princípio: Feche o ciclo com quem indicou, em cada fase, não só no fechamento)"}, {"id": "EV-0066", "tipo": "documento", "fonte": "Give and Take (Adam Grant)", "pessoa": null, "data": "2026-11-05", "trecho": "it has less to do with the amount of giving and more with the amount of feedback about the impact of that giving", "local": "p. 121 (princípio: Mostrar o impacto do dar a quem dá, porque o esgotamento vem do vazio )"}, {"id": "EV-0067", "tipo": "documento", "fonte": "The Business of Belonging (David Spinks)", "pessoa": null, "data": "2026-11-05", "trecho": "Validation. Participation is rewarded in some way, making them feel good about their participation, which strengthens their investment in the shared identity, and the cycle repeats.", "local": "p. 80 (princípio: Feche o ciclo de identificação, participação e validação e nunca deixe)"}, {"id": "EV-0068", "tipo": "documento", "fonte": "Never Eat Alone (Keith Ferrazzi, Tahl Raz)", "pessoa": null, "data": "2026-11-05", "trecho": "Let the original referrer know how the conversation went, and express your appreciation for their help.", "local": "p. 119 (princípio: Reconhecer quem abriu a porta e proteger a rede dos outros.)"}, {"id": "EV-0069", "tipo": "documento", "fonte": "The Referral Engine (John Jantsch)", "pessoa": null, "data": "2026-11-05", "trecho": "Problem is, we don’t spend enough time teaching our customers and sources the kinds of complaints, frustrations, challenges, and situations that qualify someone as a great referral.", "local": "p. 95 (princípio: Ensine o indicador a reconhecer o cliente certo e a dizer a frase cert)"}, {"id": "EV-0070", "tipo": "documento", "fonte": "The Referral Engine (John Jantsch)", "pessoa": null, "data": "2026-11-05", "trecho": "Put tangible referral tools in the hands of your referral sources.", "local": "p. 69 (princípio: Torne o gesto de indicar fácil, com ferramenta pronta nas mãos do indi)"}, {"id": "EV-0071", "tipo": "documento", "fonte": "The Business of Belonging (David Spinks)", "pessoa": null, "data": "2026-11-05", "trecho": "When you bring market norms and extrinsic rewards into a situation that was driven by social norms, the market norm tends to replace the intrinsic motivation.", "local": "p. 126 (princípio: Não troque norma social por norma de mercado: recompense com status, r)"}, {"id": "EV-0072", "tipo": "documento", "fonte": "The Referral Engine (John Jantsch)", "pessoa": null, "data": "2026-11-05", "trecho": "On the other hand, when the motivation is monetary, they will view it as a market transaction, and the motivation is often significantly lower", "local": "p. 159 (princípio: Recompense com reconhecimento e participação; dinheiro vira transação )"}, {"id": "EV-0073", "tipo": "documento", "fonte": "Co-opetition (Adam M. Brandenburger e Barry J. Nalebuff)", "pessoa": null, "data": "2026-11-05", "trecho": "Say thank you. Create loyalty by rewarding it.", "local": "p. 140 (Added Values)"}, {"id": "EV-0074", "tipo": "documento", "fonte": "Give and Take (Adam Grant)", "pessoa": null, "data": "2026-11-05", "trecho": "Research shows that at work, the vast majority of giving that occurs between people is in response to direct requests for help", "local": "p. 173 (princípio: Fazer o pedido explícito e deixar o dar visível, porque a maior parte )"}, {"id": "EV-0075", "tipo": "documento", "fonte": "Give and Take (Adam Grant)", "pessoa": null, "data": "2026-11-05", "trecho": "Giving and taking are based on our motives and values, and they’re choices that we make regardless of whether our personalities trend agreeable or disagreeable", "local": "p. 138 (princípio: Julgar tomadores pelo comportamento e pela reputação, e nunca pela sim)"}, {"id": "EV-0076", "tipo": "documento", "fonte": "The Business of Belonging (David Spinks)", "pessoa": null, "data": "2026-11-05", "trecho": "a steady cadence of different content and experiences for people to engage with (the beat), regular rituals where everyone knows how to participate (the chorus)", "local": "p. 144 (princípio: Crie cadência e ritual: repetição constrói hábito e identidade.)"}, {"id": "EV-0077", "tipo": "documento", "fonte": "The Business of Belonging (David Spinks)", "pessoa": null, "data": "2026-11-05", "trecho": "Every community starts at the seed stage. Take your time in this stage and don't worry about starting small! Small is a superpower.", "local": "p. 72 (princípio: Comece pequeno, convide pessoa por pessoa e faça o que não escala.)"}, {"id": "EV-0078", "tipo": "documento", "fonte": "The Business of Belonging (David Spinks)", "pessoa": null, "data": "2026-11-05", "trecho": "You should plan on no organic growth in the early days.", "local": "p. 110 (princípio: Planeje crescimento manual e trate o orgânico como bônus.)"}, {"id": "EV-0079", "tipo": "validacao", "fonte": "FO-02: Rodada 2, to-be refeito a partir dos livros", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Aprovo como está. O único comentário é que teremos poucos concorrentes, mas pode ocorrer, então concordo.", "local": "FO-02/Q-0012"}, {"id": "EV-0080", "tipo": "documento", "fonte": "The Keystone Advantage (Marco Iansiti, Roy Levien)", "pessoa": null, "data": "2026-11-05", "trecho": "What we seek are measures of the extent to which an ecosystem as a whole is durably creating opportunities for each of its domains.", "local": "p. 54 (princípio: Meça a saúde do ecossistema inteiro, não só o resultado do próprio fun)"}, {"id": "EV-0081", "tipo": "documento", "fonte": "Customer Success (Dan Steinman, Lincoln Murphy e Nick Mehta)", "pessoa": null, "data": "2026-11-05", "trecho": "Portanto, da mesma maneira como o VP de vendas gerencia por meio do pipeline, as equipes de customer success devem gerenciar por meio da saúde do cliente.", "local": "p. 123 (princípio: Gerencie a base de parceiros por um escore de saúde desdobrado em comp)"}, {"id": "EV-0082", "tipo": "documento", "fonte": "Strategic Alliances and Marketing Partnerships (Richard Gibbs, Andrew Humphries)", "pessoa": null, "data": "2026-11-05", "trecho": "This will help you to very roughly position a particular relationship within a G+H Type using Table 8.1.", "local": "p. 218 (tipologia e fatores)"}, {"id": "EV-0083", "tipo": "validacao", "fonte": "FO-02: Rodada 2, to-be refeito a partir dos livros", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Os três fatores e os oito tipos. Vamos rever os 3 fatores. Não estou convencido de que eles compreendam tudo o que pode se definir uma parceria. Quero me convencer, apenas se algum livro recomenda com bons argumentos, caso contrário, vamos ter que rever e mudar os fatores-chave. É ideal que consigamos fazer uma regra lógica para que os fatores-chave nos levem para os 8 tipos, como se fosse uma matriz. Digo isso sem ter lido o livro na íntegra, talvez o autor tenha colocado os tipo de maneira bem objetiva.", "local": "FO-02/Q-0009"}, {"id": "EV-0084", "tipo": "documento", "fonte": "The Keystone Advantage (Marco Iansiti, Roy Levien)", "pessoa": null, "data": "2026-11-05", "trecho": "The most successful markets in our study were cautious. They achieved liquidity first, tweaking their market designs with minimal investment in technology and operating infrastructure, and then scaled up.", "local": "p. 206 (princípio: Alcance liquidez em escala pequena antes de investir para escalar.)"}, {"id": "EV-0085", "tipo": "documento", "fonte": "Winning the Right Game: How to Disrupt, Defend, and Deliver in a Changing World (Ron Adner)", "pessoa": null, "data": "2026-11-05", "trecho": "The MVE is the smallest configuration of activities that can create enough evidence of value creation to attract new partners.", "local": "p. 83 (Ecosystem Construction)"}, {"id": "EV-0086", "tipo": "documento", "fonte": "Platform Revolution: How Networked Markets Are Transforming the Economy and How to Make Them Work for You (Geoffrey G. Parker, Marshall W. Van Alstyne e Sangeet Paul Choudary)", "pessoa": null, "data": "2026-11-05", "trecho": "Note that user commitment and active usage of the platform are the vital metrics of platform adoption, not sign-ups.", "local": "p. 177 (Metrics across the platform life cycle: liquidity, matching quality and trust)"}, {"id": "EV-0087", "tipo": "validacao", "fonte": "FO-02: Rodada 2, to-be refeito a partir dos livros", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Aprovo com ajustes (comente). Aprovo, mas os ajustes são meus mesmo. O que podemos olhar de maneira mais madura é abrir os três pilares de uma vez. Concordo que temos que ver a perspectiva macro estratégica do wise partners de maneira escalonada com metas bem estabalecidas e as etapas adaptadas para seu tempo, assim como recomendam os livros. Vamos seguir as recomendações dos livros. Precisamos definir os portões baseado no que mais faz sentido para a Wise Makers e o grupo tríade. Faça uma recomendação você mesmo analisando a conjuntura e também o que os livros recomendam.", "local": "FO-02/Q-0013"}, {"id": "EV-0088", "tipo": "validacao", "fonte": "FO-02: Rodada 2, to-be refeito a partir dos livros", "pessoa": "PE-01", "data": "2026-11-05", "trecho": "Aprovo com ajustes (comente). Perfeito. A única coisa que peço é para revisar as 3 perguntas para o diretor se são suficientes e necessárias. Não quero me ater a isso, necessáriamente. Rever o princípio.", "local": "FO-02/Q-0008"}, {"id": "EV-0089", "tipo": "documento", "fonte": "Nearbound and the Rise of the Who Economy (Jared Fuller, Jill Rowley)", "pessoa": null, "data": "2026-11-05", "trecho": "Well, that was only half the definition. The second half is the cadences and rituals to enforce them.", "local": "p. 191 (Nearbound Rhythm of Business)"}, {"id": "EV-0090", "tipo": "documento", "fonte": "The Keystone Advantage (Marco Iansiti, Roy Levien)", "pessoa": null, "data": "2026-11-05", "trecho": "Although both extremes work, what seem not to work are intermediate models.", "local": "p. 210 (princípio: Defina governança clara, com dono único e regras visíveis.)"}, {"id": "EV-0091", "tipo": "documento", "fonte": "Customer Success (Dan Steinman, Lincoln Murphy e Nick Mehta)", "pessoa": null, "data": "2026-11-05", "trecho": "Quando muita gente é dona ninguém manda nada", "local": "p. 52 (princípio: Dê um dono único à retenção, com autoridade, métricas visíveis e voz n)"}, {"id": "EV-0092", "tipo": "documento", "fonte": "Getting to Yes: Negotiating Agreement Without Giving In (Roger Fisher, William Ury e Bruce Patton)", "pessoa": null, "data": "2026-11-05", "trecho": "It is hard to make concessions, but it is easy to criticize.", "local": "p. 120 (Texto único, acordo-quadro, jiu-jitsu de negociação e conversas difíceis)"}, {"id": "EV-0093", "tipo": "documento", "fonte": "Never Eat Alone (Keith Ferrazzi, Tahl Raz)", "pessoa": null, "data": "2026-11-05", "trecho": "In reality, people who have the largest circle of contacts, mentors, and friends know that you must reach out to others long before you need anything at all.", "local": "p. 53 (princípio: Construir a rede antes de precisar dela.)"}, {"id": "EV-0094", "tipo": "documento", "fonte": "Never Eat Alone (Keith Ferrazzi, Tahl Raz)", "pessoa": null, "data": "2026-11-05", "trecho": "If 80 percent of success is, as Woody Allen once said, just showing up, then 80 percent of building and maintaining relationships is just staying in touch.", "local": "p. 192 (princípio: Manter contato por repetição organizada (o ping), com ritmo proporcion)"}, {"id": "EV-0095", "tipo": "documento", "fonte": "Never Eat Alone (Keith Ferrazzi, Tahl Raz)", "pessoa": null, "data": "2026-11-05", "trecho": "Once you have gained some early recognition, you need to nurture a developing relationship with a phone call or e-mail at least once a month.", "local": "p. 193 (Pinging, Manter Contato o Tempo Todo)"}, {"id": "EV-0096", "tipo": "documento", "fonte": "Never Eat Alone (Keith Ferrazzi, Tahl Raz)", "pessoa": null, "data": "2026-11-05", "trecho": "Give yourself between twelve and twenty-four hours after you meet someone to follow up.", "local": "p. 117 (Pinging, Manter Contato o Tempo Todo)"}, {"id": "EV-0097", "tipo": "documento", "fonte": "Never Eat Alone (Keith Ferrazzi, Tahl Raz)", "pessoa": null, "data": "2026-11-05", "trecho": "For people important to my career or business, I tend to favor the value-add ping.", "local": "p. 197 (Pinging, Manter Contato o Tempo Todo)"}, {"id": "EV-0098", "tipo": "documento", "fonte": "Never Eat Alone (Keith Ferrazzi, Tahl Raz)", "pessoa": null, "data": "2026-11-05", "trecho": "Real power comes from being indispensable. Indispensability comes from being a switchboard, parceling out as much information, contacts, and goodwill to as many people", "local": "p. 185 (princípio: Ser o ponto de ligação entre mundos, sem esperar pedido.)"}, {"id": "EV-0099", "tipo": "documento", "fonte": "Never Eat Alone (Keith Ferrazzi, Tahl Raz)", "pessoa": null, "data": "2026-11-05", "trecho": "And the first key is, don't wait to be asked. Just do it.", "local": "p. 183 (princípio: Ser o ponto de ligação entre mundos, sem esperar pedido.)"}, {"id": "EV-0100", "tipo": "documento", "fonte": "Never Eat Alone (Keith Fe
