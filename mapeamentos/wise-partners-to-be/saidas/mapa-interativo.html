<!doctype html>
<html lang="pt-BR">

<meta charset="utf-8">

<body>
<title>Processos Programa Wise Partners (to-be)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cabeçalho com medidores, abas de visão, área principal e painel de detalhe à direita (vira folha inferior no celular). */
:root {
  --paper: #F3F5F7;
  --surface: #FFFFFF;
  --surface-2: #F8FAFB;
  --ink: #15202B;
  --muted: #586472;
  --line: #D8DEE5;
  --accent: #1D5C8F;
  --accent-soft: #E2EDF7;
  --ok: #2F8F4E; --ok-bg: #DDF3E4;
  --decl: #96690A; --decl-bg: #FFF1C2;
  --hip: #727B86; --hip-bg: #FFFFFF;
  --cont: #C0392B; --cont-bg: #FCE3E1;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E141A; --surface: #161F28; --surface-2: #1B2530; --ink: #E5EAF0; --muted: #9AA6B3; --line: #2B3744;
    --accent: #84B6E6; --accent-soft: #1A2B3B;
    --ok: #63C584; --ok-bg: #15301F; --decl: #E3BA4F; --decl-bg: #33290E; --hip: #A0A9B3; --hip-bg: #161F28; --cont: #F08A7E; --cont-bg: #3A1A17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E141A; --surface: #161F28; --surface-2: #1B2530; --ink: #E5EAF0; --muted: #9AA6B3; --line: #2B3744;
  --accent: #84B6E6; --accent-soft: #1A2B3B;
  --ok: #63C584; --ok-bg: #15301F; --decl: #E3BA4F; --decl-bg: #33290E; --hip: #A0A9B3; --hip-bg: #161F28; --cont: #F08A7E; --cont-bg: #3A1A17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; max-width: 1480px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 800; }
h2 { font-size: 1.25rem; font-weight: 800; }
h3 { font-size: 1rem; font-weight: 600; }
.mono { font-family: var(--f-mono); font-size: 0.85em; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Cabeçalho */
header.topo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.72rem; color: var(--muted); font-weight: 700; }
.medidores { display: flex; gap: 18px; flex-wrap: wrap; }
.medidor { min-width: 170px; }
.medidor .rot { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }
.medidor .num { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; color: var(--ink); }
.barra { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.barra.ok > i { background: var(--ok); }
.contagens { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 0.8rem; white-space: nowrap; }
.chip b { font-variant-numeric: tabular-nums; }

/* Legenda e abas */
.barra-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 14px 0 16px; }
nav.abas { display: flex; gap: 4px; flex-wrap: wrap; }
nav.abas a { text-decoration: none; color: var(--muted); padding: 7px 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; }
nav.abas a[aria-current="page"] { background: var(--ink); color: var(--paper); }
nav.abas a:hover:not([aria-current="page"]) { background: var(--accent-soft); color: var(--ink); }
.legenda { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 0.78rem; color: var(--muted); }

/* Selos de status */
.selo { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; border: 1.5px solid; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em; }
.selo.confirmado { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); }
.selo.declarado { color: var(--decl); background: var(--decl-bg); border-color: var(--decl); }
.selo.hipotese { color: var(--hip); background: var(--hip-bg); border-color: var(--hip); border-style: dashed; }
.selo.contestado { color: var(--cont); background: var(--cont-bg); border-color: var(--cont); }
.ponto { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; border: 1.5px solid; }
.ponto.confirmado { background: var(--ok); border-color: var(--ok); }
.ponto.declarado { background: var(--decl); border-color: var(--decl); }
.ponto.hipotese { background: transparent; border-color: var(--hip); border-style: dashed; }
.ponto.contestado { background: var(--cont); border-color: var(--cont); }

/* Grade principal com painel */
.grade { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
.grade.sem-painel { grid-template-columns: minmax(0, 1fr); }
main { min-width: 0; }
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.secao + .secao { margin-top: 18px; }
.titulo-secao { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }

/* Cadeia de valor */
.banda { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 14px; align-items: center; }
.banda + .banda { margin-top: 10px; }
.banda .nome-banda { font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; }
.banda .nome-banda small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 0.75rem; color: var(--muted); }
.fileira { display: flex; gap: 8px; flex-wrap: wrap; }
.macro { text-align: left; cursor: pointer; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 170px; flex: 1 1 170px; max-width: 280px; display: grid; gap: 6px; }
.macro:hover { border-color: var(--accent); }
.macro.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.macro .cab { display: flex; justify-content: space-between; gap: 6px; align-items: start; }
.macro .nome { font-weight: 700; line-height: 1.25; }
.macro .rodape { display: flex; justify-content: space-between; gap: 6px; font-size: 0.75rem; color: var(--muted); }
.macro.confirmado { border-color: var(--ok); background: var(--ok-bg); }
.macro.declarado { border-color: var(--decl); background: var(--decl-bg); }
.macro.hipotese { border-style: dashed; border-color: var(--hip); background: var(--hip-bg); }
.macro.contestado { border-color: var(--cont); background: var(--cont-bg); }
.macro.chevron { clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%, 12px 50%); padding-left: 24px; padding-right: 26px; border: none; }
.macro.chevron.hipotese { background: repeating-linear-gradient(135deg, var(--hip-bg) 0 10px, var(--surface-2) 10px 20px); }
.macro.chevron.sel, .macro.chevron:hover { filter: brightness(0.96); box-shadow: none; outline: 2px solid var(--accent); outline-offset: -2px; }
.tag.papel { color: var(--decl); border-color: var(--decl); border-style: dashed; }
.macro.chevron:first-child { clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%); padding-left: 14px; }
.cv { margin-top: 18px; }
.cv-etapas { display: flex; gap: 0; overflow-x: auto; padding-bottom: 4px; }
.cv-etapa { flex: 1 0 150px; padding: 10px 12px; border-top: 3px solid var(--accent); background: var(--surface-2); margin-right: 4px; }
.cv-etapa .n { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); }
.lnk { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 2px; }

/* Hierarquia */
.ferramentas { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.ferramentas input[type="search"] { flex: 1 1 220px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.btn { padding: 7px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.btn.prim { background: var(--accent); border-color: var(--accent); color: var(--surface); }
a.btn { text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; }
.filtro { display: inline-flex; align-items: center; gap: 5px; font-size: 0.8rem; padding: 4px 8px; border: 1px solid var(--line); border-radius: 99px; cursor: pointer; background: var(--surface); }
.filtro input { margin: 0; }
.arvore { list-style: none; margin: 0; padding: 0; }
.arvore ul { list-style: none; margin: 0; padding-left: 22px; border-left: 1px dashed var(--line); margin-left: 9px; }
.no { display: grid; grid-template-columns: 20px auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.no:hover { background: var(--accent-soft); }
.no.sel { background: var(--accent-soft); outline: 1.5px solid var(--accent); }
.no .seta { width: 20px; height: 20px; border: none; background: none; cursor: pointer; color: var(--muted); padding: 0; }
.no .cod { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); }
.no .nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.no .nm small { font-weight: 400; color: var(--muted); }
.no .tags { display: flex; gap: 4px; align-items: center; }
.tag { font-size: 0.7rem; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.falta { color: var(--cont); border-color: color-mix(in srgb, var(--cont) 40%, transparent); }
.grupo-tipo { margin: 14px 0 4px; }

/* Fluxos */
.fluxos { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px; }
.lista-fluxos { display: grid; gap: 6px; align-content: start; }
.lista-fluxos button { text-align: left; padding: 8px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; display: grid; gap: 2px; }
.lista-fluxos button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tela-bpmn { height: 460px; background: #FFFFFF; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; position: relative; }
.tela-bpmn .aviso { position: absolute; inset: 0; display: grid; place-items: center; color: #586472; padding: 20px; text-align: center; }
.frases { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; }
.frases li { padding: 8px 10px; background: var(--surface-2); border-radius: 8px; border-left: 3px solid var(--line); }
.frases li.ini, .frases li.fim { border-left-color: var(--accent); }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }

/* Tabelas */
.tabela-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
td.c { text-align: center; }
.matriz th.rot { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; height: 190px; text-transform: none; letter-spacing: 0; font-size: 0.78rem; }

/* Negócio */
.canvas { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.bloco { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; align-content: start; }
.bloco.vazio { border-style: dashed; }
.fato { display: grid; gap: 4px; font-size: 0.88rem; }
.quadrante { display: grid; grid-template-columns: 22px repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, 96px) 24px; gap: 4px; max-width: 480px; font-size: 0.8rem; }
.quadrante .q { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; display: grid; align-content: space-between; }
.quadrante .q.atual { background: var(--accent-soft); border: 2px solid var(--accent); }
.quadrante .eixo { color: var(--muted); font-size: 0.72rem; display: grid; place-items: center; }
.quadrante .eixo.v { writing-mode: vertical-rl; transform: rotate(180deg); grid-row: 1 / span 2; white-space: nowrap; }

/* Painel de detalhe */
aside.painel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; }
.painel .fechar { float: right; }
.campo { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.campo:last-child { border-bottom: none; }
.campo .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; display: flex; gap: 6px; align-items: center; }
.campo .v { overflow-wrap: anywhere; }
.campo.falta .v { color: var(--cont); font-style: italic; }
.campo.hip .v { color: var(--hip); font-style: italic; }
.ev { border-left: 3px solid var(--line); padding: 6px 10px; margin: 6px 0; background: var(--surface-2); border-radius: 0 6px 6px 0; font-size: 0.86rem; }
.ev q { quotes: "\201C" "\201D"; }
.ev .fonte { display: block; font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
.vazio-msg { color: var(--muted); font-style: italic; }
.rodape-pag { margin-top: 28px; font-size: 0.78rem; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

@media (max-width: 1080px) {
  .grade { grid-template-columns: minmax(0, 1fr); }
  aside.painel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; max-height: 70vh; border-radius: 14px 14px 0 0; z-index: 20; box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.18); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (max-width: 720px) {
  header.topo { grid-template-columns: minmax(0, 1fr); }
  .banda { grid-template-columns: minmax(0, 1fr); }
  .fluxos { grid-template-columns: minmax(0, 1fr); }
  .macro { max-width: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  --space-tool-crosshair-stroke-color: var(--color-black);

  --tooltip-error-background-color: var(--color-red-360-100-97);
  --tooltip-error-border-color: var(--color-red-360-100-45);
  --tooltip-error-color: var(--color-red-360-100-45);

  --hover-tooltip-font-family: "IBM Plex Sans", sans-serif;
  --hover-tooltip-font-size: 12px;
  --hover-tooltip-secondary-font-size: 11px;
  --hover-tooltip-background-color: var(--color-grey-225-10-15);
  --hover-tooltip-color: var(--color-white);
  --hover-tooltip-shadow-color: var(--color-black-opacity-10);

  --palette-tooltip-shortcut-background-color: var(--color-grey-225-10-35);
}

/**
 * SVG styles
 */

.djs-container svg.drop-not-ok {
  background: var(--shape-drop-not-allowed-fill-color) !important;
}

.djs-container svg.new-parent {
  background: var(--shape-drop-allowed-fill-color) !important;
}

.djs-container svg:focus {
  outline-offset: -1px;
}

/**
 * outline styles
 */

.djs-outline,
.djs-selection-outline {
  fill: none;
  shape-rendering: geometricPrecision;
  stroke-width: 2px;
}

.djs-outline {
  visibility: hidden;
}

.djs-selection-outline {
  stroke: var(--element-selected-outline-stroke-color);
}

.djs-element.selected .djs-outline {
  visibility: visible;

  stroke: var(--element-selected-outline-stroke-color);
}

.djs-connection.selected .djs-outline {
  display: none;
}

.djs-multi-select .djs-element.selected .djs-outline,
.djs-dragging-active-lasso .djs-element.selected .djs-outline {
  stroke: var(--element-selected-outline-secondary-stroke-color);
  display: block;
}

.djs-outline-hidden .djs-outline {
  display: none !important;
}

.djs-shape.connect-ok .djs-visual > :nth-child(1) {
  fill: var(--shape-connect-allowed-fill-color) !important;
}

.djs-shape.connect-not-ok .djs-visual > :nth-child(1),
.djs-shape.drop-not-ok .djs-visual > :nth-child(1) {
  fill: var(--shape-drop-not-allowed-fill-color) !important;
}

.djs-shape.new-parent .djs-visual > :nth-child(1) {
  fill: var(--shape-drop-allowed-fill-color) !important;
}


/* Override move cursor during drop and connect */
.drop-not-ok,
.connect-not-ok,
.drop-not-ok *,
.connect-not-ok * {
  cursor: not-allowed !important;
}

.drop-ok,
.connect-ok,
.drop-ok *,
.connect-ok * {
  cursor: default !important;
}

.djs-element.attach-ok .djs-visual > :nth-child(1) {
  stroke-width: 5px !important;
  stroke: var(--shape-attach-allowed-stroke-color) !important;
}

.djs-frame.connect-not-ok .djs-visual > :nth-child(1),
.djs-frame.drop-not-ok .djs-visual > :nth-child(1) {
  stroke-width: 3px !important;
  stroke: var(--shape-drop-not-allowed-fill-color) !important;
  fill: none !important;
}

/**
* Selection box style
*
*/
.djs-lasso-overlay {
  fill: var(--lasso-fill-color);
  stroke: var(--lasso-stroke-color);
  stroke-width: 2px;
  shape-rendering: geometricPrecision;
  pointer-events: none;
}

/**
 * Resize styles
 */
.djs-resize-overlay {
  fill: none;

  stroke-dasharray: 5 1 3 1;
  stroke: var(--shape-resize-preview-stroke-color);

  pointer-events: none;
}

.djs-resizer-hit {
  fill: none;
  pointer-events: all;
}

.djs-resizer-visual {
  fill: var(--resizer-fill-color);
  stroke-width: 1px;
  stroke: var(--resizer-stroke-color);
  shape-rendering: geometricPrecision;
}

.djs-resizer:hover .djs-resizer-visual {
  stroke: var(--resizer-stroke-color);
  stroke-opacity: 1;
}

.djs-cursor-resize-ns,
.djs-resizer-n,
.djs-resizer-s {
  cursor: ns-resize;
}

.djs-cursor-resize-ew,
.djs-resizer-e,
.djs-resizer-w {
  cursor: ew-resize;
}

.djs-cursor-resize-nwse,
.djs-resizer-nw,
.djs-resizer-se {
  cursor: nwse-resize;
}

.djs-cursor-resize-nesw,
.djs-resizer-ne,
.djs-resizer-sw {
  cursor: nesw-resize;
}

.djs-shape.djs-resizing > .djs-outline {
  visibility: hidden !important;
}

.djs-shape.djs-resizing > .djs-resizer {
  visibility: hidden;
}

.djs-dragger > .djs-resizer {
  visibility: hidden;
}

/**
 * drag styles
 */
.djs-dragger * {
  fill: none !important;
  stroke: var(--element-dragger-color) !important;
}

.djs-dragger tspan,
.djs-dragger text {
  fill: var(--element-dragger-color) !important;
  stroke: none !important;
}

.djs-dragger marker circle,
.djs-dragger marker path,
.djs-dragger marker polygon,
.djs-dragger marker polyline,
.djs-dragger marker rect {
  fill: var(--element-dragger-color) !important;
  stroke: none !important;
}

.djs-dragger marker text,
.djs-dragger marker tspan {
  fill: none !important;
  stroke: var(--element-dragger-color) !important;
}

.djs-dragging,
.djs-dragging > * {
  opacity: 0.3 !important;
  pointer-events: none !important;
}

/**
 * no pointer events for visual
 */
.djs-visual,
.djs-outline {
  pointer-events: none;
}

.djs-element.attach-ok .djs-hit {
  stroke-width: 60px !important;
}

/**
 * all pointer events for hit shape
 */
.djs-element > .djs-hit-all,
.djs-element > .djs-hit-no-move {
  pointer-events: all;
}

.djs-element > .djs-hit-stroke,
.djs-element > .djs-hit-click-stroke {
  pointer-events: stroke;
}

/**
 * shape / connection basic styles
 */
.djs-connection .djs-visual {
  stroke-width: 2px;
  fill: none;
}

.djs-cursor-grab {
  cursor: -webkit-grab;
  cursor: -moz-grab;
  cursor: grab;
}

.djs-cursor-grabbing {
  cursor: -webkit-grabbing;
  cursor: -moz-grabbing;
  cursor: grabbing;
}

.djs-cursor-crosshair {
  cursor: crosshair;
}

.djs-cursor-move {
  cursor: move;
}

.djs-cursor-resize-ns {
  cursor: ns-resize;
}

.djs-cursor-resize-ew {
  cursor: ew-resize;
}


/**
 * snapping
 */
.djs-snap-line {
  stroke: var(--snap-line-stroke-color);
  stroke-linecap: round;
  stroke-width: 2px;
  pointer-events: none;
}

/**
 * snapping
 */
.djs-crosshair {
  stroke: var(--space-tool-crosshair-stroke-color);
  stroke-linecap: round;
  stroke-width: 1px;
  pointer-events: none;
  shape-rendering: geometricPrecision;
  stroke-dasharray: 5, 5;
}

/**
 * palette
 */

.djs-palette {
  position: absolute;
  left: 20px;
  top: 20px;

  box-sizing: border-box;
  width: 48px;
}

.djs-palette .separator {
  margin: 5px;
  padding-top: 5px;

  border: none;
  border-bottom: solid 1px var(--palette-separator-color);

  clear: both;
}

.djs-palette .entry:before {
  vertical-align: initial;
}

.djs-palette .djs-palette-toggle {
  cursor: pointer;
}

.djs-palette .entry,
.djs-palette .djs-palette-toggle {
  color: var(--palette-entry-color);
  font-size: 30px;

  text-align: center;
}

.djs-palette .entry {
  float: left;
}

.djs-palette .entry img {
  max-width: 100%;
}

.djs-palette .djs-palette-entries:after {
  content: '';
  display: table;
  clear: both;
}

.djs-palette .djs-palette-toggle:hover {
  background: var(--palette-toggle-hover-background-color);
}

.djs-palette .entry:hover {
  color: var(--palette-entry-hover-color);
}

.djs-palette .highlighted-entry {
  color: var(--palette-entry-selected-color) !important;
}

.djs-palette .entry,
.djs-palette .djs-palette-toggle {
  width: 46px;
  height: 46px;
  line-height: 46px;
  cursor: default;
}

/**
 * Palette open / two-column layout is controlled via
 * classes on the palette. Events to hook into palette
 * changed life-cycle are available in addition.
 */
.djs-palette.two-column.open {
  width: 94px;
}

.djs-palette:not(.open) .djs-palette-entries {
  display: none;
}

.djs-palette:not(.open) {
  overflow: hidden;
}

.djs-palette.open .djs-palette-toggle {
  display: none;
}

.djs-hover-tooltip {
  position: fixed;
  z-index: 1000;

  display: flex;
  align-items: center;
  gap: 6px;

  padding: 6px 10px;
  border-radius: 4px;

  background-color: var(--hover-tooltip-background-color);
  color: var(--hover-tooltip-color);

  font-family: var(--hover-tooltip-font-family);
  font-size: var(--hover-tooltip-font-size);
  line-height: 1.2;
  white-space: nowrap;

  pointer-events: none;
  box-shadow: 0 1px 4px var(--hover-tooltip-shadow-color);
}

.djs-hover-tooltip--right {
  transform: translateY(-50%);
}

.djs-hover-tooltip--top {
  transform: translate(-50%, -100%);
}

.djs-palette-tooltip-shortcut {
  padding: 1px 5px;

  border-radius: 3px;

  background-color: var(--palette-tooltip-shortcut-background-color);

  font-family: monospace;
  font-size: var(--hover-tooltip-secondary-font-size);
  line-height: 1.2;
}

/**
 * context-pad
 */
.djs-context-pad {
  position: absolute;
  display: none;
  pointer-events: none;
  line-height: 1;
  width: 72px;
  z-index: 100;
}

.djs-context-pad .entry {
  width: 22px;
  height: 22px;
  text-align: center;
  display: inline-block;
  font-size: 22px;
  margin: 0 2px 2px 0;

  border-radius: 3px;

  cursor: default;

  background-color: var(--context-pad-entry-background-color);
  box-shadow: 0 0 2px 1px var(--context-pad-entry-background-color);
  pointer-events: all;
  vertical-align: middle;
}

.djs-context-pad .entry:hover {
  background: var(--context-pad-entry-hover-background-color);
}

.djs-context-pad.open {
  display: block;
}

/**
 * popup styles
 */
.djs-popup {
  line-height: 1;
  box-sizing: border-box;
  background: var(--popup-background-color);
  overflow: hidden;
  position: fixed;
  z-index: 200;
  box-shadow: 0px 2px 6px var(--popup-shadow-color);
  border: solid 1px var(--popup-border-color);
  min-width: 120px;
  max-width: 300px;
  outline: none;
  font-size: var(--popup-font-size);
  font-family: var(--popup-font-family);
}

.djs-popup-search input {
  width: 100%;
  box-sizing: border-box;
  font-size: var(--popup-font-size);
  padding: 3px 6px 3px 28px;
  border-radius: 2px;
  border: solid 1px var(--popup-search-border-color);
  line-height: 21px;
}

.djs-popup-search input:focus {
  background-color: var(--popup-search-focus-background-color);
  border: solid 1px var(--popup-search-focus-border-color);
  outline: none;
}

.djs-popup-header {
  display: flex;
  align-items: stretch;
  line-height: 20px;
  margin: 10px 12px 10px 12px;
}

.djs-popup-header .entry {
  border-radius: 2px;
}

.djs-popup button.entry {
  padding: 0;
  background: transparent;
  border: 0;
}

.djs-popup-header .entry.active {
  color: var(--popup-header-entry-selected-color);
}

.djs-popup-header .entry.disabled {
  color: inherit;
}

.djs-popup-header-group {
  display: flex;
  flex-direction: row;
  align-items: center;
  list-style: none;
  margin: 0;
  padding: 0;
}

.djs-popup-header-group .entry {
  display: flex;
  flex-direction: row;
  align-items: center;
}

.djs-popup-header-group + .djs-popup-header-group:before {
  content: '';
  width: 1px;
  height: 20px;
  background: var(--popup-header-group-divider-color);
  margin: 0 5px;
}

.djs-popup-search {
  position: relative;
  width: auto;
  margin: 10px 12px;
}

.djs-popup-tabs-container {
  position: relative;
  border-bottom: solid 1px var(--popup-tab-strip-border-color);
}

/**
 * The scroll control doubles as the edge fade: tabs scrolled past it fade out
 * rather than being cut off behind an opaque block.
 */
.djs-popup-tabs-scroll {
  appearance: none;
  position: absolute;
  top: 0;
  bottom: 1px;
  width: 28px;
  display: flex;
  align-items: center;
  padding: 0;
  border: none;
  border-radius: 0;
  color: var(--popup-tab-color);
  cursor: pointer;
}

.djs-popup-tabs-scroll:hover {
  color: var(--popup-tab-hover-color);
}

.djs-popup-tabs-scroll-start {
  left: 0;
  justify-content: flex-start;
  background: linear-gradient(to left, transparent, var(--popup-background-color) 60%);
}

.djs-popup-tabs-scroll-end {
  right: 0;
  justify-content: flex-end;
  background: linear-gradient(to right, transparent, var(--popup-background-color) 60%);
}

.djs-popup-tabs-scroll-start svg {
  transform: rotate(180deg);
}

.djs-popup-tabs {
  display: flex;
  flex-wrap: nowrap;
  gap: 2px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 0 12px;

  /* keep scrolled-to tabs clear of the scroll controls */
  scroll-padding: 0 28px;
  scrollbar-width: none;
}

.djs-popup-tabs::-webkit-scrollbar {
  display: none;
}

.djs-popup-tab {
  appearance: none;
  background: transparent;
  border: none;
  border-bottom: solid 2px transparent;
  border-radius: 0;
  flex: 0 0 auto;
  padding: 6px 10px;
  font: inherit;
  font-size: var(--popup-font-size);
  color: var(--popup-tab-color);
  cursor: pointer;
  white-space: nowrap;
}

.djs-popup-tab:hover {
  color: var(--popup-tab-hover-color);
}

.djs-popup-tab:focus-visible {
  outline: solid 1px var(--popup-tab-focus-border-color);
  outline-offset: -2px;
}

.djs-popup-tab[aria-selected="true"] {
  color: var(--popup-tab-active-color);
  border-bottom-color: var(--popup-tab-active-border-color);
  font-weight: var(--popup-header-font-weight);
}

.djs-popup-title {
  font-size: var(--popup-font-size);
  font-weight: var(--popup-header-font-weight);
  flex: 1;
  margin: 0;
}

.djs-popup-breadcrumbs {
  display: flex;
  line-height: 20px;
  margin: 10px 12px;
}

.djs-popup-breadcrumbs-item {
  display: inline-flex;
  min-width: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  border: 0;
  outline: none;
  appearance: none;
  color: var(--popup-description-color);
  font: inherit;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.djs-popup-breadcrumbs-item--separator::before {
  display: inline-block;
  content: '/';
  color: var(--popup-description-color);
  margin: 0 4px;
}

.djs-popup-breadcrumbs-item:hover {
  color: inherit;
  text-decoration: underline;
}

.djs-popup-breadcrumbs-item:focus-visible {
  outline: 1px solid var(--popup-search-focus-border-color);
  outline-offset: 2px;
}

.djs-popup-breadcrumbs-item--back {
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 2px 3px;
  margin-right: 6px;
  border: 1px solid var(--popup-search-border-color);
  border-radius: 4px;
}

.djs-popup-breadcrumbs-item--back:hover {
  background: #f2f3f5;
}

.djs-popup-breadcrumbs-item--current {
  font-weight: var(--popup-header-font-weight);
  color: inherit;
  cursor: default;
}

.djs-popup-breadcrumbs-item--current:hover {
  text-decoration: none;
}

.djs-popup-entry-actions {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  gap: 6px;
  margin-left: 6px;
}

.djs-popup-entry-chevron {
  display: flex;
  align-items: center;
  color: var(--popup-description-color);
}

.djs-popup-search-icon {
  position: absolute;
  left: 8px;
  top: 7px;
}

.djs-popup-search-count {
  margin: 0 12px;
  font-size: var(--popup-secondary-font-size);
  color: var(--popup-description-color);
}

.djs-popup-results {
  margin: 7px 3px 7px 12px;
  list-style: none;
  max-height: 280px;
  overflow: auto;
  padding-right: 9px;
}

/**
 * The results list is focusable (as a listbox holding
 * `aria-activedescendant`) when there is no search field.
 * The active entry is indicated via `.entry.selected`, so we hide
 * the outline on the list container itself.
 */
.djs-popup-results:focus {
  outline: none;
}

.djs-popup-group {
  margin: 0;
  padding: 0;
  width: 100%;
}

.djs-popup-body .entry,
.djs-popup-body .entry-header {
  padding: 5px 7px;
  cursor: default;
  border-radius: 4px;
}

.djs-popup-body .entry-header {
  font-weight: var(--popup-header-font-weight);
  color: var(--popup-entry-title-color);
  padding-left: 0;
}

.djs-popup [class*="icon"] .djs-popup-label,
.djs-popup-label:not(:first-child) {
  margin-left: .5em;
}

.djs-popup [class*="icon"]:before,
.djs-popup-entry-icon {
  width: 1em;
  height: 1em;
  display: inline-block;
  font-size: 1.4em;
  vertical-align: middle;
}

.djs-popup-body .entry-header:not(:first-child) {
  margin-top: 8px;
  margin-bottom: 2px;
}

.djs-popup-body .entry {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  height: min-content;
}

.djs-popup .entry.selected {
  background-color: var(--popup-entry-hover-color);
}

.djs-popup .entry.disabled {
  color: var(--popup-disabled-color);
  cursor: not-allowed;
}

.djs-popup-body .entry:not(:first-child) {
  margin-top: 2px;
}

.djs-popup-entry-content {
  display: flex;
  flex-direction: column;
  flex: 1;
}

.djs-popup-entry-description {
  font-size: var(--popup-secondary-font-size);
  margin-top: .25em;

  color: var(--popup-description-color);
}

.djs-popup-label,
.djs-popup-entry-description {
  line-height: 1.4em;
}

.djs-popup .entry,
.djs-popup .entry-header {
  margin: 1px;
}

.djs-popup-body {
  flex-direction: column;
  width: auto;
}

.djs-popup *::-webkit-scrollbar {
  width: 6px;
}

.djs-popup *::-webkit-scrollbar-thumb {
  border-radius: 3px;
  background-color: rgba(0, 0, 0, 0.2);
}

.djs-popup *::-webkit-scrollbar-track {
  box-shadow: none;
  background: transparent;
  margin: 0;
  padding: 5px;
}

.djs-popup-no-results {
  padding: 0 12px 12px 12px;
  color: var(--popup-no-results-color);
}

.djs-popup-footer {
  display: flex;
  padding: 5px 12px 7px 12px;
  border-top: solid 1px var(--popup-border-color);
}

/**
 * The footer holds the keyboard/assistive-technology reachable documentation
 * link. Mouse users get the per-entry `.djs-popup-entry-docs` affordance on
 * hover instead, so the (redundant) footer link is hidden while the results
 * list is hovered and shown during keyboard navigation.
 */
.djs-popup-results:hover ~ .djs-popup-footer {
  display: none;
}

.djs-popup-entry-docs {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  visibility: hidden;
  padding: 2px 3px;
  color: var(--popup-description-color);
  background: #fff;
  border: 1px solid var(--popup-search-border-color);
  border-radius: 4px;
  cursor: pointer;
  transition: background-color .12s ease, border-color .12s ease, color .12s ease;
}

.djs-popup-body .entry:hover .djs-popup-entry-docs {
  visibility: visible;
}

.djs-popup-body .entry .djs-popup-entry-docs:hover {
  background: #f2f3f5;
}

.djs-popup-entry-docs svg {
  vertical-align: middle;
}

.djs-popup-footer-docs {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: var(--popup-secondary-font-size);
  color: var(--popup-description-color);
  text-decoration: none;
}

.djs-popup-footer-docs:hover {
  text-decoration: underline;
}

.djs-popup-footer-docs svg {
  vertical-align: middle;
  margin: 2px;
}

/**
 *  palette styles
 */
.djs-palette {
  background: var(--palette-background-color);
  border: solid 1px var(--palette-border-color);
  border-radius: 2px;
}

/**
 * bendpoints
 */
.djs-segment-dragger,
.djs-bendpoint {
  display: none;
}

.djs-segment-dragger .djs-visual {
  display: none;

  fill: var(--bendpoint-fill-color);
  stroke: var(--bendpoint-stroke-color);
  stroke-width: 1px;
  stroke-opacity: 1;
}

.djs-segment-dragger:hover .djs-visual {
  display: block;
}

.djs-bendpoint .djs-visual {
  fill: var(--bendpoint-fill-color);
  stroke: var(--bendpoint-stroke-color);
  stroke-width: 1px;
}

.djs-segment-dragger:hover,
.djs-bendpoints.hover .djs-segment-dragger,
.djs-bendpoints.selected .djs-segment-dragger,
.djs-bendpoint:hover,
.djs-bendpoints.hover .djs-bendpoint,
.djs-bendpoints.selected .djs-bendpoint {
  display: block;
}

.djs-drag-active .djs-bendpoints * {
  display: none;
}

.djs-bendpoints:not(.hover) .floating {

<script id="dados" type="application/json">{"gerado_em": "2026-11-05", "versao": "1.0", "mapa": {"schema": "mapa-processos/1.0", "organizacao": {"nome": "Programa Wise Partners (to-be)", "slug": "x", "descricao": "Canal de aquisição mais barato que os canais ativos: um ecossistema pequeno, orquestrado pela Wise Makers com o portal no centro, em que parceiros que vendem para a indústria geram e recebem oportunidades e ganham comunidade, reconhecimento e comissão por regra única.", "setor": "Consultoria de gestão para indústrias (ecossistema de parceiros)", "objetivo_do_mapeamento": "Refatorar todos os conceitos de uma vez: princípios ordenados de 17 livros, hierarquia e arquitetura de processos to-be com o portal no centro da gestão, e o modelo de negócio do programa. As decisões do patrocinador não pesam mais que os livros: onde divergem, a divergência fica registrada e é conciliada.", "escopo": {"inclui": ["Arquitetura do ecossistema e regras do programa", "Gestão por rituais e por exceção", "Jornada do parceiro (atrair, integrar, desenvolver, reter ou encerrar)", "Oportunidades do ecossistema (indicações, prateleira, cruzamento, Base Ativa)", "Comunidade, capacitação, dados, contratos e portal"], "exclui": ["Vender e entregar a consultoria ao cliente indicado (processos comerciais e de entrega das empresas do grupo)"]}, "patrocinador": "PE-01", "consultor": "", "niveis": ["Organização", "Macroprocesso", "Processo", "Subprocesso", "Atividade", "Tarefa"], "criado_em": "2026-11-05", "atualizado_em": "2026-11-05"}, "configuracao": {}, "modelo_operacional": {"integracao": "alta", "padronizacao": "alta", "tipo": "unificacao", "justificativa": "As três empresas tratam o lead vindo de parceiro do mesmo jeito: vai direto ao closer, com retorno ao parceiro; só a comissão da Swallow difere, por ser por projeto.", "status": "confirmado", "evidencias": ["EV-0119", "EV-0009"]}, "fatos": [{"id": "F-001", "tema": "estrategia", "texto": "Princípio 1 (Por que o programa existe): O programa é um canal de aquisição mais barato que os canais ativos, julgado por duas medidas com o mesmo peso, em todas as fases: o CAC do Wise Partners e o valor devolvido ao parceiro. Comissão, regras e rituais existem para trazer clientes com custo menor sem deixar de entregar valor ao parceiro. O que aumenta a complexidade sem baixar o CAC, sem aumentar o valor devolvido ou sem aumentar a adesão sai.", "status": "confirmado", "evidencias": ["EV-0023", "EV-0027", "EV-0028", "EV-0037", "EV-0038", "EV-0039"]}, {"id": "F-002", "tema": "estrategia", "texto": "Princípio 2 (Por que o programa existe): Criar valor antes de capturar, e dividir o que se cria. O parceiro recebe demanda, conhecimento e reconhecimento antes do pedido de indicação; quem só extrai vira dono de pedágio e é abandonado.", "status": "confirmado", "evidencias": ["EV-0037", "EV-0040", "EV-0041", "EV-0042", "EV-0043", "EV-0035", "EV-0251"]}, {"id": "F-003", "tema": "estrategia", "texto": "Princípio 3 (Por que o programa existe): Uma interação central: a oportunidade compartilhada. Indicação, Prateleira, cruzamento e Base Ativa são portas para a mesma unidade de valor, numa esteira só.", "status": "confirmado", "evidencias": ["EV-0044", "EV-0045", "EV-0046"]}, {"id": "F-004", "tema": "estrategia", "texto": "Princípio 4 (Por que o programa existe): Ocupar pouco do ecossistema e liderar só onde há legitimidade. A Wise controla dois pontos (a relação com a indústria e a qualidade da oportunidade) e deixa o resto aos parceiros; segue onde o parceiro já tem programa próprio.", "status": "confirmado", "evidencias": ["EV-0047", "EV-0048", "EV-0049"]}, {"id": "F-005", "tema": "estrategia", "texto": "Princípio 5 (Como o programa se organiza): Interface simples e estável, operação mudando por dentro. Regra única de comissão, poucas regras aplicadas sempre do mesmo jeito, termo curto; a complexidade fica dentro do portal, nunca na frente do parceiro.", "status": "confirmado", "evidencias": ["EV-0024", "EV-0050", "EV-0051", "EV-0052"]}, {"id": "F-006", "tema": "estrategia", "texto": "Princípio 6 (Como o programa se organiza): O portal no centro da gestão: cada regra roda nele e o custo de servir cai a cada parceiro novo. O portal registra, calcula, alerta e monta pautas; a conversa fica no WhatsApp; primeiro se faz à mão e se entende, depois se automatiza.", "status": "confirmado", "evidencias": ["EV-0053", "EV-0054", "EV-0055", "EV-0056"]}, {"id": "F-007", "tema": "estrategia", "texto": "Princípio 7 (Como o programa se organiza): Atenção proporcional ao valor e ao potencial. Cadência humana para quem tem valor ou potencial alto; portal, comunidade e regras para os demais.", "status": "confirmado", "evidencias": ["EV-0057", "EV-0058", "EV-0059"]}, {"id": "F-008", "tema": "estrategia", "texto": "Princípio 8 (Como o programa se organiza): Todo sinal vira ação com dono e prazo, e só a exceção vira trabalho. O que segue a regra não gera card nem tarefa; o que foge dela vira uma tarefa do Gerente, com prazo.", "status": "confirmado", "evidencias": ["EV-0060", "EV-0061", "EV-0062"]}, {"id": "F-009", "tema": "estrategia", "texto": "Princípio 9 (Como o programa se relaciona): Primeiro valor em até 90 dias; o parceiro só conta quando ativa. A ativação (primeira indicação no ICP que virou reunião) é a linha que separa parceiro de contrato assinado.", "status": "confirmado", "evidencias": ["EV-0016", "EV-0063", "EV-0064"]}, {"id": "F-010", "tema": "estrategia", "texto": "Princípio 10 (Como o programa se relaciona): Fechar o ciclo com quem indica, em cada fase, e mostrar o impacto. O parceiro desanima quando não vê o que a indicação gerou. Cada mudança de etapa volta para ele, com o desfecho e o valor gerado.", "status": "confirmado", "evidencias": ["EV-0065", "EV-0066", "EV-0067", "EV-0068", "EV-0035", "EV-0229"]}, {"id": "F-011", "tema": "estrategia", "texto": "Princípio 11 (Como o programa se relaciona): Ensinar e equipar o parceiro a indicar. Perfil do cliente ideal, frases que reconhecem a dor, material de cada empresa do grupo e um gesto de indicação sem atrito.", "status": "confirmado", "evidencias": ["EV-0069", "EV-0070", "EV-0012", "EV-0035", "EV-0250"]}, {"id": "F-012", "tema": "estrategia", "texto": "Princípio 12 (Como o programa se relaciona): Norma social antes de norma de mercado. Na comunidade, o parceiro é reconhecido por status, rede e acesso; a comissão é a regra única e fica fora da conversa da comunidade.", "status": "confirmado", "evidencias": ["EV-0071", "EV-0072", "EV-0073", "EV-0035", "EV-0224"]}, {"id": "F-013", "tema": "estrategia", "texto": "Princípio 13 (Como o programa se relaciona): Reciprocidade visível: pedir de forma explícita, mostrar o dar e julgar pelo comportamento. A maior parte do dar nasce de um pedido. O equilíbrio entre indicações enviadas e recebidas é medido só por dentro, para a leitura do cubo; o parceiro nunca vê placar, e na comunidade aparece o dar, não a conta. Quem só toma é reconhecido pelo comportamento, não pela simpatia.", "status": "confirmado", "evidencias": ["EV-0074", "EV-0075", "EV-0043", "EV-0041", "EV-0033", "EV-0035", "EV-0224"]}, {"id": "F-014", "tema": "estrategia", "texto": "Princípio 14 (Como o programa se relaciona): Comunidade com ritual, começando pequena e manual. Cadência fixa, formato fixo e conteúdo variando; convite pessoa a pessoa; crescimento planejado, com o orgânico como bônus.", "status": "confirmado", "evidencias": ["EV-0076", "EV-0077", "EV-0078", "EV-0079", "EV-0035", "EV-0224"]}, {"id": "F-015", "tema": "estrategia", "texto": "Princípio 15 (Como o programa se relaciona): Construir a relação antes de precisar e mantê-la por cadência proporcional à importância. Cada parceiro e cada candidato tem um ritmo de contato (mensal, trimestral ou duas a três vezes por ano); cada contato leva algo de valor; depois de cada encontro, retorno em até 24 horas; quem sai da parceria continua na lista.", "status": "confirmado", "evidencias": ["EV-0093", "EV-0094", "EV-0095", "EV-0096", "EV-0097", "EV-0239"]}, {"id": "F-016", "tema": "estrategia", "texto": "Princípio 16 (Como o programa se relaciona): Ser a ponte entre parceiros e reunir as pessoas. A Wise apresenta parceiros entre si sem esperar pedido, sempre em torno de uma oportunidade específica, e recebe parceiros em encontros pequenos e presenciais, com um convidado âncora.", "status": "confirmado", "evidencias": ["EV-0098", "EV-0099", "EV-0100", "EV-0101", "EV-0102", "EV-0242"]}, {"id": "F-017", "tema": "estrategia", "texto": "Princípio 17 (Como o programa se relaciona): Pessoa a pessoa, nunca em massa, e com respeito também na saída. Mensagens que o portal prepara saem personalizadas pelo Gerente; compromissos ficam claros para os dois lados; quem deixa o programa é tratado como alguém que continua na rede.", "status": "confirmado", "evidencias": ["EV-0103", "EV-0104", "EV-0105", "EV-0239"]}, {"id": "F-018", "tema": "estrategia", "texto": "Princípio 18 (Como o programa se mede e evolui): Medir o ecossistema inteiro e cada parceiro por fatores objetivos. Três medidas de saúde do programa e um cubo de três fatores por parceiro, calculados pelo portal, no lugar da percepção.", "status": "confirmado", "evidencias": ["EV-0080", "EV-0081", "EV-0082", "EV-0083", "EV-0035", "EV-0129"]}, {"id": "F-019", "tema": "estrategia", "texto": "Princípio 19 (Como o programa se mede e evolui): Crescer por fases, com portões de evidência. Os três pilares ficam abertos; o que o portão controla é o ritmo de escala (parceiros, categorias, regiões, pessoas).", "status": "confirmado", "evidencias": ["EV-0084", "EV-0085", "EV-0086", "EV-0087", "EV-0035", "EV-0028"]}, {"id": "F-020", "tema": "estrategia", "texto": "Princípio 20 (Como o programa se mede e evolui): Ritmos fixos substituem quadros. Diário, semanal, mensal, trimestral e anual, com pauta montada pelo portal.", "status": "confirmado", "evidencias": ["EV-0088", "EV-0089", "EV-0076"]}, {"id": "F-021", "tema": "estrategia", "texto": "Princípio 21 (Como o programa se mede e evolui): Governança clara: dono único, regras visíveis, negociação por princípios e saída prevista. O Gerente é o dono do programa, negocia com autonomia num texto único e decide o desligamento; o Igor assina o termo e o aviso formal e revê o programa toda semana com o Gerente; a saída é um resultado válido, prevista no termo.", "status": "confirmado", "evidencias": ["EV-0007", "EV-0025", "EV-0034", "EV-0090", "EV-0091", "EV-0092"]}, {"id": "F-022", "tema": "oferta", "texto": "Duas parcerias: a Comercial, com três pacotes por nível (C Prateleira, B Formação e A Base Ativa) e contrapartidas dos dois lados, e a Institucional, para entidades que reúnem indústrias. Os três pilares existem desde o início, mas a entrega sobe em escada: o pacote C (Prateleira, indicação e grupo) vale para todos; o B (certificado, Hub, mentoria, eventos e formações) para Premium e Elite que divulgam à própria base; o A (Base Ativa) só para Elite, conforme as horas. O que o parceiro recebe acompanha o que ele consegue devolver, e abrir mais é orgânico, conforme a relação cresce.", "status": "confirmado", "evidencias": ["EV-0108", "EV-0018", "EV-0019", "EV-0020", "EV-0109", "EV-0084", "EV-0110"]}, {"id": "F-023", "tema": "estrategia", "texto": "Interação central: uma indústria com necessidade conhecida encontra, com contexto, quem resolve; a unidade de valor é a oportunidade compartilhada, com quatro portas (indicação por link, Prateleira, cruzamento de carteiras, Base Ativa).", "status": "confirmado", "evidencias": ["EV-0044", "EV-0045", "EV-0046"]}, {"id": "F-024", "tema": "estrategia", "texto": "Papel da Wise: orquestradora de um ecossistema pequeno; controla a relação com a indústria e a qualidade da oportunidade; lidera onde a demanda do grupo dá legitimidade e segue onde o parceiro tem programa próprio.", "status": "confirmado", "evidencias": ["EV-0047", "EV-0111", "EV-0049"]}, {"id": "F-025", "tema": "proposta_de_valor", "texto": "Arquitetura de valor para a indústria em cinco elementos: Descobrir, Comparar e decidir, Implantar integrado, Pertencer e aprender, Confiar; cada pilar e cada parceiro preenche elementos.", "status": "confirmado", "evidencias": ["EV-0112", "EV-0113"]}, {"id": "F-026", "tema": "proposta_de_valor", "texto": "Valor ao parceiro: demanda de volta pela Prateleira, carteira ativa pelo Base Ativa, conhecimento para vender as três empresas do grupo (kit e simulador de ganho), comunidade e reconhecimento, e comissão por regra única.", "status": "confirmado", "evidencias": ["EV-0012", "EV-0114", "EV-0023"]}, {"id": "F-027", "tema": "parceiro", "texto": "Rede de valor: cada parceiro pode ser complementador, concorrente parcial, cliente ou fornecedor ao mesmo tempo; o papel é registrado por escopo e o termo separa regras de cooperação e de divisão.", "status": "confirmado", "evidencias": ["EV-0047", "EV-0115", "EV-0116"]}, {"id": "F-028", "tema": "cliente", "texto": "Dois clientes: a indústria, consumidora final, e o parceiro, cliente do programa, que recebe valor antes de ouvir o pedido.", "status": "declarado", "evidencias": ["EV-0017", "EV-0117"]}, {"id": "F-029", "tema": "receita", "texto": "Comissão por regra única, sem exceção: 40% da primeira mensalidade ao parceiro e 10% ao Gerente na Wise Makers e na Tríade; 6% e 2% do projeto na Swallow. Sobre o LTV, fica entre 2% e 4% para clientes de 12 a 24 meses. O dinheiro é igual para todos; o que varia por tipo de parceiro é o não monetário (acesso, palco, apoio). A regra é revista depois de dois trimestres com dados de permanência dos clientes indicados.", "status": "confirmado", "evidencias": ["EV-0024", "EV-0118", "EV-0119", "EV-0029", "EV-0120", "EV-0121"]}, {"id": "F-030", "tema": "receita", "texto": "Nada é cobrado do parceiro. Para entrar num pedido da Prateleira, o fornecedor dá uma contrapartida não financeira (ação conjunta ou condição comercial para a indústria).", "status": "confirmado", "evidencias": ["EV-0023", "EV-0122"]}, {"id": "F-031", "tema": "receita", "texto": "Duas medidas-mãe, lado a lado e com o mesmo peso em todas as fases: o CAC do Wise Partners (comissões, horas e custos diretos divididos pelos clientes fechados vindos de parceiros; ninguém informa o CAC de outros canais) e o valor devolvido ao parceiro (desfechos devolvidos, oportunidades enviadas de volta, apresentações feitas e acessos dados).", "status": "confirmado", "evidencias": ["EV-0027", "EV-0028", "EV-0023", "EV-0123", "EV-0037"]}, {"id": "F-032", "tema": "receita", "texto": "O CAC se lê pela tendência, trimestre contra trimestre, no painel da semana; a meta, quando houver, é do Igor.", "status": "confirmado", "evidencias": ["EV-0031", "EV-0027", "EV-0006", "EV-0028"]}, {"id": "F-033", "tema": "canal", "texto": "Canais: a comunidade Wise Partners no WhatsApp para a conversa; o portal com a face interna (operada pelo Gerente) e a do parceiro (kit, simulador, trilhas, oportunidades, regras).", "status": "confirmado", "evidencias": ["EV-0012", "EV-0124"]}, {"id": "F-034", "tema": "estrategia", "texto": "Parceiro conta quando ativa: primeira indicação no ICP que virou reunião.", "status": "confirmado", "evidencias": ["EV-0021", "EV-0064"]}, {"id": "F-035", "tema": "recurso", "texto": "O programa registra o tempo dedicado e o custo de servir cada parceiro; horas e metas numéricas ficam para depois, e o Diretor define as metas.", "status": "confirmado", "evidencias": ["EV-0022", "EV-0006"]}, {"id": "F-036", "tema": "modelo_operacional", "texto": "Lead vindo de parceiro vai direto ao closer da empresa do grupo; o Gerente conversa com o closer quando há indicação ou proposta nova, sem SLA interno nem sistema para o closer; cada closer avisa o Gerente por WhatsApp a cada mudança de etapa, e o Gerente registra no portal. Toda semana, o Gerente revê o programa com o Igor num painel simples, caso a caso.", "status": "confirmado", "evidencias": ["EV-0009", "EV-0025", "EV-0026"]}, {"id": "F-037", "tema": "estrategia", "texto": "Saúde do programa em três medidas: produtividade (oportunidades e clientes por parceiro ativo e o CAC caindo), robustez (parceiros ativos que continuam ativos e a base que não depende de um só) e criação de nicho (categorias e tipos de parceiro novos que geram valor).", "status": "confirmado", "evidencias": ["EV-0125", "EV-0126", "EV-0127", "EV-0128"]}, {"id": "F-038", "tema": "parceiro", "texto": "Cada parceiro é lido em três fatores binários (Valor, Ritmo e Relação), que formam um cubo de oito tipos com ação, abordagem e cadência próprias; o Potencial não define o tipo, só a atenção.", "status": "confirmado", "evidencias": ["EV-0129", "EV-0130", "EV-0082", "EV-0131", "EV-0132", "EV-0133"]}, {"id": "F-039", "tema": "estrategia", "texto": "Fases e portões, com CAC e valor devolvido lado a lado em todas as fases. Experimentação para Tração, medida por um trimestre: 5 parceiros ativados; desfecho devolvido ao parceiro em toda oportunidade; 3 clientes fechados vindos de parceiros; CAC do Wise Partners apurado no trimestre; metade das oportunidades qualificadas virando reunião; rituais rodando dois trimestres iguais. Tração para Crescimento: 15 parceiros ativos com 40% em Ritmo alto; CAC do Wise Partners caindo dois trimestres seguidos; valor devolvido aos parceiros crescendo dois trimestres seguidos; metade das conversas da comunidade iniciadas por parceiros; 80% dos ativos seguindo ativos depois de dois trimestres. Os números são provisórios e se calibram na primeira revisão trimestral com dados reais.", "status": "confirmado", "evidencias": ["EV-0134", "EV-0028", "EV-0027", "EV-0038", "EV-0135", "EV-0136"]}, {"id": "F-040", "tema": "proposta_de_valor", "texto": "Para parceiros de software de gestão (CRM, ERP e afins), o valor central da Wise é a retenção da base deles: o cliente com processo comercial bom usa melhor o software e continua pagando. Por isso a entrega da Wise passa a fazer parte do processo do parceiro, e não fica só como indicação.", "status": "hipotese", "evidencias": ["EV-0290", "EV-0291", "EV-0037", "EV-0042"]}, {"id": "F-041", "tema": "oferta", "texto": "Entregável padrão para o parceiro oferecer aos clientes dele: reunião de diagnóstico comercial gratuita, de 40 a 60 minutos, que termina com um mapa de planejamento; depois do diagnóstico, o cliente ganha acesso ao Wise Hub. O diagnóstico é a quinta porta de oportunidade do programa.", "status": "hipotese", "evidencias": ["EV-0292", "EV-0293", "EV-0063", "EV-0294"]}, {"id": "F-042", "tema": "oferta", "texto": "O Wise Hub não é oferecido sozinho, como publicidade: plataforma de aulas sem contato gera pouco engajamento e perde valor. O acesso vem depois de um contato com a Wise (o diagnóstico ou o pacote B).", "status": "hipotese", "evidencias": ["EV-0295", "EV-0296", "EV-0109"]}, {"id": "F-043", "tema": "estrategia", "texto": "Campanha de lançamento até março: o diagnóstico é ligado ao projeto de pesquisa do Gerente sobre maturidade comercial e CRM, que precisa de 50 entrevistas de cerca de 40 minutos, e os parceiros convidam os clientes deles a participar, com o diagnóstico e o acesso ao Wise Hub como retorno.", "status": "hipotese", "evidencias": ["EV-0297", "EV-0298", "EV-0299"]}, {"id": "F-044", "tema": "receita", "texto": "Cliente que contrata a Wise depois de um diagnóstico oferecido pelo parceiro conta como indicação do parceiro e gera a comissão da regra única.", "status": "hipotese", "evidencias": ["EV-0300", "EV-0024", "EV-0301"]}, {"id": "F-045", "tema": "parceiro", "texto": "Na fase de Experimentação, o recrutamento foca num segmento só: software de gestão para empresas (CRM e ERP à frente). Agências ficam fora porque concorrem com a Wise. O ecossistema continua pequeno: não é para milhares de parceiros.", "status": "hipotese", "evidencias": ["EV-0302", "EV-0303", "EV-0304", "EV-0305", "EV-0306"]}, {"id": "F-046", "tema": "parceiro", "texto": "Categorias de parceiro e da Prateleira citadas na conversa. Comerciais: ERP, CRM, PCP, SST, ESG, EPM, consultoria de gestão, design, tecnologia digital, infraestrutura e data center, dados e ciência de dados, software de gestão de manutenção, automação industrial, qualidade e laboratório, eficiência energética, segurança da informação, comércio exterior e logística internacional, jurídico, tributário, contabilidade consultiva e RH. Institucionais: federações e confederações, Sistema S, institutos, associações comerciais e empresariais, associações setoriais, secretarias de indústria e comércio, sindicatos patronais, parques tecnológicos e universidades.", "status": "hipotese", "evidencias": ["EV-0307", "EV-0308"]}, {"id": "F-047", "tema": "recurso", "texto": "Primeira entrega do portal com o to-be: o núcleo pequeno que sustenta a operação, e o resto entra conforme o programa ganha liquidez.", "status": "hipotese", "evidencias": ["EV-0084", "EV-0309", "EV-0055"]}], "ofertas": [{"id": "OF-01", "nome": "Parceria Comercial", "tipo": "servico", "clientes": ["Empresas que vendem para a mesma indústria (softwares e serviços)"], "canais": ["Comunidade Wise Partners no WhatsApp", "Portal do parceiro", "Link exclusivo"], "status": "declarado", "evidencias": ["EV-0106"]}, {"id": "OF-02", "nome": "Parceria Institucional", "tipo": "servico", "clientes": ["Associações, feiras e entidades que reúnem indústrias"], "canais": ["Eventos e calendário da entidade"], "status": "declarado", "evidencias": ["EV-0107"]}], "cadeias_de_valor": [{"id": "CV-01", "nome": "Jornada do parceiro: do candidato ao parceiro em crescimento", "gatilho": "Candidato identificado", "valor": "Parceiro ativo, gerando e recebendo oportunidades", "stakeholder": "Empresa parceira", "ofertas": ["OF-01", "OF-02"], "etapas": [{"nome": "Atrair e selecionar", "processos": ["P-20"]}, {"nome": "Integrar e ativar", "processos": ["P-26"]}, {"nome": "Desenvolver", "processos": ["P-40"]}, {"nome": "Pertencer", "processos": ["P-47"]}, {"nome": "Reter ou encerrar", "processos": ["P-54"]}], "status": "confirmado", "evidencias": ["EV-0159", "EV-0060"]}, {
