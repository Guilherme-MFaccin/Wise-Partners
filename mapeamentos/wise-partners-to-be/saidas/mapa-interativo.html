<!doctype html>
<html lang="pt-BR">

<meta charset="utf-8">

<body>
<title>Processos Programa Wise Partners (to-be)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cabeçalho com medidores, abas de visão, área principal e painel de detalhe à direita (vira folha inferior no celular). */
:root {
  --paper: #F3F5F7;
  --surface: #FFFFFF;
  --surface-2: #F8FAFB;
  --ink: #15202B;
  --muted: #586472;
  --line: #D8DEE5;
  --accent: #1D5C8F;
  --accent-soft: #E2EDF7;
  --ok: #2F8F4E; --ok-bg: #DDF3E4;
  --decl: #96690A; --decl-bg: #FFF1C2;
  --hip: #727B86; --hip-bg: #FFFFFF;
  --cont: #C0392B; --cont-bg: #FCE3E1;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E141A; --surface: #161F28; --surface-2: #1B2530; --ink: #E5EAF0; --muted: #9AA6B3; --line: #2B3744;
    --accent: #84B6E6; --accent-soft: #1A2B3B;
    --ok: #63C584; --ok-bg: #15301F; --decl: #E3BA4F; --decl-bg: #33290E; --hip: #A0A9B3; --hip-bg: #161F28; --cont: #F08A7E; --cont-bg: #3A1A17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E141A; --surface: #161F28; --surface-2: #1B2530; --ink: #E5EAF0; --muted: #9AA6B3; --line: #2B3744;
  --accent: #84B6E6; --accent-soft: #1A2B3B;
  --ok: #63C584; --ok-bg: #15301F; --decl: #E3BA4F; --decl-bg: #33290E; --hip: #A0A9B3; --hip-bg: #161F28; --cont: #F08A7E; --cont-bg: #3A1A17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; max-width: 1480px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 800; }
h2 { font-size: 1.25rem; font-weight: 800; }
h3 { font-size: 1rem; font-weight: 600; }
.mono { font-family: var(--f-mono); font-size: 0.85em; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Cabeçalho */
header.topo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.72rem; color: var(--muted); font-weight: 700; }
.medidores { display: flex; gap: 18px; flex-wrap: wrap; }
.medidor { min-width: 170px; }
.medidor .rot { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }
.medidor .num { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; color: var(--ink); }
.barra { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.barra.ok > i { background: var(--ok); }
.contagens { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 0.8rem; white-space: nowrap; }
.chip b { font-variant-numeric: tabular-nums; }

/* Legenda e abas */
.barra-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 14px 0 16px; }
nav.abas { display: flex; gap: 4px; flex-wrap: wrap; }
nav.abas a { text-decoration: none; color: var(--muted); padding: 7px 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; }
nav.abas a[aria-current="page"] { background: var(--ink); color: var(--paper); }
nav.abas a:hover:not([aria-current="page"]) { background: var(--accent-soft); color: var(--ink); }
.legenda { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 0.78rem; color: var(--muted); }

/* Selos de status */
.selo { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; border: 1.5px solid; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em; }
.selo.confirmado { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); }
.selo.declarado { color: var(--decl); background: var(--decl-bg); border-color: var(--decl); }
.selo.hipotese { color: var(--hip); background: var(--hip-bg); border-color: var(--hip); border-style: dashed; }
.selo.contestado { color: var(--cont); background: var(--cont-bg); border-color: var(--cont); }
.ponto { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; border: 1.5px solid; }
.ponto.confirmado { background: var(--ok); border-color: var(--ok); }
.ponto.declarado { background: var(--decl); border-color: var(--decl); }
.ponto.hipotese { background: transparent; border-color: var(--hip); border-style: dashed; }
.ponto.contestado { background: var(--cont); border-color: var(--cont); }

/* Grade principal com painel */
.grade { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
.grade.sem-painel { grid-template-columns: minmax(0, 1fr); }
main { min-width: 0; }
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.secao + .secao { margin-top: 18px; }
.titulo-secao { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }

/* Cadeia de valor */
.banda { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 14px; align-items: center; }
.banda + .banda { margin-top: 10px; }
.banda .nome-banda { font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; }
.banda .nome-banda small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 0.75rem; color: var(--muted); }
.fileira { display: flex; gap: 8px; flex-wrap: wrap; }
.macro { text-align: left; cursor: pointer; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 170px; flex: 1 1 170px; max-width: 280px; display: grid; gap: 6px; }
.macro:hover { border-color: var(--accent); }
.macro.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.macro .cab { display: flex; justify-content: space-between; gap: 6px; align-items: start; }
.macro .nome { font-weight: 700; line-height: 1.25; }
.macro .rodape { display: flex; justify-content: space-between; gap: 6px; font-size: 0.75rem; color: var(--muted); }
.macro.confirmado { border-color: var(--ok); background: var(--ok-bg); }
.macro.declarado { border-color: var(--decl); background: var(--decl-bg); }
.macro.hipotese { border-style: dashed; border-color: var(--hip); background: var(--hip-bg); }
.macro.contestado { border-color: var(--cont); background: var(--cont-bg); }
.macro.chevron { clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%, 12px 50%); padding-left: 24px; padding-right: 26px; border: none; }
.macro.chevron.hipotese { background: repeating-linear-gradient(135deg, var(--hip-bg) 0 10px, var(--surface-2) 10px 20px); }
.macro.chevron.sel, .macro.chevron:hover { filter: brightness(0.96); box-shadow: none; outline: 2px solid var(--accent); outline-offset: -2px; }
.tag.papel { color: var(--decl); border-color: var(--decl); border-style: dashed; }
.macro.chevron:first-child { clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%); padding-left: 14px; }
.cv { margin-top: 18px; }
.cv-etapas { display: flex; gap: 0; overflow-x: auto; padding-bottom: 4px; }
.cv-etapa { flex: 1 0 150px; padding: 10px 12px; border-top: 3px solid var(--accent); background: var(--surface-2); margin-right: 4px; }
.cv-etapa .n { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); }
.lnk { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 2px; }

/* Hierarquia */
.ferramentas { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.ferramentas input[type="search"] { flex: 1 1 220px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.btn { padding: 7px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.btn.prim { background: var(--accent); border-color: var(--accent); color: var(--surface); }
a.btn { text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; }
.filtro { display: inline-flex; align-items: center; gap: 5px; font-size: 0.8rem; padding: 4px 8px; border: 1px solid var(--line); border-radius: 99px; cursor: pointer; background: var(--surface); }
.filtro input { margin: 0; }
.arvore { list-style: none; margin: 0; padding: 0; }
.arvore ul { list-style: none; margin: 0; padding-left: 22px; border-left: 1px dashed var(--line); margin-left: 9px; }
.no { display: grid; grid-template-columns: 20px auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.no:hover { background: var(--accent-soft); }
.no.sel { background: var(--accent-soft); outline: 1.5px solid var(--accent); }
.no .seta { width: 20px; height: 20px; border: none; background: none; cursor: pointer; color: var(--muted); padding: 0; }
.no .cod { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); }
.no .nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.no .nm small { font-weight: 400; color: var(--muted); }
.no .tags { display: flex; gap: 4px; align-items: center; }
.tag { font-size: 0.7rem; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.falta { color: var(--cont); border-color: color-mix(in srgb, var(--cont) 40%, transparent); }
.grupo-tipo { margin: 14px 0 4px; }

/* Fluxos */
.fluxos { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px; }
.lista-fluxos { display: grid; gap: 6px; align-content: start; }
.lista-fluxos button { text-align: left; padding: 8px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; display: grid; gap: 2px; }
.lista-fluxos button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tela-bpmn { height: 460px; background: #FFFFFF; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; position: relative; }
.tela-bpmn .aviso { position: absolute; inset: 0; display: grid; place-items: center; color: #586472; padding: 20px; text-align: center; }
.frases { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; }
.frases li { padding: 8px 10px; background: var(--surface-2); border-radius: 8px; border-left: 3px solid var(--line); }
.frases li.ini, .frases li.fim { border-left-color: var(--accent); }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }

/* Tabelas */
.tabela-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
td.c { text-align: center; }
.matriz th.rot { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; height: 190px; text-transform: none; letter-spacing: 0; font-size: 0.78rem; }

/* Negócio */
.canvas { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.bloco { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; align-content: start; }
.bloco.vazio { border-style: dashed; }
.fato { display: grid; gap: 4px; font-size: 0.88rem; }
.quadrante { display: grid; grid-template-columns: 22px repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, 96px) 24px; gap: 4px; max-width: 480px; font-size: 0.8rem; }
.quadrante .q { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; display: grid; align-content: space-between; }
.quadrante .q.atual { background: var(--accent-soft); border: 2px solid var(--accent); }
.quadrante .eixo { color: var(--muted); font-size: 0.72rem; display: grid; place-items: center; }
.quadrante .eixo.v { writing-mode: vertical-rl; transform: rotate(180deg); grid-row: 1 / span 2; white-space: nowrap; }

/* Painel de detalhe */
aside.painel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; }
.painel .fechar { float: right; }
.campo { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.campo:last-child { border-bottom: none; }
.campo .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; display: flex; gap: 6px; align-items: center; }
.campo .v { overflow-wrap: anywhere; }
.campo.falta .v { color: var(--cont); font-style: italic; }
.campo.hip .v { color: var(--hip); font-style: italic; }
.ev { border-left: 3px solid var(--line); padding: 6px 10px; margin: 6px 0; background: var(--surface-2); border-radius: 0 6px 6px 0; font-size: 0.86rem; }
.ev q { quotes: "\201C" "\201D"; }
.ev .fonte { display: block; font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
.vazio-msg { color: var(--muted); font-style: italic; }
.rodape-pag { margin-top: 28px; font-size: 0.78rem; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

@media (max-width: 1080px) {
  .grade { grid-template-columns: minmax(0, 1fr); }
  aside.painel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; max-height: 70vh; border-radius: 14px 14px 0 0; z-index: 20; box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.18); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (max-width: 720px) {
  header.topo { grid-template-columns: minmax(0, 1fr); }
  .banda { grid-template-columns: minmax(0, 1fr); }
  .fluxos { grid-template-columns: minmax(0, 1fr); }
  .macro { max-width: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  --space-tool-crosshair-stroke-color: var(--color-black);

  --tooltip-error-background-color: var(--color-red-360-100-97);
  --tooltip-error-border-color: var(--color-red-360-100-45);
  --tooltip-error-color: var(--color-red-360-100-45);

  --hover-tooltip-font-family: "IBM Plex Sans", sans-serif;
  --hover-tooltip-font-size: 12px;
  --hover-tooltip-secondary-font-size: 11px;
  --hover-tooltip-background-color: var(--color-grey-225-10-15);
  --hover-tooltip-color: var(--color-white);
  --hover-tooltip-shadow-color: var(--color-black-opacity-10);

  --palette-tooltip-shortcut-background-color: var(--color-grey-225-10-35);
}

/**
 * SVG styles
 */

.djs-container svg.drop-not-ok {
  background: var(--shape-drop-not-allowed-fill-color) !important;
}

.djs-container svg.new-parent {
  background: var(--shape-drop-allowed-fill-color) !important;
}

.djs-container svg:focus {
  outline-offset: -1px;
}

/**
 * outline styles
 */

.djs-outline,
.djs-selection-outline {
  fill: none;
  shape-rendering: geometricPrecision;
  stroke-width: 2px;
}

.djs-outline {
  visibility: hidden;
}

.djs-selection-outline {
  stroke: var(--element-selected-outline-stroke-color);
}

.djs-element.selected .djs-outline {
  visibility: visible;

  stroke: var(--element-selected-outline-stroke-color);
}

.djs-connection.selected .djs-outline {
  display: none;
}

.djs-multi-select .djs-element.selected .djs-outline,
.djs-dragging-active-lasso .djs-element.selected .djs-outline {
  stroke: var(--element-selected-outline-secondary-stroke-color);
  display: block;
}

.djs-outline-hidden .djs-outline {
  display: none !important;
}

.djs-shape.connect-ok .djs-visual > :nth-child(1) {
  fill: var(--shape-connect-allowed-fill-color) !important;
}

.djs-shape.connect-not-ok .djs-visual > :nth-child(1),
.djs-shape.drop-not-ok .djs-visual > :nth-child(1) {
  fill: var(--shape-drop-not-allowed-fill-color) !important;
}

.djs-shape.new-parent .djs-visual > :nth-child(1) {
  fill: var(--shape-drop-allowed-fill-color) !important;
}


/* Override move cursor during drop and connect */
.drop-not-ok,
.connect-not-ok,
.drop-not-ok *,
.connect-not-ok * {
  cursor: not-allowed !important;
}

.drop-ok,
.connect-ok,
.drop-ok *,
.connect-ok * {
  cursor: default !important;
}

.djs-element.attach-ok .djs-visual > :nth-child(1) {
  stroke-width: 5px !important;
  stroke: var(--shape-attach-allowed-stroke-color) !important;
}

.djs-frame.connect-not-ok .djs-visual > :nth-child(1),
.djs-frame.drop-not-ok .djs-visual > :nth-child(1) {
  stroke-width: 3px !important;
  stroke: var(--shape-drop-not-allowed-fill-color) !important;
  fill: none !important;
}

/**
* Selection box style
*
*/
.djs-lasso-overlay {
  fill: var(--lasso-fill-color);
  stroke: var(--lasso-stroke-color);
  stroke-width: 2px;
  shape-rendering: geometricPrecision;
  pointer-events: none;
}

/**
 * Resize styles
 */
.djs-resize-overlay {
  fill: none;

  stroke-dasharray: 5 1 3 1;
  stroke: var(--shape-resize-preview-stroke-color);

  pointer-events: none;
}

.djs-resizer-hit {
  fill: none;
  pointer-events: all;
}

.djs-resizer-visual {
  fill: var(--resizer-fill-color);
  stroke-width: 1px;
  stroke: var(--resizer-stroke-color);
  shape-rendering: geometricPrecision;
}

.djs-resizer:hover .djs-resizer-visual {
  stroke: var(--resizer-stroke-color);
  stroke-opacity: 1;
}

.djs-cursor-resize-ns,
.djs-resizer-n,
.djs-resizer-s {
  cursor: ns-resize;
}

.djs-cursor-resize-ew,
.djs-resizer-e,
.djs-resizer-w {
  cursor: ew-resize;
}

.djs-cursor-resize-nwse,
.djs-resizer-nw,
.djs-resizer-se {
  cursor: nwse-resize;
}

.djs-cursor-resize-nesw,
.djs-resizer-ne,
.djs-resizer-sw {
  cursor: nesw-resize;
}

.djs-shape.djs-resizing > .djs-outline {
  visibility: hidden !important;
}

.djs-shape.djs-resizing > .djs-resizer {
  visibility: hidden;
}

.djs-dragger > .djs-resizer {
  visibility: hidden;
}

/**
 * drag styles
 */
.djs-dragger * {
  fill: none !important;
  stroke: var(--element-dragger-color) !important;
}

.djs-dragger tspan,
.djs-dragger text {
  fill: var(--element-dragger-color) !important;
  stroke: none !important;
}

.djs-dragger marker circle,
.djs-dragger marker path,
.djs-dragger marker polygon,
.djs-dragger marker polyline,
.djs-dragger marker rect {
  fill: var(--element-dragger-color) !important;
  stroke: none !important;
}

.djs-dragger marker text,
.djs-dragger marker tspan {
  fill: none !important;
  stroke: var(--element-dragger-color) !important;
}

.djs-dragging,
.djs-dragging > * {
  opacity: 0.3 !important;
  pointer-events: none !important;
}

/**
 * no pointer events for visual
 */
.djs-visual,
.djs-outline {
  pointer-events: none;
}

.djs-element.attach-ok .djs-hit {
  stroke-width: 60px !important;
}

/**
 * all pointer events for hit shape
 */
.djs-element > .djs-hit-all,
.djs-element > .djs-hit-no-move {
  pointer-events: all;
}

.djs-element > .djs-hit-stroke,
.djs-element > .djs-hit-click-stroke {
  pointer-events: stroke;
}

/**
 * shape / connection basic styles
 */
.djs-connection .djs-visual {
  stroke-width: 2px;
  fill: none;
}

.djs-cursor-grab {
  cursor: -webkit-grab;
  cursor: -moz-grab;
  cursor: grab;
}

.djs-cursor-grabbing {
  cursor: -webkit-grabbing;
  cursor: -moz-grabbing;
  cursor: grabbing;
}

.djs-cursor-crosshair {
  cursor: crosshair;
}

.djs-cursor-move {
  cursor: move;
}

.djs-cursor-resize-ns {
  cursor: ns-resize;
}

.djs-cursor-resize-ew {
  cursor: ew-resize;
}


/**
 * snapping
 */
.djs-snap-line {
  stroke: var(--snap-line-stroke-color);
  stroke-linecap: round;
  stroke-width: 2px;
  pointer-events: none;
}

/**
 * snapping
 */
.djs-crosshair {
  stroke: var(--space-tool-crosshair-stroke-color);
  stroke-linecap: round;
  stroke-width: 1px;
  pointer-events: none;
  shape-rendering: geometricPrecision;
  stroke-dasharray: 5, 5;
}

/**
 * palette
 */

.djs-palette {
  position: absolute;
  left: 20px;
  top: 20px;

  box-sizing: border-box;
  width: 48px;
}

.djs-palette .separator {
  margin: 5px;
  padding-top: 5px;

  border: none;
  border-bottom: solid 1px var(--palette-separator-color);

  clear: both;
}

.djs-palette .entry:before {
  vertical-align: initial;
}

.djs-palette .djs-palette-toggle {
  cursor: pointer;
}

.djs-palette .entry,
.djs-palette .djs-palette-toggle {
  color: var(--palette-entry-color);
  font-size: 30px;

  text-align: center;
}

.djs-palette .entry {
  float: left;
}

.djs-palette .entry img {
  max-width: 100%;
}

.djs-palette .djs-palette-entries:after {
  content: '';
  display: table;
  clear: both;
}

.djs-palette .djs-palette-toggle:hover {
  background: var(--palette-toggle-hover-background-color);
}

.djs-palette .entry:hover {
  color: var(--palette-entry-hover-color);
}

.djs-palette .highlighted-entry {
  color: var(--palette-entry-selected-color) !important;
}

.djs-palette .entry,
.djs-palette .djs-palette-toggle {
  width: 46px;
  height: 46px;
  line-height: 46px;
  cursor: default;
}

/**
 * Palette open / two-column layout is controlled via
 * classes on the palette. Events to hook into palette
 * changed life-cycle are available in addition.
 */
.djs-palette.two-column.open {
  width: 94px;
}

.djs-palette:not(.open) .djs-palette-entries {
  display: none;
}

.djs-palette:not(.open) {
  overflow: hidden;
}

.djs-palette.open .djs-palette-toggle {
  display: none;
}

.djs-hover-tooltip {
  position: fixed;
  z-index: 1000;

  display: flex;
  align-items: center;
  gap: 6px;

  padding: 6px 10px;
  border-radius: 4px;

  background-color: var(--hover-tooltip-background-color);
  color: var(--hover-tooltip-color);

  font-family: var(--hover-tooltip-font-family);
  font-size: var(--hover-tooltip-font-size);
  line-height: 1.2;
  white-space: nowrap;

  pointer-events: none;
  box-shadow: 0 1px 4px var(--hover-tooltip-shadow-color);
}

.djs-hover-tooltip--right {
  transform: translateY(-50%);
}

.djs-hover-tooltip--top {
  transform: translate(-50%, -100%);
}

.djs-palette-tooltip-shortcut {
  padding: 1px 5px;

  border-radius: 3px;

  background-color: var(--palette-tooltip-shortcut-background-color);

  font-family: monospace;
  font-size: var(--hover-tooltip-secondary-font-size);
  line-height: 1.2;
}

/**
 * context-pad
 */
.djs-context-pad {
  position: absolute;
  display: none;
  pointer-events: none;
  line-height: 1;
  width: 72px;
  z-index: 100;
}

.djs-context-pad .entry {
  width: 22px;
  height: 22px;
  text-align: center;
  display: inline-block;
  font-size: 22px;
  margin: 0 2px 2px 0;

  border-radius: 3px;

  cursor: default;

  background-color: var(--context-pad-entry-background-color);
  box-shadow: 0 0 2px 1px var(--context-pad-entry-background-color);
  pointer-events: all;
  vertical-align: middle;
}

.djs-context-pad .entry:hover {
  background: var(--context-pad-entry-hover-background-color);
}

.djs-context-pad.open {
  display: block;
}

/**
 * popup styles
 */
.djs-popup {
  line-height: 1;
  box-sizing: border-box;
  background: var(--popup-background-color);
  overflow: hidden;
  position: fixed;
  z-index: 200;
  box-shadow: 0px 2px 6px var(--popup-shadow-color);
  border: solid 1px var(--popup-border-color);
  min-width: 120px;
  max-width: 300px;
  outline: none;
  font-size: var(--popup-font-size);
  font-family: var(--popup-font-family);
}

.djs-popup-search input {
  width: 100%;
  box-sizing: border-box;
  font-size: var(--popup-font-size);
  padding: 3px 6px 3px 28px;
  border-radius: 2px;
  border: solid 1px var(--popup-search-border-color);
  line-height: 21px;
}

.djs-popup-search input:focus {
  background-color: var(--popup-search-focus-background-color);
  border: solid 1px var(--popup-search-focus-border-color);
  outline: none;
}

.djs-popup-header {
  display: flex;
  align-items: stretch;
  line-height: 20px;
  margin: 10px 12px 10px 12px;
}

.djs-popup-header .entry {
  border-radius: 2px;
}

.djs-popup button.entry {
  padding: 0;
  background: transparent;
  border: 0;
}

.djs-popup-header .entry.active {
  color: var(--popup-header-entry-selected-color);
}

.djs-popup-header .entry.disabled {
  color: inherit;
}

.djs-popup-header-group {
  display: flex;
  flex-direction: row;
  align-items: center;
  list-style: none;
  margin: 0;
  padding: 0;
}

.djs-popup-header-group .entry {
  display: flex;
  flex-direction: row;
  align-items: center;
}

.djs-popup-header-group + .djs-popup-header-group:before {
  content: '';
  width: 1px;
  height: 20px;
  background: var(--popup-header-group-divider-color);
  margin: 0 5px;
}

.djs-popup-search {
  position: relative;
  width: auto;
  margin: 10px 12px;
}

.djs-popup-tabs-container {
  position: relative;
  border-bottom: solid 1px var(--popup-tab-strip-border-color);
}

/**
 * The scroll control doubles as the edge fade: tabs scrolled past it fade out
 * rather than being cut off behind an opaque block.
 */
.djs-popup-tabs-scroll {
  appearance: none;
  position: absolute;
  top: 0;
  bottom: 1px;
  width: 28px;
  display: flex;
  align-items: center;
  padding: 0;
  border: none;
  border-radius: 0;
  color: var(--popup-tab-color);
  cursor: pointer;
}

.djs-popup-tabs-scroll:hover {
  color: var(--popup-tab-hover-color);
}

.djs-popup-tabs-scroll-start {
  left: 0;
  justify-content: flex-start;
  background: linear-gradient(to left, transparent, var(--popup-background-color) 60%);
}

.djs-popup-tabs-scroll-end {
  right: 0;
  justify-content: flex-end;
  background: linear-gradient(to right, transparent, var(--popup-background-color) 60%);
}

.djs-popup-tabs-scroll-start svg {
  transform: rotate(180deg);
}

.djs-popup-tabs {
  display: flex;
  flex-wrap: nowrap;
  gap: 2px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 0 12px;

  /* keep scrolled-to tabs clear of the scroll controls */
  scroll-padding: 0 28px;
  scrollbar-width: none;
}

.djs-popup-tabs::-webkit-scrollbar {
  display: none;
}

.djs-popup-tab {
  appearance: none;
  background: transparent;
  border: none;
  border-bottom: solid 2px transparent;
  border-radius: 0;
  flex: 0 0 auto;
  padding: 6px 10px;
  font: inherit;
  font-size: var(--popup-font-size);
  color: var(--popup-tab-color);
  cursor: pointer;
  white-space: nowrap;
}

.djs-popup-tab:hover {
  color: var(--popup-tab-hover-color);
}

.djs-popup-tab:focus-visible {
  outline: solid 1px var(--popup-tab-focus-border-color);
  outline-offset: -2px;
}

.djs-popup-tab[aria-selected="true"] {
  color: var(--popup-tab-active-color);
  border-bottom-color: var(--popup-tab-active-border-color);
  font-weight: var(--popup-header-font-weight);
}

.djs-popup-title {
  font-size: var(--popup-font-size);
  font-weight: var(--popup-header-font-weight);
  flex: 1;
  margin: 0;
}

.djs-popup-breadcrumbs {
  display: flex;
  line-height: 20px;
  margin: 10px 12px;
}

.djs-popup-breadcrumbs-item {
  display: inline-flex;
  min-width: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  border: 0;
  outline: none;
  appearance: none;
  color: var(--popup-description-color);
  font: inherit;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.djs-popup-breadcrumbs-item--separator::before {
  display: inline-block;
  content: '/';
  color: var(--popup-description-color);
  margin: 0 4px;
}

.djs-popup-breadcrumbs-item:hover {
  color: inherit;
  text-decoration: underline;
}

.djs-popup-breadcrumbs-item:focus-visible {
  outline: 1px solid var(--popup-search-focus-border-color);
  outline-offset: 2px;
}

.djs-popup-breadcrumbs-item--back {
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 2px 3px;
  margin-right: 6px;
  border: 1px solid var(--popup-search-border-color);
  border-radius: 4px;
}

.djs-popup-breadcrumbs-item--back:hover {
  background: #f2f3f5;
}

.djs-popup-breadcrumbs-item--current {
  font-weight: var(--popup-header-font-weight);
  color: inherit;
  cursor: default;
}

.djs-popup-breadcrumbs-item--current:hover {
  text-decoration: none;
}

.djs-popup-entry-actions {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  gap: 6px;
  margin-left: 6px;
}

.djs-popup-entry-chevron {
  display: flex;
  align-items: center;
  color: var(--popup-description-color);
}

.djs-popup-search-icon {
  position: absolute;
  left: 8px;
  top: 7px;
}

.djs-popup-search-count {
  margin: 0 12px;
  font-size: var(--popup-secondary-font-size);
  color: var(--popup-description-color);
}

.djs-popup-results {
  margin: 7px 3px 7px 12px;
  list-style: none;
  max-height: 280px;
  overflow: auto;
  padding-right: 9px;
}

/**
 * The results list is focusable (as a listbox holding
 * `aria-activedescendant`) when there is no search field.
 * The active entry is indicated via `.entry.selected`, so we hide
 * the outline on the list container itself.
 */
.djs-popup-results:focus {
  outline: none;
}

.djs-popup-group {
  margin: 0;
  padding: 0;
  width: 100%;
}

.djs-popup-body .entry,
.djs-popup-body .entry-header {
  padding: 5px 7px;
  cursor: default;
  border-radius: 4px;
}

.djs-popup-body .entry-header {
  font-weight: var(--popup-header-font-weight);
  color: var(--popup-entry-title-color);
  padding-left: 0;
}

.djs-popup [class*="icon"] .djs-popup-label,
.djs-popup-label:not(:first-child) {
  margin-left: .5em;
}

.djs-popup [class*="icon"]:before,
.djs-popup-entry-icon {
  width: 1em;
  height: 1em;
  display: inline-block;
  font-size: 1.4em;
  vertical-align: middle;
}

.djs-popup-body .entry-header:not(:first-child) {
  margin-top: 8px;
  margin-bottom: 2px;
}

.djs-popup-body .entry {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  height: min-content;
}

.djs-popup .entry.selected {
  background-color: var(--popup-entry-hover-color);
}

.djs-popup .entry.disabled {
  color: var(--popup-disabled-color);
  cursor: not-allowed;
}

.djs-popup-body .entry:not(:first-child) {
  margin-top: 2px;
}

.djs-popup-entry-content {
  display: flex;
  flex-direction: column;
  flex: 1;
}

.djs-popup-entry-description {
  font-size: var(--popup-secondary-font-size);
  margin-top: .25em;

  color: var(--popup-description-color);
}

.djs-popup-label,
.djs-popup-entry-description {
  line-height: 1.4em;
}

.djs-popup .entry,
.djs-popup .entry-header {
  margin: 1px;
}

.djs-popup-body {
  flex-direction: column;
  width: auto;
}

.djs-popup *::-webkit-scrollbar {
  width: 6px;
}

.djs-popup *::-webkit-scrollbar-thumb {
  border-radius: 3px;
  background-color: rgba(0, 0, 0, 0.2);
}

.djs-popup *::-webkit-scrollbar-track {
  box-shadow: none;
  background: transparent;
  margin: 0;
  padding: 5px;
}

.djs-popup-no-results {
  padding: 0 12px 12px 12px;
  color: var(--popup-no-results-color);
}

.djs-popup-footer {
  display: flex;
  padding: 5px 12px 7px 12px;
  border-top: solid 1px var(--popup-border-color);
}

/**
 * The footer holds the keyboard/assistive-technology reachable documentation
 * link. Mouse users get the per-entry `.djs-popup-entry-docs` affordance on
 * hover instead, so the (redundant) footer link is hidden while the results
 * list is hovered and shown during keyboard navigation.
 */
.djs-popup-results:hover ~ .djs-popup-footer {
  display: none;
}

.djs-popup-entry-docs {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  visibility: hidden;
  padding: 2px 3px;
  color: var(--popup-description-color);
  background: #fff;
  border: 1px solid var(--popup-search-border-color);
  border-radius: 4px;
  cursor: pointer;
  transition: background-color .12s ease, border-color .12s ease, color .12s ease;
}

.djs-popup-body .entry:hover .djs-popup-entry-docs {
  visibility: visible;
}

.djs-popup-body .entry .djs-popup-entry-docs:hover {
  background: #f2f3f5;
}

.djs-popup-entry-docs svg {
  vertical-align: middle;
}

.djs-popup-footer-docs {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: var(--popup-secondary-font-size);
  color: var(--popup-description-color);
  text-decoration: none;
}

.djs-popup-footer-docs:hover {
  text-decoration: underline;
}

.djs-popup-footer-docs svg {
  vertical-align: middle;
  margin: 2px;
}

/**
 *  palette styles
 */
.djs-palette {
  background: var(--palette-background-color);
  border: solid 1px var(--palette-border-color);
  border-radius: 2px;
}

/**
 * bendpoints
 */
.djs-segment-dragger,
.djs-bendpoint {
  display: none;
}

.djs-segment-dragger .djs-visual {
  display: none;

  fill: var(--bendpoint-fill-color);
  stroke: var(--bendpoint-stroke-color);
  stroke-width: 1px;
  stroke-opacity: 1;
}

.djs-segment-dragger:hover .djs-visual {
  display: block;
}

.djs-bendpoint .djs-visual {
  fill: var(--bendpoint-fill-color);
  stroke: var(--bendpoint-stroke-color);
  stroke-width: 1px;
}

.djs-segment-dragger:hover,
.djs-bendpoints.hover .djs-segment-dragger,
.djs-bendpoints.selected .djs-segment-dragger,
.djs-bendpoint:hover,
.djs-bendpoints.hover .djs-bendpoint,
.djs-bendpoints.selected .djs-bendpoint {
  display: block;
}

.djs-drag-active .djs-bendpoints * {
  display: none;
}

.djs-bendpoints:not(.hover) .floating {

consultor que atende o cliente, com tarefa gerada pelo portal (recomendado). A tarefa no portal deve ser feita par ao gerente de parcerias. Não quero que o consultor ou a equipe comercial, ou CS tenham a necessidade de acessar o portal para ver isso (eles não o farão e deixarão as tarefas lá sem fazer). Quem tem responsabilidade para com o portal e a governança das tarefas de lá, mesmo que devam ser executadas por terceiros, deve ser o gerente de parcerias.", "local": "FO-01/Q-0013"}, {"id": "EV-0006", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-01", "trecho": "O Igor", "local": "FO-01/Q-0021"}, {"id": "EV-0007", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-01", "trecho": "O consultor ou comercial da empresa que vai atender (recomendado: quem fecha é dono da conta)", "local": "FO-01/Q-0014"}, {"id": "EV-0008", "tipo": "documento", "fonte": "Especificação 002: Portal Wise Partners 2.0 (23/10/2026)", "pessoa": null, "data": "2026-11-01", "trecho": "Responsável nomeado com 2 horas ou mais por semana no primeiro mês", "local": "Apêndice A"}, {"id": "EV-0009", "tipo": "documento", "fonte": "Especificação 002: Portal Wise Partners 2.0 (23/10/2026)", "pessoa": null, "data": "2026-11-01", "trecho": "A versão 1 do portal está construída e testada com dados fictícios.", "local": "Contexto"}, {"id": "EV-0010", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-01", "trecho": "Não agora. Não precisamos fazer com que o portal seja uma forma de comunicação entre o parceiro e a Wise Makers / grupo tríade, porque já temos grupos de whatsapp para cada respectivo parceiro dentro de uma comunidade da wise partners. Vamos manter a comunicação por lá. Ao mesmo tempo, precisamos deixar alguma parte no perfil do parceiro para que tenha a possibilidade de eu resgatar a apresentação de vendas dele. Ao mesmo tempo precisamos deixar disponível uma seção do portal wise partners para que o parceiro possa aprender a vender a wise makers e as outras empresas do grupo, tendo acesso a material de vendas de cada um e também entendendo quanto pode ganhar de comissão para cada indicação.", "local": "FO-01/Q-0012"}, {"id": "EV-0011", "tipo": "documento", "fonte": "Especificação 001: Portal Wise Partners", "pessoa": null, "data": "2026-11-01", "trecho": "O contrato é enviado para assinatura no Autentique fora do portal, e o PDF assinado é anexado.", "local": "User Story 4"}, {"id": "EV-0012", "tipo": "documento", "fonte": "Especificação 002: Portal Wise Partners 2.0 (23/10/2026)", "pessoa": null, "data": "2026-11-01", "trecho": "As trilhas ficam só no portal, nunca no Wise Hub, porque o Hub é aberto à carteira do parceiro.", "local": "User Story 10"}, {"id": "EV-0013", "tipo": "validacao", "fonte": "FO-06: Rodada 1, o que o patrocinador já sabe", "pessoa": "PE-01", "data": "2026-10-31", "trecho": "As duas: entra pela carteira e depois acompanha o resultado. Acabei de identificar que precisaremos atualizar o playbook com as novas direções que viemos a fazer no web app. O playbook está desatualizado e não segue o que o webapp possibilita", "local": "FO-01/Q-0004 (mapa as-is, EV-0109)"}, {"id": "EV-0014", "tipo": "validacao", "fonte": "FO-06: Rodada 1, o que o patrocinador já sabe", "pessoa": "PE-01", "data": "2026-10-31", "trecho": "Vale a especificação: na ativação. Isso foi atualizado com o web app, mas o playbook acabou não acompanhando", "local": "FO-01/Q-0005 (mapa as-is, EV-0110)"}, {"id": "EV-0015", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-01", "trecho": "Aprovo com ajustes (comente). Vejo que a atualização que fizemos depois da leitura dos livros foi só para incluir citações dos livros em alguns processos. Não vejo que conseguimos extrair conceitos importantes e novas perspectivas de modelo de negócio para trazer como melhoria essencial no mapeamento dos processos e modelo de negócio do programa Wise Partners. Preciso que você reveja os livros e traga novas soluções, mesmo que venham a fazer grandes alterações. Precisamos rever tudo do zero, mesmo que venhamos a fazer uma alteração para mudar 100% dos processos como estão agora. Tente fazer o conhecimentos dos livros para a realidade do Wise Partners em uma perspectiva estruturada de mapeamento de processos. Além disso, preciso de mais detalhe nos processos e mais processos", "local": "FO-01/Q-0001"}, {"id": "EV-0016", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-01", "trecho": "Os três pilares desde o primeiro parceiro", "local": "FO-01/Q-0002"}, {"id": "EV-0017", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-01", "trecho": "10 assinados e também uma meta de ativados (recomendado). Gosto da meta, mas não podemos nos ater às metas agora, mas sim para o mapeamento dos processos e do modelo de negócio. A meta, por enquanto, será apenas a capacidade de estupilarmos as metas e a relação da meta no modelo de negócio. Veremos efetivamente qual será a meta em um segundo momento", "local": "FO-01/Q-0003"}, {"id": "EV-0018", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-01", "trecho": "Outra regra (comente). As horas semanais não vão interferir agora. Este momento é para refletirmos sobre mapeamento de processos e modelo de negócio. Não quero que nos atamos em detalhes agora. Deixe apenas a capacidade de podermos fazer a gestão de tempo e recursos de tempo gasto com o programa, nada mais.", "local": "FO-01/Q-0004"}, {"id": "EV-0019", "tipo": "entrevista", "fonte": "Conversa com Guilherme Faccin (escopo do mapeamento)", "pessoa": "PE-01", "data": "2026-10-29", "trecho": "Hierarquia + fluxos dos kanbans: Todos os macroprocessos e processos com dono, gatilho e entregas; passo a passo validado só dos processos que viram funil (recrutamento, onboarding, Base Ativa, indicações e os que surgirem).", "local": "Fase 0, profundidade (mapa as-is, EV-0004)"}, {"id": "EV-0020", "tipo": "documento", "fonte": "Especificação 001: Portal Wise Partners", "pessoa": null, "data": "2026-11-01", "trecho": "o portal gera a minuta do contrato (Parceria Comercial ou Parceria Institucional) em PDF e em Word", "local": "User Story 4"}, {"id": "EV-0021", "tipo": "documento", "fonte": "Especificação 002: Portal Wise Partners 2.0 (23/10/2026)", "pessoa": null, "data": "2026-11-01", "trecho": "Parceria institucional não usa scorecard nem nível por resultado nesta versão.", "local": "Apêndice A"}, {"id": "EV-0022", "tipo": "documento", "fonte": "Especificação 001: Portal Wise Partners", "pessoa": null, "data": "2026-11-01", "trecho": "O usuário escolhe o pacote disponível para o nível, e o sistema carrega as contrapartidas do pacote, com periodicidade e forma de comprovação.", "local": "User Story 5"}, {"id": "EV-0023", "tipo": "documento", "fonte": "Platform Revolution: How Networked Markets Are Transforming the Economy and How to Make Them Work for You (Geoffrey G. Parker, Marshall W. Van Alstyne e Sangeet Paul Choudary)", "pessoa": null, "data": "2026-11-01", "trecho": "successful platforms begin with a single core interaction that consistently generates high value for users.", "local": "p. 48 (Core Interaction: Participants, Value Unit and Filter, com os quatro efeitos de )"}, {"id": "EV-0024", "tipo": "documento", "fonte": "Platform Revolution: How Networked Markets Are Transforming the Economy and How to Make Them Work for You (Geoffrey G. Parker, Marshall W. Van Alstyne e Sangeet Paul Choudary)", "pessoa": null, "data": "2026-11-01", "trecho": "Participants + Value Unit + Filter → Core Interaction", "local": "p. 47 (Core Interaction: Participants, Value Unit and Filter, com os quatro efeitos de )"}, {"id": "EV-0025", "tipo": "documento", "fonte": "Platform Revolution: How Networked Markets Are Transforming the Economy and How to Make Them Work for You (Geoffrey G. Parker, Marshall W. Van Alstyne e Sangeet Paul Choudary)", "pessoa": null, "data": "2026-11-01", "trecho": "A well-designed filter ensures that platform users receive only value units that are relevant and valuable to them", "local": "p. 47 (Core Interaction: Participants, Value Unit and Filter, com os quatro efeitos de )"}, {"id": "EV-0026", "tipo": "documento", "fonte": "Ecosystem-Led Growth: A Blueprint for Sales and Marketing Success Using the Power of Partnerships (Bob Moore)", "pessoa": null, "data": "2026-11-01", "trecho": "it's a map of the many ELG playbooks that exist at the intersection of you and the partners in your ecosystem, with each square representing a play that sits somewhere in your revenue funnel", "local": "secao 21 (Account Mapping Matrix, matriz 3x3 de mapeamento de contas, e regras de comparti)"}, {"id": "EV-0027", "tipo": "documento", "fonte": "The Ecosystem Economy (Venkat Atluri, Miklós Dietz)", "pessoa": null, "data": "2026-11-01", "trecho": "Generally speaking, though, these roles fall into two main categories: orchestrators and participants.", "local": "p. 138 (Orchestrators and Participants: the spectrum of ecosystem roles)"}, {"id": "EV-0028", "tipo": "documento", "fonte": "The Ecosystem Economy (Venkat Atluri, Miklós Dietz)", "pessoa": null, "data": "2026-11-01", "trecho": "As the orchestrator, you typically have the responsibility to lead, organize, and evolve the ecosystem in order to make it as effective and efficient as possible.", "local": "p. 138 (Orchestrators and Participants: the spectrum of ecosystem roles)"}, {"id": "EV-0029", "tipo": "documento", "fonte": "The Ecosystem Economy (Venkat Atluri, Miklós Dietz)", "pessoa": null, "data": "2026-11-01", "trecho": "if you are more of a back-office orchestrator, you might have strong control over the data generated by the ecosystem but a much lighter control over the customer relationship.", "local": "p. 144 (Orchestrators and Participants: the spectrum of ecosystem roles)"}, {"id": "EV-0030", "tipo": "documento", "fonte": "Winning the Right Game: How to Disrupt, Defend, and Deliver in a Changing World (Ron Adner)", "pessoa": null, "data": "2026-11-01", "trecho": "In ecosystems, leadership is not an outcome but a role.", "local": "p. 142 (Ego-System Trap)"}, {"id": "EV-0031", "tipo": "documento", "fonte": "Winning the Right Game: How to Disrupt, Defend, and Deliver in a Changing World (Ron Adner)", "pessoa": null, "data": "2026-11-01", "trecho": "will your existing partners continue to accept their current role?", "local": "p. 150 (Ego-System Trap)"}, {"id": "EV-0032", "tipo": "documento", "fonte": "Winning the Right Game: How to Disrupt, Defend, and Deliver in a Changing World (Ron Adner)", "pessoa": null, "data": "2026-11-01", "trecho": "A value architecture is defined by the elements that are brought together to create the value proposition.", "local": "p. 26 (Value Architecture)"}, {"id": "EV-0033", "tipo": "documento", "fonte": "Winning the Right Game: How to Disrupt, Defend, and Deliver in a Changing World (Ron Adner)", "pessoa": null, "data": "2026-11-01", "trecho": "Where a business model is focused on how you operate to get paid by a customer, a value architecture is focused on how you construct the value that underlies your customers’ willingness to pay for your offer", "local": "p. 28 (Value Architecture)"}, {"id": "EV-0034", "tipo": "documento", "fonte": "Winning the Right Game: How to Disrupt, Defend, and Deliver in a Changing World (Ron Adner)", "pessoa": null, "data": "2026-11-01", "trecho": "The value elements of the architecture are not steps in a value chain, an activity system, or a value stream.", "local": "p. 28 (Value Architecture)"}, {"id": "EV-0035", "tipo": "documento", "fonte": "Ecossistema de Parceiros: Método Octo (Juliana Tubino e Nara Vaz Guimarães)", "pessoa": null, "data": "2026-11-01", "trecho": "modelos de parceria que são baseados apenas em comissionamento podem ser limitantes", "local": "p. 128 (Programa de Parceiros: programa mínimo viável, canvas de proposta de valor e nív)"}, {"id": "EV-0036", "tipo": "documento", "fonte": "Especificação 002: Portal Wise Partners 2.0 (23/10/2026)", "pessoa": null, "data": "2026-11-01", "trecho": "ao passar no teste, recebe o próprio certificado em PDF e o selo de capacitação", "local": "User Story 10"}, {"id": "EV-0037", "tipo": "documento", "fonte": "Co-opetition (Adam M. Brandenburger e Barry J. Nalebuff)", "pessoa": null, "data": "2026-11-01", "trecho": "Customers, suppliers, and competitors. And one more category: people who provide complements.", "local": "p. 29 (Value Net)"}, {"id": "EV-0038", "tipo": "documento", "fonte": "Co-opetition (Adam M. Brandenburger e Barry J. Nalebuff)", "pessoa": null, "data": "2026-11-01", "trecho": "A player is your complementor if customers value your product more when they have the other player’s product than when they have your product alone.", "local": "p. 31 (Value Net)"}, {"id": "EV-0039", "tipo": "documento", "fonte": "Co-opetition (Adam M. Brandenburger e Barry J. Nalebuff)", "pessoa": null, "data": "2026-11-01", "trecho": "It’s counterproductive to typecast someone as just a customer or just a supplier or just a competitor or just a complementor.", "local": "p. 41 (Value Net)"}, {"id": "EV-0040", "tipo": "documento", "fonte": "Co-opetition (Adam M. Brandenburger e Barry J. Nalebuff)", "pessoa": null, "data": "2026-11-01", "trecho": "There is a duality in every relationship", "local": "p. 49 (Value Net)"}, {"id": "EV-0041", "tipo": "documento", "fonte": "Nearbound and the Rise of the Who Economy (Jared Fuller, Jill Rowley)", "pessoa": null, "data": "2026-11-01", "trecho": "Today’s buyers ask, “Who do I know that has solved this problem?”", "local": "p. 17 (Who Economy)"}, {"id": "EV-0042", "tipo": "documento", "fonte": "Building Successful Partner Channels in the software industry (Hans Peter Bech)", "pessoa": null, "data": "2026-11-01", "trecho": "Our independent channel partners will typically have a value proposition that is focused on the individual customer with the objective of optimizing the Customer Lifetime Value.", "local": "p. 42 (O canal como modelo de negócio de terceiros: Find, Win, Make, Keep, Grow, níveis)"}, {"id": "EV-0043", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-01", "trecho": "Manter 40% da primeira mensalidade, como no contrato. Qual é o parâmetro que os livros recomendam? Temos que considerar todo o LTV do cliente e, quando o fazemos, o percentual do que damos de comissão fica dentro dos 5% a 15%", "local": "FO-01/Q-0006"}, {"id": "EV-0044", "tipo": "validacao", "fonte": "FO-01: To-be, decisões do patrocinador", "pessoa": "PE-01", "data": "2026-11-01", "trecho": "Sim, igual nas três; a venda é livre (recomendado). Sim, igual, a pesar da comissão vir a ser um pouco diferente para a swallow, já que é por projeto. Fica a regra que estipulei antes (6% para quem indica e 2% para o gerente de parceria)", "local": "FO-01/Q-0005"}, {"id": "EV-0045", "tipo": "documento", "fonte": "Especificação 001: Portal Wise Partners", "pessoa": null, "data": "2026-11-01", "trecho": "o sistema calcula 40% da primeira mensalidade para o parceiro e 10% para o responsável pela parceria", "local": "User Story 6, cenário 1"}, {"id": "EV-0046", "tipo": "documento", "fonte": "The Channel Advantage (Lawrence G. Friedman e Timothy R. Furey)", "pessoa": null, "data": "2026-11-01", "trecho": "There are basically three choices, though they are not mutually exclusive: lead generation, selling, and support/service.", "local": "p. 113 (Seven best practices of partner channel design)"}, {"id": "EV-0047", "tipo": "documento", "fonte": "Getting to Yes: Negotiating Agreement Without Giving In (Roger Fisher, William Ury e Bruce Patton)", "pessoa": null, "data": "2026-11-01", "trecho": "At a minimum, objective criteria need to be independent of each side's will.", "local": "p. 96 (Critérios objetivos e BATNA)"}, {"id": "EV-0048", "tipo": "documento", "fonte": "Getting to Yes: Negotiating Agreement Without Giving In (Roger Fisher, William Ury e Bruce Patton)", "pessoa": null, "data": "2026-11-01", "trecho": "Objective criteria should apply, at least in theory, to both sides.", "local": "p. 96 (Critérios objetivos e BATNA)"}, {"id": "EV-0049", "tipo": "documento", "fonte": "Ecossistema de Parceiros: Método Octo (Juliana Tubino e Nara Vaz Guimarães)", "pessoa": null, "data": "2026-11-01", "trecho": "A relação entre critério e benefício é muito semelhante à relação de CAC versus LTV.", "local": "p. 137 (Programa de Parceiros: programa mínimo viável, canvas de proposta de valor e nív)"}, {"id": "EV-0050", "tipo": "documento", "fonte": "Platform Revolution: How Networked Markets Are Transforming the Economy and How to Make Them Work for You (Geoffrey G. Parker, Marshall W. Van Alstyne e Sangeet Paul Choudary)", "pessoa": null, "data": "2026-11-01", "trecho": "In fact, rather than charging users to join the platform, the founders should be subsidizing their participation", "local": "p. 106 (Monetization: capturing the value created by network effects)"}, {"id": "EV-0051", "tipo": "documento", "fonte": "Platform Revolution: How Networked Markets Are Transforming the Economy and How to Make Them Work for You (Geoffrey G. Parker, Marshall W. Van Alstyne e Sangeet Paul Choudary)", "pessoa": null, "data": "2026-11-01", "trecho": "Charging a transaction fee is a powerful way of monetizing the value created by the platform without hampering the growth of network effects.", "local": "p. 113 (Monetization: capturing the value created by network effects)"}, {"id": "EV-0052", "tipo": "documento", "fonte": "Platform Revolution: How Networked Markets Are Transforming the Economy and How to Make Them Work for You (Geoffrey G. Parker, Marshall W. Van Alstyne e Sangeet Paul Choudary)", "pessoa": null, "data": "2026-11-01", "trecho": "Buyers and sellers who find each other on the platform are naturally incentivized to take the interaction off the platform if they can, in order to avoid paying the transaction fee.", "local": "p. 113 (Monetization: capturing the value created by network effects)"}, {"id": "EV-0053", "tipo": "documento", "fonte": "Co-opetition (Adam M. Brandenburger e Barry J. Nalebuff)", "pessoa": null, "data": "2026-11-01", "trecho": "Competition is valuable. Don’t give it away. Get paid to play.", "local": "p. 91 (PARTS)"}, {"id": "EV-0054", "tipo": "documento", "fonte": "Co-opetition (Adam M. Brandenburger e Barry J. Nalebuff)", "pessoa": null, "data": "2026-11-01", "trecho": "Say thank you. Create loyalty by rewarding it.", "local": "p. 140 (Added Values)"}, {"id": "EV-0055", "tipo": "documento", "fonte": "Co-opetition (Adam M. Brandenburger e Barry J. Nalebuff)", "pessoa": null, "data": "2026-11-01", "trecho": "Save the best thank-you for your best customers.", "local": "p. 141 (Added Values)"}, {"id": "EV-0056", "tipo": "documento", "fonte": "Co-opetition (Adam M. Brandenburger e Barry J. Nalebuff)", "pessoa": null, "data": "2026-11-01", "trecho": "If you’re planning to say thank you, you should let your customers know in advance so they’ll stick around for it.", "local": "p. 142 (Added Values)"}, {"id": "EV-0057", "tipo": "documento", "fonte": "Building Successful Partner Channels in the software industry (Hans Peter Bech)", "pessoa": null, "data": "2026-11-01", "trecho": "They should primarily be managed through the partner portal with opportunities for chat, call centre and email communication.", "local": "p. 93 (Pirâmide do canal)"}, {"id": "EV-0058", "tipo": "documento", "fonte": "Nearbound and the Rise of the Who Economy (Jared Fuller, Jill Rowley)", "pessoa": null, "data": "2026-11-01", "trecho": "The truth is that they will never log in to your portal as much as you think they will, o hout Giving In (Roger Fisher, William Ury e Bruce Patton)", "pessoa": null, "data": "2026-11-01", "trecho": "Interests motivate people; they are the silent movers behind the hubbub of positions.", "local": "p. 58 (Interesses e opções de ganho mútuo)"}, {"id": "EV-0126", "tipo": "documento", "fonte": "Getting to Yes: Negotiating Agreement Without Giving In (Roger Fisher, William Ury e Bruce Patton)", "pessoa": null, "data": "2026-11-01", "trecho": "Your position is something you have decided upon. Your interests are what caused you to so decide.", "local": "p. 58 (Interesses e opções de ganho mútuo)"}, {"id": "EV-0127", "tipo": "documento", "fonte": "Getting to Yes: Negotiating Agreement Without Giving In (Roger Fisher, William Ury e Bruce Patton)", "pessoa": null, "data": "2026-11-01", "trecho": "If they are not involved in the process, they are unlikely to approve the product.", "local": "p. 45 (Negociação por princípios: os quatro pontos e a separação entre pessoas e proble)"}, {"id": "EV-0128", "tipo": "documento", "fonte": "Building Successful Partner Channels in the software industry (Hans Peter Bech)", "pessoa": null, "data": "2026-11-01", "trecho": "It is recommended that this workshop be run before signing the channel partner agreement.", "local": "p. 55 (Recrutamento de parceiros como headhunting, workshop estratégico e P&L do parcei)"}, {"id": "EV-0129", "tipo": "documento", "fonte": "Building Successful Partner Channels in the software industry (Hans Peter Bech)", "pessoa": null, "data": "2026-11-01", "trecho": "the channel partner will benefit dramatically from selling to her installed base of customers first.", "local": "p. 196 (Recrutamento de parceiros como headhunting, workshop estratégico e P&L do parcei)"}, {"id": "EV-0130", "tipo": "documento", "fonte": "Strategic Alliances and Marketing Partnerships (Richard Gibbs, Andrew Humphries)", "pessoa": null, "data": "2026-11-01", "trecho": "Successful negotiations can be identified where firms have explo
