"local": "Gravação 2, 21:04"}, {"id": "EV-0315", "tipo": "entrevista", "fonte": "Reunião Guilherme e Igor, 04/11/2026 (transcrição automática parcial)", "pessoa": null, "data": "2026-11-05", "trecho": "fazer o vídeo com o canal LP pro David e eles são mandando link", "local": "Gravação 2, 22:50"}, {"id": "EV-0316", "tipo": "documento", "fonte": "Never Eat Alone (Keith Ferrazzi, Tahl Raz)", "pessoa": null, "data": "2026-11-05", "trecho": "People respond with trust when they know you're dealing straight with them.", "local": "p. 71 (princípio: Construir confiança com transparência, vulnerabilidade e compromissos )"}, {"id": "EV-0317", "tipo": "documento", "fonte": "The Keystone Advantage (Marco Iansiti, Roy Levien)", "pessoa": null, "data": "2026-11-05", "trecho": "Both parties know the same information, so the discussion centers around actions.", "local": "p. 110 (princípio: Dê informação comum e padrões de desempenho aos dois lados: confiança )"}], "perguntas": [{"id": "Q-0001", "texto": "Você aprova estes 18 princípios, em quatro camadas, como a base que ordena toda a hierarquia de processos?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-002", "F-010", "F-011", "F-012", "F-013", "F-014", "F-018", "F-019"], "para": ["PE-01"], "rodada": 3, "bloco": "Os princípios", "status": "respondida", "formulario": "FO-01", "respostas": ["EV-0035"], "respondida_por": ["PE-01"], "chave": "r3_principios", "contexto": ["Você pediu para refatorar todos os conceitos de uma vez. Juntei o que os 16 livros dizem em comum e separei em quatro camadas: por que o programa existe, como se organiza, como se relaciona e como se mede e evolui. Cada camada responde a uma pergunta diferente, e cada princípio aponta para os processos que o colocam em prática.", "Dez dos dezoito já estavam aprovados nas suas respostas: canal mais barato que os ativos, interação central, ocupar pouco, interface simples, portal no centro, atenção proporcional, só a exceção vira trabalho, primeiro valor em 90 dias, ritmos no lugar de quadros e governança com o Diretor só assinando.", "Os oito novos vêm dos livros da segunda pasta: criar valor antes de capturar (Keystone, Give and Take), fechar o ciclo e mostrar o impacto (Referral Engine, Give and Take, Business of Belonging), ensinar a indicar (Referral Engine), norma social antes de norma de mercado (Business of Belonging, Referral Engine), reciprocidade visível (Give and Take), comunidade com ritual (Business of Belonging), medir por fatores objetivos (Keystone, Customer Success) e crescer por fases (Keystone, Winning the Right Game)."], "logica": "Quando os princípios estão escritos e ordenados, cada decisão nova tem um critério para ser julgada. Um processo que não serve a nenhum princípio é candidato a sair, o que protege o programa da complexidade que você quer evitar.", "citacoes": ["EV-0037", "EV-0065", "EV-0071", "EV-0074", "EV-0081"], "visual": "principios"}, {"id": "Q-0002", "texto": "Você aprova a hierarquia v3: três macroprocessos de gestão (Arquitetar, Gerir por rituais, Medir e aprender), seis finalísticos (Atrair, Integrar, Gerar oportunidades, Desenvolver, Cultivar a comunidade, Reter ou encerrar) e três de suporte (Prateleira, Equipar o parceiro, Operar o portal no centro)?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["P-14", "P-47"], "para": ["PE-01"], "rodada": 3, "bloco": "A nova arquitetura", "status": "respondida", "formulario": "FO-01", "respostas": ["EV-0249"], "respondida_por": ["PE-01"], "chave": "r3_hap", "contexto": ["Três mudanças em relação à v2. Medir e aprender virou macroprocesso, porque é ali que o portal calcula o CAC, o cubo de cada parceiro, o nível, a saúde do ecossistema e os portões. Cultivar a comunidade também virou macroprocesso, porque os livros novos mostram que a comunidade é onde o parceiro decide ficar e dar.", "No suporte, Dados e Portal viraram um só: Operar o portal no centro da gestão. É onde moram as regras que rodam sozinhas, os dados e a privacidade, os contratos e os acessos. O ecossistema interno saiu como processo, porque você decidiu que o lead vai direto ao closer, sem SLA, e isso virou uma atividade dentro de Gerar oportunidades.", "Cada processo agora diz o que o portal faz nele (registra, calcula, alerta, prepara mensagem, monta pauta). Ao todo são 12 macroprocessos, 54 processos e 24 subprocessos, com 13 fluxos detalhados."], "logica": "Com o portal descrito em cada processo, o web app fica no centro da gestão de forma concreta: dá para ver, processo a processo, o que é trabalho humano e o que é trabalho do sistema.", "citacoes": ["EV-0054", "EV-0055", "EV-0056"], "visual": "hap"}, {"id": "Q-0003", "texto": "No lugar dos três fatores de saúde e dos oito tipos do livro, você aprova o cubo: Valor, Ritmo e Relação, cada um alto ou baixo, formando oito tipos por regra fixa, com o Potencial definindo só a atenção?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-038", "P-16", "P-16.fluxo", "P-17", "F-018", "P-65", "P-66", "P-67", "P-68"], "para": ["PE-01"], "rodada": 3, "bloco": "Fatores e tipos", "status": "respondida", "formulario": "FO-01", "respostas": ["EV-0129"], "respondida_por": ["PE-01"], "chave": "r3_cubo", "contexto": ["Você desconfiou dos três fatores e pediu uma regra lógica que levasse aos oito tipos. Relemos o livro inteiro para isso. O próprio Strategic Alliances diz que a autoavaliação posiciona a parceria só de forma muito aproximada. Os oito tipos são perfis escolhidos entre 64 combinações de quatro níveis em três fatores: só 8 combinações batem exatamente com um perfil, e 22 empatam entre perfis. Nenhum corte alto ou baixo separa os oito. Ou seja, não é uma matriz, e a sua desconfiança procedia.", "A proposta mantém a ideia do livro (valor, cooperação, qualidade da relação), mas mede comportamentos que o portal registra e transforma tudo numa matriz de verdade. Valor: o que a relação já entregou em 12 meses, receita ganha mais pipeline ponderado. Ritmo: recência e frequência de ações de valor. Relação: o pulso trimestral, o retorno mútuo e o equilíbrio entre indicações enviadas e recebidas, a reciprocidade de Give and Take. Dois níveis em cada fator dão exatamente oito células, e cada célula é um tipo.", "A lógica RFV que você pediu está dentro do cubo: o Ritmo é a recência e a frequência, e o Valor é o V. A Relação acrescenta o que o RFV de clientes não vê, a tensão na relação. O Potencial (os 4 Cs de Nearbound: carteira, credibilidade, capacidade, compromisso) não muda o tipo, só decide se vale pôr mais horas."], "logica": "Com três fatores binários, qualquer pessoa explica a regra em um minuto, e cada tipo leva a uma ação. Os cortes (12 meses, 30 dias, 2 ações, índice 70) são provisórios e se calibram na primeira revisão trimestral com dados reais.", "citacoes": ["EV-0131", "EV-0082", "EV-0245", "EV-0154", "EV-0133"], "visual": "cubo"}, {"id": "Q-0004", "texto": "Você aprova a ação, a abordagem e a cadência de cada um dos oito tipos, inclusive para quem está em risco (Âncora esfriando, Valioso em risco, Cordial seletivo, Desertor)?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["P-41", "P-55", "P-54.fluxo"], "para": ["PE-01"], "rodada": 3, "bloco": "Fatores e tipos", "status": "respondida", "formulario": "FO-01", "respostas": ["EV-0130"], "respondida_por": ["PE-01"], "chave": "r3_tipos", "contexto": ["Você pediu uma abordagem por tipo, como numa matriz RFV. A tabela da figura mostra o resumo. Embaixador: proteger e alavancar, com tom de sócio. Gerador sob tensão: diagnosticar em 7 dias o que tensiona (lead sem retorno, comissão percebida como injusta). Âncora esfriando: chegar com uma oportunidade pronta, sem cobrança. Valioso em risco: ouvir primeiro, por ligação, e decidir em 15 dias se vale. Promissor: buscar a primeira venda em 90 dias. Ativo sem tração: descobrir em 60 dias por que a atividade não vira receita. Cordial seletivo: recrutar de novo com foco único. Desertor: decidir, sem insistir.", "As ações vêm do que o Strategic Alliances recomenda para os perfis equivalentes: o catador de cerejas tratado como recrutamento novo, o desertor como decisão sobre se vale o esforço. A elas se somam Customer Success (todo sinal vira ação com dono e prazo) e Give and Take (julgar quem só toma pelo comportamento).", "No portal, a mudança de tipo cria a tarefa da jogada na sua fila, com a mensagem sugerida. A retenção deixa de ser um fluxo único e passa a seguir o tipo de cada parceiro."], "logica": "Abordar o parceiro pelo motivo real do afastamento economiza tempo e preserva a relação: quem esfriou por falta de oportunidade não precisa de cobrança, e quem nunca teve tração precisa de diagnóstico, não de convite.", "citacoes": ["EV-0186", "EV-0156", "EV-0061", "EV-0075"], "visual": "tipos"}, {"id": "Q-0005", "texto": "A métrica-mãe do programa passa a ser o CAC dos clientes vindos de parceiros, comparado ao CAC dos canais ativos. Quem informa o CAC dos canais ativos?", "tipo": "escolha", "opcoes": ["Eu informo", "O financeiro informa", "O Igor informa", "Não sei: perguntar ao Igor"], "alvo": ["F-031", "P-06", "P-14"], "para": ["PE-01"], "rodada": 3, "bloco": "Modelo de negócio", "status": "respondida", "formulario": "FO-01", "respostas": ["EV-0027"], "respondida_por": ["PE-01"], "chave": "r3_cac", "contexto": ["Você deixou claro o porquê do programa: parceria é um canal de aquisição de receita mais barato que os canais ativos, e a comissão só serve para baratear ainda mais o CAC. Se é esse o objetivo, ele precisa ser a primeira medida, não um resultado escondido entre outros.", "O portal já tem o que precisa para o lado do canal: comissões, horas registradas e custos diretos, divididos pelos clientes fechados vindos de parceiros. O Método Octo compara a relação entre critério e benefício à de CAC e LTV, e o Referral Engine manda medir fonte, conversão e custo por cliente.", "Falta o termo de comparação: o CAC dos canais ativos do grupo (prospecção, eventos, mídia). Só alguém fora do portal tem esse número."], "logica": "Uma métrica-mãe ligada ao motivo de existir do programa decide sozinha boa parte das discussões: o que não baixa o CAC nem aumenta a adesão não entra.", "citacoes": ["EV-0023", "EV-0039", "EV-0123"], "visual": "cac"}, {"id": "Q-0006", "texto": "Além do cubo por parceiro, o programa inteiro ganha três medidas de saúde: produtividade (oportunidades e clientes por parceiro ativo, e o CAC caindo), robustez (ativos que seguem ativos e base que não depende de um só parceiro) e criação de nicho (categorias e tipos novos gerando valor). Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-037", "P-19"], "para": ["PE-01"], "rodada": 3, "bloco": "Fatores e tipos", "status": "respondida", "formulario": "FO-01", "respostas": ["EV-0125"], "respondida_por": ["PE-01"], "chave": "r3_saude", "contexto": ["The Keystone Advantage mostra que um programa pode ter parceiros bons e mesmo assim estar doente. É o caso de quando tudo depende de um parceiro só, ou quando o custo de servir cresce mais do que o valor. Por isso o livro mede o ecossistema inteiro em três medidas: produtividade, robustez e criação de nicho.", "Aqui elas viram números do painel trimestral, calculados pelo portal. Produtividade: oportunidades e clientes por parceiro ativo e a tendência do CAC. Robustez: quantos ativos seguem ativos depois de dois trimestres e quanto o resultado depende dos três maiores parceiros. Criação de nicho: categorias e tipos de parceiro novos que já geram oportunidade."], "logica": "O cubo diz onde agir em cada parceiro. A saúde do ecossistema diz se o programa como um todo está ficando mais forte ou mais frágil, que é a pergunta do Diretor.", "citacoes": ["EV-0126", "EV-0127", "EV-0128"], "visual": "saude"}, {"id": "Q-0007", "texto": "Você pediu que eu recomendasse os portões. Você aprova os portões abaixo (ajustando números no comentário, se quiser)?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-039", "F-019", "P-12.fluxo"], "para": ["PE-01"], "rodada": 3, "bloco": "Gestão do programa", "status": "respondida", "formulario": "FO-01", "respostas": ["EV-0134"], "respondida_por": ["PE-01"], "chave": "r3_portoes", "contexto": ["Recomendação, juntando o seu objetivo (CAC menor que os canais ativos) com o que os livros pedem em cada fase. Winning the Right Game pede evidência que atraia o próximo parceiro. Keystone pede liquidez em escala pequena antes de escalar. Customer Success pede um processo que se repete antes de se padronizar. Business of Belonging pede que os parceiros comecem a puxar a conversa.", "Experimentação para Tração, valendo por um trimestre: 5 parceiros ativados; 3 clientes fechados vindos de parceiros; CAC do canal menor ou igual ao dos canais ativos; metade das oportunidades qualificadas virando reunião; rituais rodando dois trimestres seguidos do mesmo jeito.", "Tração para Crescimento: 15 parceiros ativos, com 40% em Ritmo alto; parceiros originando 20% dos clientes novos do grupo; CAC do canal na metade do dos canais ativos; metade das conversas da comunidade iniciadas por parceiros; 80% dos ativos seguindo ativos depois de dois trimestres. Na fase de Crescimento entram categorias e regiões novas e, quando o custo de servir passar das horas disponíveis, uma segunda pessoa no time.", "Os números são inferência minha, calibrada ao tamanho do grupo; nenhum livro dá números para o caso Wise. Os três pilares ficam abertos desde o início, como você decidiu."], "logica": "O portão controla o ritmo de escala, não a abertura dos pilares. Com portões ligados ao CAC, crescer só faz sentido quando crescer barateia a aquisição.", "citacoes": ["EV-0084", "EV-0085", "EV-0246", "EV-0247"], "visual": "portoes"}, {"id": "Q-0008", "texto": "Revisei o princípio das três perguntas, como você pediu: elas saem. No lugar, toda semana você revisa as oportunidades abertas e conversa com cada closer sobre as dele, e uma vez por mês o Igor recebe um resumo de poucos números. Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["P-10", "P-13"], "para": ["PE-01"], "rodada": 3, "bloco": "Gestão do programa", "status": "respondida", "formulario": "FO-01", "respostas": ["EV-0025"], "respondida_por": ["PE-01"], "chave": "r3_semana", "contexto": ["As três perguntas vinham de Nearbound, que propõe embutir o programa na reunião comercial (uma receita só, não direta e indireta). O princípio continua certo: o parceiro tem de fazer parte da rotina de venda. Mas o meio estava pesado para o caso Wise. Você já decidiu que o lead vai direto ao closer e que a conversa com ele é pessoal.", "Então o ritual semanal fica seu, sem pauta formal com o grupo. O portal lista, por closer, as oportunidades abertas e o último retorno dado ao parceiro, e você conversa com cada um como preferir. Com o Igor, o contato vira um resumo mensal de poucos números: CAC do canal, parceiros ativos, oportunidades e clientes do mês, distância dos portões. Ele já confia na sua autonomia."], "logica": "O princípio (o programa vive dentro da rotina comercial) fica; o mecanismo vira o mais leve possível. Isso tira uma reunião da agenda dos closers e do Igor e mantém a informação que importa.", "citacoes": ["EV-0248", "EV-0009", "EV-0007"], "visual": "semana"}, {"id": "Q-0009", "texto": "Como o Igor só assina, quem decide o desligamento de um parceiro?", "tipo": "escolha", "opcoes": ["Eu decido e informo o Igor", "Eu decido e o Igor assina o aviso formal", "O Igor decide, como na especificação", "Não sei: perguntar ao Igor"], "alvo": ["P-56.dono"], "para": ["PE-01"], "rodada": 3, "bloco": "Gestão do programa", "status": "respondida", "formulario": "FO-01", "respostas": ["EV-0034"], "respondida_por": ["PE-01"], "chave": "r3_diretor", "contexto": ["A especificação prevê aprovação do Diretor no desligamento. Na Rodada 2 você disse que o Igor não faz aprovação criteriosa: ele assina. A governança que os livros pedem (Keystone, Customer Success) é ter um dono único com autoridade e regras visíveis, não necessariamente uma aprovação em duas camadas.", "O desligamento já tem critérios objetivos no portal (tempo sem resultado, duas tentativas de retomada, tipo Desertor no cubo). A pergunta é só quem dá a palavra final."], "logica": "Se você é o dono do programa, a decisão é sua; se o desligamento tem peso de contrato, a assinatura do Igor no aviso fecha o rito sem exigir análise dele.", "citacoes": ["EV-0090", "EV-0091", "EV-0007"], "visual": "diretor"}, {"id": "Q-0010", "texto": "A cada mudança de etapa de uma oportunidade, o portal prepara a mensagem e você a envia no grupo do parceiro; no fim, mostra o impacto gerado (cliente fechado, valor, comissão). Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-010", "P-34", "P-34.fluxo", "P-31.fluxo", "P-80"], "para": ["PE-01"], "rodada": 3, "bloco": "A relação com o parceiro", "status": "respondida", "formulario": "FO-01", "respostas": ["EV-0229"], "respondida_por": ["PE-01"], "chave": "r3_ciclo", "contexto": ["Três livros novos chegam ao mesmo ponto. O Referral Engine diz para fechar o ciclo com quem indicou em cada fase, não só no fechamento. Give and Take mostra que quem dá se esgota quando não vê o impacto do que fez, não por dar demais. Business of Belonging diz que, sem validação, a participação não volta.", "Como o closer está fora do portal, o retorno ao parceiro só acontece se alguém o fizer. O portal detecta a mudança de etapa e deixa a mensagem pronta. Você só copia, ajusta e envia no WhatsApp, como já é o seu canal."], "logica": "O parceiro que vê o que sua indicação gerou indica de novo. Este é provavelmente o gesto de maior retorno do programa, e custa um minuto por etapa.", "citacoes": ["EV-0065", "EV-0066", "EV-0067"], "visual": "ciclo"}, {"id": "Q-0011", "texto": "Na integração, o parceiro aprende a indicar: o perfil do cliente ideal, frases que reconhecem a dor na conversa com o cliente dele e um gesto de indicação sem atrito. O que você adota?", "tipo": "multipla", "opcoes": ["Perfil do cliente ideal de cada empresa do grupo em uma página", "Frases-gatilho: o que o cliente diz quando precisa da Wise, da Tríade ou da Swallow", "Mensagem pronta de indicação para o parceiro enviar ao cliente dele", "Encontro curto de prática na integração"], "alvo": ["F-011", "P-29", "P-26.fluxo", "P-76", "P-77", "P-78", "P-90"], "para": ["PE-01"], "rodada": 3, "bloco": "A relação com o parceiro", "status": "respondida", "formulario": "FO-01", "respostas": ["EV-0250"], "respondida_por": ["PE-01"], "chave": "r3_ensinar", "contexto": ["O Referral Engine diz que a indicação falha mais por falta de método do que por falta de vontade. Quem indica precisa reconhecer o cliente certo e saber o que dizer, e qualquer atrito reduz a taxa de indicação.", "O kit de vendas e o simulador de ganho que você pediu já entram no portal do parceiro. A proposta acrescenta o que transforma conhecimento em gesto: as frases que o cliente do parceiro diz quando precisa de gestão comercial, e a mensagem pronta para apresentar a Wise."], "logica": "Ensinar a reconhecer o momento é mais barato que gerar lead do zero, e baixa o CAC sem mudar a comissão.", "citacoes": ["EV-0069", "EV-0070", "EV-0219"], "visual": "ensinar"}, {"id": "Q-0012", "texto": "Para cultivar a comunidade Wise Partners, o que você adota?", "tipo": "multipla", "opcoes": ["Um ou dois objetivos por fase (nesta, trazer parceiros e trazer oportunidades), medidos pelo portal", "Rituais de formato fixo: comunicado do mês, encontro trimestral de parceiros e mentoria mensal", "Um grupo geral da comunidade, além dos grupos por parceiro, com pedidos e contribuições à vista", "Reconhecimento por status, rede e acesso (destaque, acesso antecipado à Prateleira, palco), separado da comissão"], "alvo": ["P-47", "P-48", "P-49", "P-50", "P-51", "F-014", "F-012", "F-013", "P-82", "P-83"], "para": ["PE-01"], "rodada": 3, "bloco": "A relação com o parceiro", "status": "respondida", "formulario": "FO-01", "respostas": ["EV-0224"], "respondida_por": ["PE-01"], "chave": "r3_comunidade", "contexto": ["Business of Belonging diz que a comunidade precisa de um objetivo de negócio claro por fase, de rituais que se repetem e de validação. Diz também que trocar norma social por norma de mercado mata o pertencimento: o parceiro fica pela utilidade e pela identidade, não pelo pagamento.", "Give and Take traz o Anel de Reciprocidade: a maior parte do dar nasce de um pedido explícito, e o dar visível faz os outros darem também. Com um grupo por parceiro, ninguém vê ninguém dar. Por isso a proposta de um espaço geral, que fica opcional porque muda a dinâmica que você já tem.", "A comissão continua sendo a regra única que você decidiu, só fica fora da conversa da comunidade."], "logica": "Uma comunidade com objetivo, ritual e reconhecimento custa poucas horas e vira o lugar onde o parceiro decide ficar. Isso pesa na robustez do ecossistema e no CAC.", "citacoes": ["EV-0135", "EV-0076", "EV-0071", "EV-0199"], "visual": "comunidade"}, {"id": "Q-0013", "texto": "Na qualificação, você aprova incluir a leitura de comportamento (quem só toma se reconhece pelo que faz, não pela simpatia) e a regra de só aceitar quem a Wise indicaria ao seu melhor cliente?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["P-22.descricao", "F-002", "P-72"], "para": ["PE-01"], "rodada": 3, "bloco": "Atrair e selecionar", "status": "respondida", "formulario": "FO-01", "respostas": ["EV-0251"], "respondida_por": ["PE-01"], "chave": "r3_qualificacao", "contexto": ["Give and Take mostra que quem só toma costuma ser simpático com quem está acima e duro com quem está ao lado, e que se reconhece pelo comportamento e pela reputação. O Referral Engine dá a regra de entrada mais simples possível: só entra na rede quem você indicaria ao seu melhor cliente.", "Na prática, isso entra na ficha de jogo que você já aprovou, como duas perguntas: o que esse candidato já deu antes de pedir, e se a Wise o indicaria a um cliente importante. Sem formulário novo."], "logica": "Um tomador na rede consome horas, pede exceções e desanima quem dá. Filtrar na entrada é muito mais barato que desligar depois.", "citacoes": ["EV-0075", "EV-0142", "EV-0037"], "visual": "qualificacao"}, {"id": "Q-0014", "texto": "O CAC decide tudo desde o primeiro trimestre, ou o valor ao parceiro vem antes e o CAC passa a decidir a partir da Tração?", "tipo": "escolha", "opcoes": ["Manter: o CAC do Wise Partners decide desde o início", "Meio-termo: na Experimentação os portões medem comportamento (ativados, desfechos devolvidos, gestos de valor) e o CAC decide a partir da Tração", "Seguir os livros: valor devolvido ao parceiro e CAC lado a lado no painel, com o mesmo peso, em todas as fases"], "alvo": ["CT-06", "F-001", "F-039", "F-019", "F-032"], "para": ["PE-01"], "rodada": 4, "bloco": "Onde os livros discordam de você", "status": "respondida", "formulario": "FO-02", "respostas": ["EV-0028"], "respondida_por": ["PE-01"], "chave": "ct_cac", "contexto": ["Você pediu que as suas aprovações não pesassem mais que os livros. Esta é a divergência mais funda que apareceu ao reler tudo com essa regra. A sua decisão: o programa é um canal de aquisição mais barato que os canais ativos, e tudo se julga pelo CAC. Com a resposta da Rodada 3, o CAC é só o do Wise Partners, sem comparar com outros canais.", "Quatro livros dizem outra coisa sobre a ordem. Keystone: criar valor antes de capturar, e o hub que só extrai vira dono de pedágio. Give and Take: a vantagem de quem dá cresce com o tempo, e dar esperando retorno rápido costuma não funcionar. Customer Success: lealdade nasce de valor entregue. Business of Belonging: comunidade só entrega resultado de negócio depois de seis a doze meses, e quem vende de forma direta perde a confiança.", "Nenhum deles diz que o CAC é a métrica errada. Dizem que, nos primeiros trimestres, ele mede pouco e pode empurrar decisões que afastam o parceiro: cobrar indicação cedo demais, cortar quem ainda não trouxe cliente. Refiz os portões das fases sem comparar com outros canais: na Experimentação só comportamento e 3 clientes fechados; na Tração, o CAC caindo dois trimestres seguidos e abaixo de um terço do LTV dos mesmos clientes. O um terço é inferência minha, para calibrar com dados."], "logica": "Se o meio-termo for aceito, o CAC continua sendo a métrica-mãe e o motivo de existir do programa, mas só começa a decidir quando há dados suficientes para ele significar alguma coisa. Até lá, o que decide é se o parceiro está recebendo valor e se está agindo.", "citacoes": ["EV-0037", "EV-0038", "EV-0264", "EV-0265", "EV-0039"], "visual": "ct_cac", "recomendo": "Meio-termo"}, {"id": "Q-0015", "texto": "A comissão em dinheiro, igual para todos e paga só na aquisição, continua sendo o único incentivo financeiro?", "tipo": "escolha", "opcoes": ["Manter a regra única só na aquisição; o reconhecimento não monetário que você já adotou basta", "Meio-termo: dinheiro igual para todos, e o que varia por tipo de parceiro é o não monetário (acesso, palco, apoio), revendo a regra depois de dois trimestres com dados de permanência", "Seguir os livros: somar à regra única um bônus pequeno e igual para todos quando o cliente indicado completa 12 meses"], "alvo": ["CT-01", "F-029", "P-62"], "para": ["PE-01"], "rodada": 4, "bloco": "Onde os livros discordam de você", "status": "respondida", "formulario": "FO-02", "respostas": ["EV-0029"], "respondida_por": ["PE-01"], "chave": "ct_comissao", "contexto": ["A sua decisão: comissão por regra única, sem exceção (40% da primeira mensalidade na Wise Makers e na Tríade, 6% do projeto na Swallow). Simplicidade para não reduzir a adesão.", "Cinco livros discordam em pontos diferentes. Referral Engine e Business of Belonging: dinheiro é a motivação mais fraca para indicar e troca a norma social pela de mercado. O Método Octo: modelos baseados só em comissionamento podem ser limitantes. Strategic Alliances: além da comissão, premiar comportamento, como permanência do parceiro e frequência. Platform Revolution: o efeito de preço some quando o incentivo acaba.", "Dois livros apoiam a sua decisão em parte. Bech: regra de comissão simples e estável, sem mudar com frequência. Referral Engine: separar dinheiro de abordagem, com o dinheiro único e a abordagem variando por tipo. Na Rodada 3 você adotou reconhecimento por status, rede e acesso, separado da comissão. Isso já resolve metade da divergência. O que sobra é a comissão premiar só a aquisição, e não a permanência do cliente."], "logica": "A comissão paga a entrada do cliente; o programa quer também que ele fique, porque cliente que fica baixa o CAC real. Um bônus de permanência igual para todos mantém a regra única e alinha o incentivo ao LTV. Variar o não monetário mantém o dinheiro intocado.", "citacoes": ["EV-0072", "EV-0071", "EV-0114", "EV-0252", "EV-0121"], "visual": "ct_comissao", "recomendo": "Meio-termo"}, {"id": "Q-0016", "texto": "Como você fica sabendo que uma oportunidade mudou de etapa, para devolver ao parceiro, se o closer não registra nada?", "tipo": "escolha", "opcoes": ["O portal avisa quando a oportunidade fica 15 dias sem etapa nova, e só aí eu pergunto ao closer (exceção)", "Combino com cada closer um aviso curto por WhatsApp a cada etapa, sem portal", "As duas coisas: o aviso do closer quando acontece e o alerta do portal quando nada acontece", "Manter como está: falo com o closer só quando há indicação ou proposta nova"], "alvo": ["CT-02", "P-33", "P-34"], "para": ["PE-01"], "rodada": 4, "bloco": "Onde os livros discordam de você", "status": "respondida", "formulario": "FO-02", "respostas": ["EV-0026"], "respondida_por": ["PE-01"], "chave": "ct_closer", "contexto": ["A sua decisão: o lead vai direto ao closer da empresa do grupo, sem SLA e sem sistema para ele, e você conversa com o closer quando há indicação ou proposta nova. Na Rodada 3 você também aprovou devolver ao parceiro cada mudança de etapa.", "Aí está a divergência: para devolver cada etapa, alguém precisa saber que a etapa mudou. Referral Engine diz para fechar o ciclo com quem indicou em cada fase, não só no fechamento. Give and Take: quem dá se esgota quando não vê o impacto do que deu. Channel Advantage: cada passagem de bastão precisa de dono, prazo e registro. Customer Success: todo sinal precisa virar ação com dono e prazo.", "Nenhum livro exige que o closer entre no portal. Pedem só que o parceiro nunca fique sem notícia. Um combinado leve com os closers e um alerta de oportunidade parada cumprem isso sem criar SLA nem reunião."], "logica": "Sem uma fonte para a etapa, a promessa de fechar o ciclo vira esforço de memória. O alerta de oportunidade parada transforma o silêncio em exceção na sua fila, que é o princípio que você já aprovou.", "citacoes": ["EV-0065", "EV-0066", "EV-0254", "EV-0061"], "visual": "ct_closer", "recomendo": "As duas coisas"}, {"id": "Q-0017", "texto": "Os três pilares seguem abertos para todos, ou a Base Ativa começa com poucos parceiros-piloto?", "tipo": "escolha", "opcoes": ["Manter: Prateleira, Base Ativa e indicações abertas para todos desde o primeiro parceiro", "Meio-termo: os três abertos, mas a Base Ativa só com 2 ou 3 parceiros-piloto até virar um formato que se repete", "Meio-termo por parceiro: cada um começa pela porta que escolher e abre a próxima depois do primeiro valor", "Os dois meio-termos juntos"], "alvo": ["CT-03", "F-022", "P-44"], "para": ["PE-01"], "rodada": 4, "bloco": "Onde os livros discordam de você", "status": "respondida", "formulario": "FO-02", "respostas": ["EV-0019"], "respondida_por": ["PE-01"], "chave": "ct_pilares", "contexto": ["A sua decisão: os três pilares entram juntos desde o primeiro parceiro. Na Rodada 3 você aprovou que o portão de fase controla o ritmo de escala (parceiros, categorias, regiões), não a abertura dos pilares.", "Cinco livros dizem para provar valor numa escala pequena antes de abrir tudo. Keystone: liquidez em escala pequena antes de investir para escalar. Business of Belonging: comece pequeno e faça o que não escala. Winning the Right Game: o ecossistema mínimo viável é a menor configuração que gera evidência para atrair o próximo parceiro. O Método Octo: a primeira versão do programa é um teste controlado com poucos participantes. Nearbound: não ative todos de uma vez, isso decepciona os primeiros.", "O pilar mais pesado é a Base Ativa: 12 semanas, 6 encontros e um evento por ciclo. Com um Gerente só, abrir a Base Ativa para todos pode consumir as horas que deveriam ir para ativar parceiros. Prateleira e indicação custam pouco por parceiro."], "logica": "O meio-termo mantém a sua decisão comercial (os três pilares existem e são oferecidos) e aplica a regra dos livros só onde o custo de servir é alto. Quando a Base Ativa tiver um formato que se repete, abre para todos.", "citacoes": ["EV-0084", "EV-0077", "EV-0256", "EV-0255", "EV-0257"], "visual": "ct_pilares", "recomendo": "Os dois meio-termos juntos"}, {"id": "Q-0018", "texto": "Você continua dono de todas as tarefas sem limite, ou o programa ganha um teto de parceiros por pessoa e, na Tração, parceiros embaixadores que assumem parte dos rituais?", "tipo": "escolha", "opcoes": ["Manter: eu sou dono de tudo, sem teto", "Dono único com teto: acima de um número de parceiros acompanhados de perto (calculado pelas horas), o parceiro passa ao atendimento pelo portal e pela comunidade", "Teto agora e, na Tração, o papel de parceiro embaixador, que conduz parte dos rituais da comunidade e da Base Ativa com roteiro pronto"], "alvo": ["CT-04", "PA-01"], "para": ["PE-01"], "rodada": 4, "bloco": "Onde os livros discordam de você", "status": "respondida", "formulario": "FO-02", "respostas": ["EV-0030"], "respondida_por": ["PE-01"], "chave": "ct_dono", "contexto": ["A sua decisão: o Gerente de Parcerias é dono de todas as tarefas do portal, mesmo das executadas por outros.", "Aqui os livros se dividem. Apoiam você: o Método Octo, que prefere atividades centralizadas em poucas pessoas no início para encurtar o ciclo de aprendizado, e Customer Success, que pede um dono único para a retenção. Discordam: Business of Belonging, para quem distribuir controle com trilhos é o que permite escalar, e Give and Take, que descreve o doador que espalha o tempo em tudo e se esgota.", "Customer Success dá a ponte: dono único, mas com teto de clientes por gerente na atenção alta e o resto em atendimento um para muitos. É a atenção proporcional que você já aprovou, com um número."], "logica": "O teto transforma o limite das suas horas numa regra visível, em vez de uma sobrecarga silenciosa. O embaixador é o primeiro passo para o programa não depender de uma pessoa só, que é a robustez que a saúde do ecossistema mede.", "citacoes": ["EV-0258", "EV-0091", "EV-0058", "EV-0259", "EV-0260"], "visual": "ct_dono", "recomendo": "Teto agora e embaixador na Tração"}, {"id": "Q-0019", "texto": "O parceiro entra já em Elite, Premium ou Select pela base de clientes que declara, ou todos entram no mesmo nível e sobem pelo resultado?", "tipo": "escolha", "opcoes": ["Manter a especificação: nível de entrada pela faixa de clientes no ICP", "Seguir Bech: todos entram em Select e sobem na hora em que cumprem os requisitos do nível de cima", "Meio-termo: a faixa de clientes sugere o nível, mas o pacote do nível só abre depois da ativação"], "alvo": ["CT-05", "P-69", "P-61"], "para": ["PE-01"], "rodada": 4, "bloco": "Onde os livros discordam de você", "status": "respondida", "formulario": "FO-02", "respostas": ["EV-0032"], "respondida_por": ["PE-01"], "chave": "ct_niveis", "contexto": ["A especificação 002 define o nível de entrada pela quantidade de clientes no ICP que o candidato declara: Elite com 50 ou mais, Premium de 15 a 49, Select abaixo de 15, ajustado pela nota de qualidade.", "Bech diz o contrário: começar com uma estrutura simples e diferenciar só quando o desempenho real se mostrar diferente. E alerta: com poucos parceiros, todos querem o nível de cima, e depois é preciso rebaixar quem não entrega, o que desgasta a relação. O Método Octo apoia três níveis como a forma mais simples, mas fala da estrutura, não de como se entra nela.", "A subida na hora, que você já aprovou, resolve o lado de quem entrega. A divergência é só sobre quem ainda não entregou nada."], "logica": "Nível por promessa dá benefício antes do valor; nível por resultado dá benefício depois. O segundo evita rebaixar e combina com o princípio de que o parceiro só conta quando ativa.", "citacoes": ["EV-0262", "EV-0263", "EV-0268"], "visual": "ct_niveis", "recomendo": "Meio-termo"}, {"id": "Q-0020", "texto": "No painel da semana com o Igor, quais números entram? Escolha no máximo cinco.", "tipo": "multipla", "opcoes": ["CAC do Wise Partners no trimestre e a tendência", "Parceiros ativos, novos e em risco", "Oportunidades abertas por etapa e as paradas há mais de 15 dias", "Clientes fechados e receita vinda de parceiros no trimestre", "Parceiros que mudaram de tipo no cubo nesta semana", "Distância do próximo portão de fase", "Desfechos devolvidos aos parceiros (quantas oportunidades tiveram retorno)", "Horas dedicadas ao programa na semana"], "alvo": ["P-10.indicadores", "F-032"], "para": ["PE-01"], "rodada": 4, "bloco": "O ritual com o Igor", "status": "respondida", "formulario": "FO-02", "respostas": ["EV-0031"], "respondida_por": ["PE-01"], "chave": "painel", "contexto": ["Você pediu um painel relativamente simples, com informação estratégica, que ao mesmo tempo deixe falar de cada caso. Por isso o ritual semanal virou Revisar o programa com o Igor: substitui a revisão com os closers e o resumo mensal, que saíram.", "A proposta tem duas partes. Em cima, poucos números estratégicos, os mesmos toda semana. O Método Octo conta que a Caju reduziu mais de 60 indicadores para 6 por fase, e recomenda não sobrecarregar o time com métricas. Embaixo, a lista de casos: cada parceiro que mudou de tipo, cada oportunidade parada e cada decisão pendente, com o histórico e a jogada sugerida, para vocês decidirem o próximo passo ali mesmo.", "Customer Success acrescenta o motivo do ritual: a retenção precisa de voz no topo e de métricas visíveis para quem decide. O painel dá isso ao Igor sem pedir aprovação criteriosa dele."], "logica": "Cinco números cabem numa tela e numa conversa de meia hora. O resto da conversa é caso a caso, que é onde as decisões de verdade acontecem.", "citacoes": ["EV-0148", "EV-0147", "EV-0091", "EV-0123"], "visual": "painel", "recomendo": ""}, {"id": "Q-0021", "texto": "O Igor aparece para os parceiros como a voz do programa, por exemplo abrindo o encontro trimestral?", "tipo": "escolha", "opcoes": ["Sim, ele abre o encontro trimestral", "Sim, ele grava uma mensagem por trimestre", "Não, a voz do programa sou eu", "Não sei: perguntar ao Igor"], "alvo": ["P-83"], "para": ["PE-01"], "rodada": 4, "bloco": "O ritual com o Igor", "status": "respondida", "formulario": "FO-02", "respostas": ["EV-0222"], "respondida_por": ["PE-01"], "chave": "igor_voz", "contexto": ["Na Rodada 2 você decidiu que o Igor só assina, e na Rodada 3, que ele revê o programa com você toda semana. Falta um ponto que dois livros levantam: quem é a voz do programa para os parceiros.", "Referral Engine vê o dono da empresa como contador de histórias e guardião do sistema de indicação. Customer Success diz que o compromisso precisa vir de cima. Nenhum dos dois pede aprovação do Igor, só presença."], "logica": "Uma fala curta do Diretor por trimestre mostra aos parceiros que o programa tem peso na empresa, sem tirar nada da sua autonomia.", "citacoes": ["EV-0091", "EV-0223"], "visual": "igor_voz", "recomendo": ""}, {"id": "Q-0022", "texto": "As formações internas do grupo Tríade ficam abertas a todos os parceiros ou são um acesso de reconhecimento?", "tipo": "escolha", "opcoes": ["Abertas a todos os parceiros ativos", "Abertas a todos, com vagas reservadas para os destaques", "Acesso de reconhecimento: só para os destaques e os níveis de cima"], "alvo": ["P-85.regras"], "para": ["PE-01"], "rodada": 4, "bloco": "A comunidade", "status": "respondida", "formulario": "FO-02", "respostas": ["EV-0225"], "respondida_por": ["PE-01"], "chave": "triade", "contexto": ["Você acrescentou na Rodada 3 o convite aos parceiros para as formações internas do grupo Tríade. Ele entrou no mapa como subprocesso de Cultivar a comunidade.", "Business of Belonging oferece duas leituras: pedir pouco no começo e aumentar o pedido conforme cresce o compromisso, e recompensar com acesso, que é norma social. Give and Take lembra que o acesso visível a quem dá incentiva os outros a dar."], "logica": "Aberto a todos fortalece o pertencimento e o conhecimento para indicar. Como reconhecimento, vira um dos acessos que a Rodada 3 adotou no lugar do dinheiro.", "citacoes": ["EV-0110", "EV-0071", "EV-0074"], "visual": "triade", "recomendo": ""}, {"id": "Q-0023", "texto": "O portal mede o equilíbrio entre o que cada parceiro dá e recebe, ou o programa dá primeiro sem manter placar?", "tipo": "escolha", "opcoes": ["Manter o que aprovei: o equilíbrio entra na Relação do cubo e aparece na comunidade", "Meio-termo: o portal mede o equilíbrio só para a leitura interna do cubo, e o parceiro nunca vê placar; na comunidade aparece o dar, não a conta", "Seguir Never Eat Alone: tirar o equilíbrio do cubo; a Relação fica só com o pulso e o retorno mútuo"], "alvo": ["CT-07", "F-013", "P-67"], "para": ["PE-01"], "rodada": 4, "bloco": "Onde os livros discordam de você", "status": "respondida", "formulario": "FO-02", "respostas": ["EV-0033"], "respondida_por": ["PE-01"], "chave": "ct_placar", "contexto": ["Esta divergência é entre dois livros, e a sua aprovação da Rodada 3 ficou do lado de um deles. Give and Take mostra que a maior parte do dar nasce de um pedido explícito, que o dar visível faz os outros darem, e que quem só toma se reconhece pelo comportamento. Por isso o cubo mede o equilíbrio entre indicações enviadas e recebidas, e você aprovou.", "Never Eat Alone diz o contrário na superfície: é melhor dar antes de receber, e nunca manter placar. A moeda da rede é a generosidade, não a ganância. Mas o mesmo livro, quando fala de trocar redes com outra pessoa, pede que os dois sejam parceiros iguais, que dão tanto quanto recebem.", "A conciliação entre os dois está em quem vê a conta. Give and Take quer o dar visível, não o saldo de cada um. Ferrazzi condena o placar como atitude com o outro, não a gestão do relacionamento."], "logica": "Medir por dentro e mostrar só o dar mantém a utilidade do dado para encontrar quem só toma, sem transformar a comunidade numa contabilidade de favores, que é a troca de norma social por norma de mercado que Business of Belonging também condena.", "citacoes": ["EV-0041", "EV-0267", "EV-0074", "EV-0075", "EV-0071"], "visual": "ct_placar", "recomendo": "Meio-termo"}, {"id": "Q-0024", "texto": "Do sistema de relacionamento de Never Eat Alone, o que entra na rotina do programa?", "tipo": "multipla", "opcoes": ["Cadência de contato por importância: mensal para atenção alta, trimestral para os demais ativos, duas a três vezes por ano para candidatos e ex-parceiros", "Cada contato leva algo de valor (oportunidade, conteúdo ou apresentação), nunca só o \"como vai\"", "Retorno em até 24 horas depois de cada reunião com parceiro ou candidato", "Quem sai da parceria continua na lista, com contato duas a três vezes por ano", "As mensagens que o portal prepara sempre saem personalizadas por mim, nunca em massa"], "alvo": ["P-46", "F-015", "F-017"], "para": ["PE-01"], "rodada": 4, "bloco": "Never Eat Alone", "status": "respondida", "formulario": "FO-02", "respostas": ["EV-0239"], "respondida_por": ["PE-01"], "chave": "nea_cadencia", "contexto": ["Never Eat Alone é o 17º livro, o que faltava. É um livro de rede pessoal, não de programa de parceiros, então ele não confirma nem contraria os fatores do cubo. O que ele traz de novo é o método de manter relações vivas, e isso tinha uma lacuna no to-be: havia jogada por tipo, mas não havia o contato de rotina entre uma jogada e outra.", "O livro chama esse contato de ping e dá regras de bolso: um vínculo novo precisa ver o seu nome em três meios diferentes; depois, um contato por mês; para virar amigo, dois encontros fora do escritório; para manter um laço secundário, dois a três contatos por ano. Para as pessoas importantes, o autor prefere o contato que agrega valor. E diz que o retorno entre 12 e 24 horas depois de conhecer alguém já coloca você acima de 95% das pessoas.", "Ele também avisa contra a eficiência que mata a relação: o autor errou mandando cartões em massa e conclui que conectar não é jogo de números. No portal, isso vira o processo 7.6, Manter a cadência de contato com o parceiro: o portal lembra quem passou da cadência e sugere o que levar; o contato é seu."], "logica": "A cadência é a parte do relacionamento que não depende de oportunidade. É ela que impede o parceiro de esfriar entre uma indicação e outra, que é a causa do tipo Âncora esfriando.", "citacoes": ["EV-0269", "EV-0095", "EV-0193", "EV-0097", "EV-0096", "EV-0270"], "visual": "nea_cadencia", "recomendo": ""}, {"id": "Q-0025", "texto": "Para a Wise ser a ponte entre os parceiros, o que você adota?", "tipo": "multipla", "opcoes": ["Apresentar parceiros entre si sem esperar pedido, sempre em torno de uma oportunidade específica", "Avisar quem apresentou de como foi a conversa", "Encontro presencial o seu sim, o processo passa de declarado para confirmado.", "citacoes": [], "visual": "proc:P-93"}, {"id": "Q-0043", "texto": "2.4 Conduzir o fechamento trimestral: o passo a passo está correto?", "tipo": "confirmacao", "opcoes": ["Sim, está correto", "Corrigir (comente)"], "alvo": ["P-12.fluxo"], "para": ["PE-01"], "rodada": 5, "bloco": "Passo a passo que veio da especificação", "status": "respondida", "formulario": "FO-03", "respostas": ["EV-0288"], "respondida_por": ["PE-01"], "chave": "val_fluxo_2.4", "contexto": ["De onde veio: Especificação 002, The Keystone Advantage."], "logica": "O passo a passo só vira confirmado com a validação do dono. Se algum passo estiver diferente do que você quer, diga qual no comentário.", "citacoes": [], "visual": "fluxo:P-12"}, {"id": "Q-0044", "texto": "7.4 Conduzir o ciclo do Base Ativa: o passo a passo está correto?", "tipo": "confirmacao", "opcoes": ["Sim, está correto", "Corrigir (comente)"], "alvo": ["P-44.fluxo"], "para": ["PE-01"], "rodada": 5, "bloco": "Passo a passo que veio da especificação", "status": "respondida", "formulario": "FO-03", "respostas": ["EV-0289"], "respondida_por": ["PE-01"], "chave": "val_fluxo_7.4", "contexto": ["De onde veio: Especificação 001, Playbook Wise Partners v3.1."], "logica": "O passo a passo só vira confirmado com a validação do dono. Se algum passo estiver diferente do que você quer, diga qual no comentário.", "citacoes": [], "visual": "fluxo:P-44"}, {"id": "Q-0045", "texto": "Para parceiros de software de gestão, o valor central da Wise passa a ser a retenção da base deles, com a entrega da Wise dentro do processo do parceiro. Você aprova?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-040"], "para": ["PE-01"], "rodada": 6, "bloco": "A nova proposta de valor", "status": "em_formulario", "formulario": "FO-04", "respostas": [], "chave": "valor_saas", "contexto": ["Na conversa com o Igor apareceu a ideia que mais muda o modelo de negócio desde a Rodada 1. Até aqui, o valor para o parceiro era receber demanda de volta, conhecimento para indicar, comunidade e comissão. A conversa trouxe um valor mais forte para um tipo específico de parceiro: o software de gestão (CRM, ERP e afins).", "O raciocínio da conversa: a base de clientes do software depende de eficiência comercial para continuar pagando. Muitos clientes não usam a ferramenta inteira porque não têm processo de gestão. A Wise resolve exatamente isso. Então a Wise ajuda o parceiro a reter a própria base, e não só a ganhar comissão.", "A frase-chave foi: o que a gente entrega tem que fazer parte do processo dele. Isso converge com Keystone (criar valor antes de capturar) e com Referral Engine (o parceiro que recebe valor indica melhor). Também foi citado que dois parceiros com quem você conversou na semana passada estão ávidos por isso."], "logica": "Se a entrega da Wise vira parte do processo do parceiro, a indicação deixa de depender de lembrança ou boa vontade: ela acontece toda vez que o parceiro ganha um cliente. É o mesmo efeito que os softwares conseguem com programas de milhares de parceiros, numa escala que cabe na Wise.", "citacoes": ["EV-0290", "EV-0291", "EV-0037", "EV-0042"], "visual": "valor_saas", "recomendo": "Aprovo"}, {"id": "Q-0046", "texto": "O diagnóstico comercial gratuito para cada cliente novo do parceiro vira a entrega padrão do programa?", "tipo": "escolha", "opcoes": ["Sim, para todos os parceiros, desde já", "Sim, só para parceiros de software de gestão", "Primeiro como piloto com 2 ou 3 parceiros, depois padroniza", "Não (comente)"], "alvo": ["F-041", "P-95"], "para": ["PE-01"], "rodada": 6, "bloco": "O diagnóstico como entrega padrão", "status": "em_formulario", "formulario": "FO-04", "respostas": [], "chave": "diagnostico", "contexto": ["A proposta da conversa: todo cliente novo do parceiro recebe a oferta de uma reunião de diagnóstico com a Wise, de 40 a 60 minutos, que termina com um mapa de planejamento. Depois do diagnóstico, o cliente ganha acesso ao Wise Hub. Se ele quiser seguir, vira oportunidade.", "No mapa, isso vira a quinta porta de oportunidade (junto com link, Prateleira, cruzamento de carteiras e Base Ativa) e um processo novo: 6.9 Conduzir o diagnóstico do cliente do parceiro.", "A conversa também levantou o limite: a Wise não escala como um software, e cada diagnóstico custa uma hora de alguém. Uma por dia dá cerca de 20 por mês. Os livros que você seguiu na Rodada 4 pedem começar pequeno e provar antes de abrir para todos."], "logica": "Um piloto com os dois ou três parceiros que já estão ávidos mostra, em poucas semanas, quantos clientes aceitam o diagnóstico, quantos viram oportunidade e quanto tempo isso consome. Com esses números, padronizar fica seguro.", "citacoes": ["EV-0292", "EV-0293", "EV-0305", "EV-0084", "EV-0063"], "visual": "diagnostico", "recomendo": "Primeiro como piloto"}, {"id": "Q-0047", "texto": "Quem conduz os diagnósticos, e com que limite?", "tipo": "escolha", "opcoes": ["Eu, no máximo um por dia", "Eu e os consultores da Wise, com o meu roteiro", "Os consultores, e eu acompanho pela fila", "Não sei: decidir com o Igor"], "alvo": ["P-95"], "para": ["PE-01"], "rodada": 6, "bloco": "O diagnóstico como entrega padrão", "status": "em_formulario", "formulario": "FO-04", "respostas": [], "chave": "quem_diagnostica", "contexto": ["Na conversa, o cálculo foi seu: uma entrevista de 40 minutos por dia fecha 50 em dois meses. Isso funciona enquanto o diagnóstico serve também à pesquisa. Se ele virar entrega padrão do programa, a demanda pode passar disso.", "Customer Success chama atenção para o mesmo ponto: atenção de alta intensidade cabe a poucos por pessoa, e o resto precisa de um formato um para muitos. Você manteve, na Rodada 4, ser dono de tudo sem teto. O diagnóstico é a primeira entrega que pode passar desse limite, porque não depende só de você."], "logica": "Definir agora quem conduz e qual é o limite evita prometer ao parceiro uma oferta que a agenda não sustenta.", "citacoes": ["EV-0298", "EV-0058", "EV-0258"], "visual": "quem_diagnostica", "recomendo": ""}, {"id": "Q-0048", "texto": "Como fica o acesso ao Wise Hub?", "tipo": "escolha", "opcoes": ["Só depois de um contato com a Wise: diagnóstico para o cliente do parceiro, pacote B para a base do parceiro", "Hub aberto a toda a base do parceiro, como benefício solto", "Só pelo pacote B, como no Playbook v3.1 (sem acesso pelo diagnóstico)"], "alvo": ["F-042"], "para": ["PE-01"], "rodada": 6, "bloco": "O diagnóstico como entrega padrão", "status": "em_formulario", "formulario": "FO-04", "respostas": [], "chave": "hub", "contexto": ["Hoje o Playbook v3.1 põe o Wise Hub com as duas marcas no pacote B, para a base de Premium e Elite que divulgam. A conversa trouxe uma preocupação: oferecer o Hub para todo mundo, como publicidade, pode desvalorizar a plataforma.", "E trouxe uma observação de mercado: plataforma de aulas sozinha gera pouco engajamento. O que engaja é o contato antes: o cliente faz o diagnóstico, vê o que está errado no negócio dele, e aí recebe as aulas que resolvem aquilo."], "logica": "O acesso depois do contato preserva o valor do Hub e aumenta o uso, porque o cliente chega à plataforma sabendo o que procurar.", "citacoes": ["EV-0295", "EV-0296", "EV-0109"], "visual": "hub", "recomendo": "Só depois de um contato"}, {"id": "Q-0049", "texto": "O diagnóstico do programa fica ligado ao seu projeto de pesquisa sobre maturidade comercial e CRM?", "tipo": "escolha", "opcoes": ["Sim, como campanha de lançamento até março, se a universidade aprovar o formato", "Sim, mas a pesquisa usa só o roteiro: o retorno comercial fica separado e opcional", "Não ligar as duas coisas"], "alvo": ["F-043"], "para": ["PE-01"], "rodada": 6, "bloco": "O diagnóstico como entrega padrão", "status": "em_formulario", "formulario": "FO-04", "respostas": [], "chave": "pesquisa", "contexto": ["Você contou ao Igor que precisa entrevistar 50 empresas até março para o projeto de pesquisa, e que já tem o roteiro de diagnóstico. A ideia foi juntar as duas coisas: os parceiros convidam os clientes deles, o cliente recebe o diagnóstico e o acesso ao Hub, a pesquisa ganha as entrevistas e a Wise ganha contato com empresas no ICP.", "Há um cuidado que a conversa já começou a tratar: você ia confirmar com a universidade se o vínculo pode ser apresentado assim. Quando a mesma conversa serve à pesquisa e à venda, o participante precisa saber disso desde o convite. Isso pede um termo de consentimento que separe o uso científico dos dados do contato comercial, e o direito de participar da pesquisa sem receber contato comercial depois."], "logica": "Ligar as duas coisas resolve o seu problema de agenda e dá ao programa uma campanha de lançamento com motivo claro. Separar o retorno comercial protege a pesquisa e a confiança do cliente do parceiro.", "citacoes": ["EV-0297", "EV-0299", "EV-0316"], "visual": "pesquisa", "recomendo": ""}, {"id": "Q-0050", "texto": "O parceiro recebe o resultado do diagnóstico do cliente dele?", "tipo": "escolha", "opcoes": ["Sim, só com autorização escrita do cliente, dada no próprio agendamento", "Só um resumo agregado da base dele, sem identificar nenhum cliente", "Não: o resultado é só do cliente"], "alvo": ["P-95.regras"], "para": ["PE-01"], "rodada": 6, "bloco": "O diagnóstico como entrega padrão", "status": "em_formulario", "formulario": "FO-04", "respostas": [], "chave": "resumo_parceiro", "contexto": ["Na conversa apareceu a ideia de dar ao time de sucesso do cliente do parceiro um resumo do diagnóstico: quem usa pouco o sistema, quem tem dificuldade. Para o parceiro de software, isso vale muito, porque mostra onde a base dele está em risco.", "A regra de dados que você já aprovou no programa é: só dados de empresa, cruzamento com consentimento e só as coincidências reveladas. O diagnóstico é uma conversa do cliente com a Wise. Passar o conteúdo ao parceiro sem autorização quebra a confiança que o próprio diagnóstico cria."], "logica": "O resumo agregado dá ao parceiro o padrão da base sem expor ninguém. A autorização individual permite o detalhe quando o cliente quer ajuda do parceiro.", "citacoes": ["EV-0313", "EV-0202", "EV-0317"], "visual": "resumo_parceiro", "recomendo": ""}, {"id": "Q-0051", "texto": "Se o cliente contrata a Wise depois do diagnóstico oferecido pelo parceiro, isso gera comissão para o parceiro?", "tipo": "escolha", "opcoes": ["Sim, como indicação normal, quando o cliente marcou pelo link do parceiro", "Sim, mas com uma regra própria (comente)", "Não: o diagnóstico já é o valor que a Wise entrega ao parceiro"], "alvo": ["F-044"], "para": ["PE-01"], "rodada": 6, "bloco": "O diagnóstico como entrega padrão", "status": "em_formulario", "formulario": "FO-04", "respostas": [], "chave": "comissao_diag", "contexto": ["O Playbook v3.1 diz que comissiona quem gerou o primeiro contato registrado. Se o cliente chega ao diagnóstico pelo link do parceiro, o primeiro contato é do parceiro. A conversa também lembrou que os clientes menores dos parceiros, de sistemas mais simples, são possíveis clientes da Wise.", "Você decidiu que a comissão é regra única, sem exceção. A dúvida aqui é só se o diagnóstico conta como indicação. Se não contar, o parceiro passa a mandar clientes para a Wise sem ganhar nada quando eles fecham."], "logica": "A regra mais simples e coerente com a sua decisão é tratar o link do parceiro como o registro de origem, como já acontece com a indicação.", "citacoes": ["EV-0300", "EV-0301", "EV-0072"], "visual": "comissao_diag", "recomendo": "Sim, pelo link"}, {"id": "Q-0052", "texto": "Para o parceiro convidar os clientes dele ao diagnóstico, o que entra no kit?", "tipo": "multipla", "opcoes": ["Página com vídeo da Wise explicando o diagnóstico gratuito e o que o cliente leva", "Mensagem pronta para o parceiro enviar, já com o link dele", "Agenda online para o cliente marcar sozinho", "Vídeo curto gravado junto com o parceiro", "Texto padrão para o parceiro incluir no processo de entrada do cliente dele"], "alvo": ["P-96"], "para": ["PE-01"], "rodada": 6, "bloco": "O diagnóstico como entrega padrão", "status": "em_formulario", "formulario": "FO-04", "respostas": [], "chave": "convite_kit", "contexto": ["A conversa terminou com a pergunta prática: como o parceiro convida o cliente? Manda uma página? Um vídeo? Marca uma reunião? A resposta que surgiu foi uma página com vídeo e um link que o parceiro envia.", "Referral Engine diz que o gesto de indicar precisa ser fácil, com a ferramenta pronta na mão de quem indica. O último item da lista leva a ideia central da conversa ao fim: o convite entra no processo de entrada de todo cliente novo do parceiro."], "logica": "Quanto menos o parceiro precisa explicar, mais clientes chegam ao diagnóstico.", "citacoes": ["EV-0314", "EV-0315", "EV-0070"], "visual": "convite_kit", "recomendo": ""}, {"id": "Q-0053", "texto": "No plano de ativação de 90 dias, o que o parceiro recebe logo no começo?", "tipo": "multipla", "opcoes": ["Semana 1: anúncio conjunto da parceria, com postagem dos dois lados", "Mês 1: treinamento curto de gestão comercial para o time do parceiro", "Mês 1: diagnóstico dos dois ou três primeiros clientes do parceiro", "Mês 2: divulgação do diagnóstico e do treinamento para a base do parceiro", "Mês 3: encontro com a base do parceiro e as primeiras oportunidades"], "alvo": ["P-94"], "para": ["PE-01"], "rodada": 6, "bloco": "Foco e ativação", "status": "em_formulario", "formulario": "FO-04", "respostas": [], "chave": "ativacao", "contexto": ["A conversa abriu com um exemplo de outro programa: na entrada, o objetivo é fazer o parceiro ganhar dinheiro rápido, com um plano de 30 dias semana a semana. A conclusão foi que a Wise precisa de uma ação de início que agregue valor desde o primeiro mês, em vez de esperar dois ou três meses.", "O mapa já tinha o princípio (primeiro valor em até 90 dias, entregue em fatias), mas não tinha as fatias. Esta pergunta as define. O processo novo é o 5.5 Executar o plano de ativação de 90 dias, que vale para todos os pacotes. A escada do Playbook continua valendo: o que exige mais horas, como a Base Ativa, segue só para o pacote A."], "logica": "Uma ação concreta na primeira semana dá ao parceiro uma razão para falar da Wise antes de ter qualquer indicação, e o treinamento faz o time dele sentir o valor que depois vai indicar.", "citacoes": ["EV-0310", "EV-0311", "EV-0312", "EV-0063"], "visual": "ativacao", "recomendo": ""}, {"id": "Q-0054", "texto": "Na fase de Experimentação, em que segmento de parceiro o programa foca?", "tipo": "escolha", "opcoes": ["Software de gestão, com CRM e ERP à frente", "Só software de CRM", "Software de gestão de manutenção", "Sem foco: todas as categorias ao mesmo tempo"], "alvo": ["F-045"], "para": ["PE-01"], "rodada": 6, "bloco": "Foco e ativação", "status": "em_formulario", "formulario": "FO-04", "respostas": [], "chave": "foco", "contexto": ["A conversa passou pela lista inteira de categorias e chegou a duas opiniões. Agências concorrem demais com a Wise. Software, sobretudo de CRM, é melhor, porque a dor do cliente dele é a mesma que a Wise resolve. Também apareceu, de passagem, o software de gestão de manutenção como exemplo de foco.", "Ecosystem Economy recomenda focar num segmento de parceiro por vez e entregar uma melhora forte a poucos, em vez de uma oferta rasa para todos. Keystone diz para provar a liquidez num recorte pequeno antes de ampliar. O foco não fecha a porta para os outros: só decide onde vão as horas de recrutamento agora."], "logica": "Com um segmento só, o diagnóstico, o kit e o discurso ficam iguais para todos os parceiros da fase, e os resultados ficam comparáveis.", "citacoes": ["EV-0302", "EV-0303", "EV-0304", "EV-0306", "EV-0084"], "visual": "foco", "recomendo": "Software de gestão"}, {"id": "Q-0055", "texto": "A lista de categorias citada na conversa vira a lista oficial do portal (Prateleira e cadastro de parceiros)?", "tipo": "escolha", "opcoes": ["Aprovo como está", "Aprovo com ajustes (comente)", "Não aprovo (comente)"], "alvo": ["F-046"], "para": ["PE-01"], "rodada": 6, "bloco": "Foco e ativação", "status": "em_formulario", "formulario": "FO-04", "respostas": [], "chave": "categorias", "contexto": ["Comerciais: ERP, CRM, PCP, SST, ESG, EPM, consultoria de gestão, design, tecnologia digital, infraestrutura e data center, dados e ciência de dados, software de gestão de manutenção, automação industrial, qualidade e laboratório, eficiência energética, segurança da informação, comércio exterior e logística internacional, jurídico, tributário, contabilidade consultiva e RH.", "Institucionais: federações e confederações, Sistema S, institutos, associações comerciais e empresariais, associações setoriais, secretarias de indústria e comércio, sindicatos patronais, parques tecnológicos e universidades.", "A transcrição é automática e alguns nomes saíram truncados. Se faltou ou sobrou alguma categoria, escreva no comentário."], "logica": "O portal precisa de uma lista fechada para a Prateleira recomendar parceiros por categoria e para o painel mostrar a cobertura de cada uma.", "citacoes": ["EV-0307", "EV-0308"], "visual": "categorias", "recomendo": ""}, {"id": "Q-0056", "texto": "Este é o último formulário antes de levar o to-be ao portal. O que entra na primeira entrega?", "tipo": "multipla", "opcoes": ["Núcleo: card do parceiro, jornada, oportunidades com as cinco portas e fila única de exceções", "Painel da semana com o Igor, com os oito números e a lista de casos", "Área do parceiro: kit, link exclusivo, simulador de ganho, oportunidades e regras", "Diagnóstico: agendamento pelo link do parceiro, registro e liberação do Hub", "Plano de ativação de 90 dias, com as tarefas de cada mês", "Cubo e tipos, com a jogada sugerida", "Cadência de contato e lembretes", "Comunidade: comunicado do mês, encontros e reconhecimento"], "alvo": ["F-047"], "para": ["PE-01"], "rodada": 6, "bloco": "Para levar ao portal", "status": "em_formulario", "formulario": "FO-04", "respostas": [], "chave": "portal_escopo", "contexto": ["O portal atual foi construído antes das cinco rodadas, e quase todo o to-be muda alguma coisa nele. Levar tudo de uma vez é o erro que Keystone descreve como o mais comum nos ecossistemas que falharam: investir grande em tecnologia antes da liquidez. Platform Revolution diz o mesmo de outro jeito: o núcleo da plataforma é pequeno, e o que serve a poucos fica na borda até provar valor.", "Customer Success acrescenta: racionalizar à mão antes de automatizar. O que você ainda vai testar (o diagnóstico em piloto, por exemplo) pode começar com registro simples e ganhar automação depois."], "logica": "Marque o que precisa estar no portal no dia em que o primeiro parceiro do to-be entrar. O resto entra em entregas seguintes, na ordem que o uso mostrar.", "citacoes": ["EV-0084", "EV-0309", "EV-0055"], "visual": "portal_escopo", "recomendo": "Núcleo, painel da semana, área do parceiro e diagnóstico"}, {"id": "Q-0057", "texto": "O Igor entra no portal?", "tipo": "escolha", "opcoes": ["Sim, para ver o painel da semana e os casos", "Sim, para ver o painel e assinar termos e avisos pelo portal", "Não: eu mostro o painel na conversa semanal"], "alvo": ["P-10.acesso_do_diretor"], "para": ["PE-01"], "rodada": 6, "bloco": "Para levar ao portal", "status": "em_formulario", "formulario": "FO-04", "respostas": [], "chave": "igor_portal", "contexto": ["Você decidiu que toda semana revê o programa com o Igor, apoiado no painel, e que ele assina o termo e o aviso formal. Para levar isso ao portal, falta saber se ele acessa o portal ou se o painel só aparece na sua tela durante a conversa.", "Customer Success pede métricas visíveis para quem decide, mas não exige que o diretor opere o sistema. A assinatura continua no Autentique em qualquer opção."], "logica": "Isso define as permissões do portal: quem vê o quê. Com acesso só de leitura, o Igor
