<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101012" />
    <title>Portal Wise Partners</title>
    <!-- Landing pages: a configuração vem da Supabase e a capa do vídeo, do YouTube; conectar cedo encurta a espera -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <!-- Tema antes da primeira pintura (mesma regra de src/lib/tema.ts): áreas logadas seguem a escolha ou o sistema; páginas públicas, escuro -->
    <script>
      (function () {
        var p = "sistema";
        try { p = localStorage.getItem("wp-tema") || "sistema"; } catch (e) {}
        var logada = /^\/(app|parceiro)(\/|$)/.test(location.pathname);
        var escuro = !logada || p === "escuro" || (p !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (escuro) document.documentElement.classList.add("dark");
        else document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f5f5f7");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
